<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var host = String(window.location.hostname || '');
        var isLocal = host === '127.0.0.1' || host === 'localhost';
        if (isLocal && window.location.protocol === 'https:') {
          window.location.replace('http://' + window.location.host + window.location.pathname + window.location.search + window.location.hash);
          return;
        }
        if (isLocal && window.location.protocol === 'http:' && !/\/line_report[\-\/]/.test(window.location.pathname)) {
          var port = window.location.port || '8765';
          window.location.replace('http://127.0.0.1:' + port + '/line_report/weekly-report.html' + window.location.search + window.location.hash);
          return;
        }
        if (window.location.protocol !== 'file:') return;
        var next = 'http://127.0.0.1:8765/line_report/weekly-report.html' + (window.location.search || '') + (window.location.hash || '');
        window.location.replace(next);
      } catch (_) {}
    })();
  </script>
  <base href="/line_report/">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://hocbnifuactbvmyjraxy.supabase.co; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <meta name="theme-color" content="#15171d">
  <title>フードコート 週次経営分析レポート</title>
  
  <link href="https://cdn.jsdelivr.net/npm/chart.js" rel="prefetch">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  
  <style>
    :root {
      --bg:        oklch(0.16 0.014 256);
      --bg2:       oklch(0.135 0.012 256);
      --surface:   oklch(0.215 0.017 258);
      --surface2:  oklch(0.255 0.019 258);
      --hover:     oklch(0.29 0.021 258);
      --line:      oklch(1 0 0 / 0.08);
      --line-soft: oklch(1 0 0 / 0.05);
      --tx-1:      oklch(0.97 0 0);
      --tx-2:      oklch(0.75 0.012 258);
      --tx-3:      oklch(0.57 0.014 258);
      --accent:    oklch(0.62 0.17 256);
      --accent-tx: oklch(0.76 0.13 256);
      --accent-soft: oklch(0.62 0.17 256 / 0.16);
      --good:      oklch(0.74 0.15 158);
      --good-soft: oklch(0.74 0.15 158 / 0.16);
      --bad:       oklch(0.68 0.16 25);
      --bad-soft:  oklch(0.68 0.16 25 / 0.15);
      --warn-tx:   oklch(0.82 0.13 75);
      --warn-soft: oklch(0.78 0.13 75 / 0.15);
      color-scheme: dark;
    }
    
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg2);
      color: var(--tx-1);
      font-family: "Noto Sans JP", system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }
    
    .mono { font-family: ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 20px 16px; }
    
    .hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
      margin-bottom: 24px;
    }
    .hdr-title { font-size: 20px; font-weight: 800; color: var(--tx-1); display: flex; align-items: center; gap: 8px; }
    .hdr-meta { font-size: 13px; color: var(--tx-3); margin-top: 4px; }
    
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 4px 11px; border: 1px solid var(--line); color: var(--tx-2); }
    
    .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
    @media (min-width: 820px) {
      .grid { grid-template-columns: 2fr 1fr; }
    }
    
    .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 16px; padding: 20px 24px; margin-bottom: 20px; }
    .card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
    .card-t { font-size: 16px; font-weight: 700; color: var(--tx-1); display: flex; align-items: center; gap: 6px; }
    
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi { background: var(--surface2); border: 1px solid var(--line-soft); border-radius: 12px; padding: 12px 16px; text-align: center; }
    .kpi-lbl { font-size: 11px; font-weight: 600; color: var(--tx-3); }
    .kpi-val { font-size: 20px; font-weight: 800; color: var(--tx-1); margin-top: 4px; }
    
    .chart-container { position: relative; width: 100%; height: 260px; margin-bottom: 10px; }
    
    .tbl { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    .tbl th { font-size: 11.5px; font-weight: 600; color: var(--tx-3); text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .tbl th:first-child, .tbl th.l { text-align: left; }
    .tbl td { padding: 10px; border-bottom: 1px solid var(--line-soft); text-align: right; white-space: nowrap; }
    .tbl td:first-child, .tbl td.l { text-align: left; }
    .tbl tr:last-child td { border-bottom: 0; }
    .tbl tr.base td { background: var(--accent-soft); color: var(--accent-tx); font-weight: bold; }
    
    .md-report h2 { font-size: 15px; font-weight: 700; margin-top: 24px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); color: var(--accent-tx); display: flex; align-items: center; gap: 8px; }
    .md-report h2::before { content: '❖'; color: var(--accent); font-size: 12px; }
    .md-report p { margin-bottom: 14px; font-size: 13.5px; color: var(--tx-2); line-height: 1.6; text-align: justify; }
    .md-report ul, .md-report ol { margin-left: 20px; margin-bottom: 14px; color: var(--tx-2); font-size: 13.5px; }
    .md-report li { margin-bottom: 6px; }
    .md-report table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 12.5px; border: 1px solid var(--line); }
    .md-report th { background: var(--surface2); color: var(--tx-3); padding: 8px 10px; font-weight: 600; border: 1px solid var(--line); text-align: left; }
    .md-report td { padding: 8px 10px; border: 1px solid var(--line-soft); text-align: left; }
    .md-report tr:nth-child(even) { background: var(--bg2); }
    
    .loader-overlay { position: fixed; inset: 0; background: var(--bg2); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; transition: opacity 0.3s ease; }
    .spinner { width: 40px; height: 40px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text { font-size: 14px; color: var(--tx-2); font-weight: 600; }
    
    .msg-box { padding: 24px; text-align: center; color: var(--tx-2); background: var(--surface); border-radius: 12px; border: 1px solid var(--line); margin-top: 30px; }
    .msg-box.err { color: var(--bad); border-color: var(--bad-soft); background: var(--bad-soft); }
  </style>
</head>
<body>
  
  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <div class="loader-text" id="loaderText">週次データを集計中…</div>
  </div>

  <div class="wrap">
    <header class="hdr">
      <div>
        <h1 class="hdr-title" id="pageTitle">📊 フードコート週次経営分析</h1>
        <div class="hdr-meta" id="dateRange">期間: 読み込み中…</div>
      </div>
      <div>
        <span class="pill" id="storeLabel">読み込み中…</span>
      </div>
    </header>

    <div id="errorBox" class="msg-box err" style="display: none;"></div>

    <main id="mainContent" style="display: none;">
      <section class="kpis">
        <div class="kpi">
          <div class="kpi-lbl">週合計売上</div>
          <div class="kpi-val mono" id="kpiSales">-</div>
        </div>
        <div class="kpi">
          <div class="kpi-lbl">週合計客数</div>
          <div class="kpi-val mono" id="kpiGuests">-</div>
        </div>
        <div class="kpi">
          <div class="kpi-lbl">平均客単価</div>
          <div class="kpi-val mono" id="kpiKt">-</div>
        </div>
        <div class="kpi">
          <div class="kpi-lbl">平均売上順位</div>
          <div class="kpi-val mono" id="kpiRank">-</div>
        </div>
      </section>

      <div class="grid">
        <article class="card">
          <div class="card-h">
            <h2 class="card-t">🤖 AI週次経営アドバイザー</h2>
          </div>
          <div id="aiReportContainer" class="md-report"></div>
        </article>

        <aside>
          <div class="card">
            <div class="card-h">
              <h2 class="card-t">📈 日次売上・客数推移</h2>
            </div>
            <div class="chart-container">
              <canvas id="salesChart"></canvas>
            </div>
          </div>

          <div class="card">
            <div class="card-h">
              <h2 class="card-t">🍩 フードコート内売上シェア</h2>
            </div>
            <div class="chart-container" style="height: 220px;">
              <canvas id="shareChart"></canvas>
            </div>
          </div>

          <div class="card">
            <div class="card-h">
              <h2 class="card-t">🏆 テナント別週合計ランキング</h2>
            </div>
            <table class="tbl" id="tenantTable">
              <thead>
                <tr>
                  <th class="l">店舗</th>
                  <th>週売上</th>
                  <th>比率</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </aside>
      </div>
    </main>
  </div>

  <script src="pages-config.js"></script>
  <script>
    (async function() {
      const urlParams = new URLSearchParams(window.location.search);
      const storeKey = urlParams.get('store_key') || '';
      const weekStart = urlParams.get('week_start') || '';
      const token = urlParams.get('t') || '';
      
      const $ = (id) => document.getElementById(id);
      
      if (!storeKey || !weekStart) {
        showError('store_key および week_start パラメータが必要です。');
        return;
      }
      
      if (window.PAGES && typeof window.PAGES.getPreferredStoreDisplayLabel === 'function') {
        $('storeLabel').textContent = window.PAGES.getPreferredStoreDisplayLabel(storeKey);
      } else {
        $('storeLabel').textContent = storeKey;
      }
      
      try {
        const reportData = await fetchWeeklyReport(storeKey, weekStart, token);
        renderReport(reportData);
      } catch (err) {
        showError(err.message || 'レポートの読み込みに失敗しました。');
      } finally {
        $('loader').style.opacity = '0';
        setTimeout(() => $('loader').style.display = 'none', 300);
      }
      
      async function fetchWeeklyReport(store, start, t) {
        const apiUrl = window.PAGES && typeof window.PAGES.receiptAdminApiUrl === 'function'
          ? window.PAGES.receiptAdminApiUrl('/foodcourt/weekly-report')
          : `https://hocbnifuactbvmyjraxy.supabase.co/functions/v1/admin-api/foodcourt/weekly-report`;
          
        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'x-admin-token': t
          },
          body: JSON.stringify({
            store_key: store,
            week_start: start,
            force: false,
            push: false
          })
        });
        
        if (res.status === 401 || res.status === 403) {
          throw new Error('セッションの認証に失敗しました。LINEトーク画面から再度リンクを開き直してください。');
        }
        if (!res.ok) {
          const errBody = await res.json().catch(() => ({}));
          throw new Error(errBody.error || `通信エラーが発生しました (HTTP ${res.status})`);
        }
        
        return await res.json();
      }
      
      function showError(msg) {
        $('errorBox').textContent = msg;
        $('errorBox').style.display = 'block';
        $('mainContent').style.display = 'none';
        $('loader').style.display = 'none';
      }
      
      function renderReport(data) {
        if (!data.report) {
          showError('指定された週の経営分析レポートがまだ作成されていません。');
          return;
        }
        
        $('mainContent').style.display = 'block';
        
        const startStr = data.week_start;
        const endStr = data.week_end;
        $('dateRange').textContent = `対象期間: ${startStr} (月) 〜 ${endStr} (日)`;
        
        if (window.marked && typeof window.marked.parse === 'function') {
          window.marked.setOptions({ gfm: true, breaks: true });
          $('aiReportContainer').innerHTML = window.marked.parse(data.report);
        } else {
          $('aiReportContainer').innerHTML = `<pre style="white-space: pre-wrap; font-family: inherit;">${data.report}</pre>`;
        }
        
        const raw = data.raw_data;
        if (!raw) return;
        
        if (raw.totalSales != null) $('kpiSales').textContent = `¥${raw.totalSales.toLocaleString()}`;
        if (raw.totalGuests != null) $('kpiGuests').textContent = `${raw.totalGuests.toLocaleString()}人`;
        if (raw.totalSales != null && raw.totalGuests) {
          const avgKt = Math.round(raw.totalSales / raw.totalGuests);
          $('kpiKt').textContent = `¥${avgKt.toLocaleString()}`;
        }
        if (raw.avgRank != null) $('kpiRank').textContent = `${raw.avgRank}位`;
        
        const dates = (raw.dailySales || []).map(d => d.date.slice(5));
        const dailySalesVal = (raw.dailySales || []).map(d => d.sales || 0);
        const dailyGuestsVal = (raw.dailySales || []).map(d => d.guests || 0);
        
        if (window.Chart) {
          renderSalesChart(dates, dailySalesVal, dailyGuestsVal);
          renderShareChart(raw.tenantRows || [], raw.baseName);
        }
        
        renderTenantTable(raw.tenantRows || [], raw.baseName);
      }
      
      function renderSalesChart(labels, sales, guests) {
        const ctx = $('salesChart').getContext('2d');
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              {
                label: '売上 (円)',
                data: sales,
                yAxisID: 'ySales',
                backgroundColor: 'rgba(98, 111, 237, 0.6)',
                borderColor: 'rgba(98, 111, 237, 1)',
                borderWidth: 1.5,
                borderRadius: 4,
                order: 2
              },
              {
                label: '客数 (人)',
                data: guests,
                yAxisID: 'yGuests',
                type: 'line',
                borderColor: 'rgba(235, 87, 87, 0.85)',
                backgroundColor: 'rgba(235, 87, 87, 0.1)',
                borderWidth: 2.5,
                tension: 0.35,
                pointRadius: 3,
                order: 1
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                labels: { color: '#ccc', font: { size: 10 } },
                position: 'top'
              }
            },
            scales: {
              x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#888', font: { size: 9 } } },
              ySales: {
                type: 'linear',
                position: 'left',
                grid: { color: 'rgba(255,255,255,0.05)' },
                ticks: {
                  color: '#888',
                  font: { size: 9 },
                  callback: (v) => v >= 10000 ? (v/10000) + '万' : v
                }
              },
              yGuests: {
                type: 'linear',
                position: 'right',
                grid: { drawOnChartArea: false },
                ticks: { color: '#888', font: { size: 9 } }
              }
            }
          }
        });
      }
      
      function renderShareChart(tenantRows, baseName) {
        const ctx = $('shareChart').getContext('2d');
        const sorted = [...tenantRows].sort((a, b) => (b.sales || 0) - (a.sales || 0));
        const limit = 4;
        const labels = [];
        const data = [];
        const colors = [];
        
        let otherSales = 0;
        const palette = [
          'rgba(98, 111, 237, 0.8)',
          'rgba(46, 204, 113, 0.75)',
          'rgba(241, 196, 15, 0.75)',
          'rgba(155, 89, 182, 0.75)',
          'rgba(149, 165, 166, 0.6)'
        ];
        
        sorted.forEach((row, idx) => {
          const isBase = row.name && row.name.toLowerCase().includes('marugo');
          const sales = row.sales || 0;
          if (idx < limit) {
            labels.push(row.name);
            data.push(sales);
            colors.push(isBase ? 'rgba(235, 137, 87, 0.85)' : palette[idx % palette.length]);
          } else {
            otherSales += sales;
          }
        });
        
        if (otherSales > 0) {
          labels.push('その他他店');
          data.push(otherSales);
          colors.push(palette[4]);
        }
        
        new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: labels,
            datasets: [{
              data: data,
              backgroundColor: colors,
              borderWidth: 1,
              borderColor: 'rgba(21, 23, 29, 0.9)'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'right',
                labels: { color: '#bbb', font: { size: 10 }, boxWidth: 12 }
              }
            },
            cutout: '65%'
          }
        });
      }
      
      function renderTenantTable(tenantRows, baseName) {
        const tbody = $('tenantTable').querySelector('tbody');
        tbody.innerHTML = '';
        
        const sorted = [...tenantRows].sort((a, b) => (b.sales || 0) - (a.sales || 0));
        
        sorted.forEach((row) => {
          const tr = document.createElement('tr');
          const isBase = row.name && row.name.toLowerCase().includes('marugo');
          if (isBase) tr.className = 'base';
          
          const salesStr = row.sales != null ? `¥${row.sales.toLocaleString()}` : '-';
          const ratioStr = row.salesRatio != null ? `${row.salesRatio.toFixed(1)}%` : '-';
          
          tr.innerHTML = `
            <td class="l">${row.name}</td>
            <td class="mono">${salesStr}</td>
            <td class="mono">${ratioStr}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    })();
  </script>
</body>
</html>
