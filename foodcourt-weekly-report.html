<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フードコート週次報告</title>
<style>:root{--ink:#17202a;--muted:#637381;--blue:#0b6ea8;--line:#dfe5ea}body{margin:0;background:#f4f6f8;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:920px;margin:auto;padding:30px 18px 64px}.head{background:linear-gradient(135deg,#075782,#0b8bc2);color:#fff;border-radius:8px;padding:24px;margin-bottom:18px}.kicker{font-size:12px;font-weight:800;letter-spacing:.08em;color:#ccefff}.title{font-size:28px;margin:7px 0}.meta{color:#d7f1ff;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.kpi,.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}.label{font-size:12px;font-weight:700;color:var(--muted)}.value{font-size:24px;font-weight:800;margin-top:5px;color:#173b5e}.chart{display:flex;height:170px;gap:8px;align-items:end;padding-top:12px;border-bottom:1px solid var(--line)}.bar{flex:1;min-width:0;background:#1494cf;border-radius:4px 4px 0 0;position:relative}.bar span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}.rank{margin-top:38px;display:flex;gap:7px}.rank span{flex:1;text-align:center;background:#eaf5fb;color:#0b6ea8;border-radius:4px;padding:6px 2px;font-size:12px;font-weight:700}.card{line-height:1.85;margin-top:18px}.err{color:#b42318}.loading{color:var(--muted)}@media(max-width:580px){.grid{grid-template-columns:1fr}.title{font-size:24px}}</style>
<script src="./pages-config.js"></script><script src="./auth-session.js"></script></head><body><main><header class="head"><div class="kicker">FOODCOURT WEEKLY REPORT</div><h1 class="title">週次経営報告</h1><div class="meta" id="meta"></div></header><section class="grid" id="kpis"></section><section class="card"><div class="label">日別売上推移</div><div class="chart" id="salesChart"></div><div class="label" style="margin-top:34px">日別順位</div><div class="rank" id="rankChart"></div></section><section class="card" id="content"><p class="loading">報告書を読み込んでいます。</p></section></main>
<script>(async function(){const P=window.LINE_REPORT_PAGES,q=new URLSearchParams(location.search),store=q.get('store_key')||'',week=q.get('week_start')||'',el=document.getElementById('content'),yen=n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');try{if(window.LINE_REPORT_AUTH&&LINE_REPORT_AUTH.consumeUrlAuthParams)await LINE_REPORT_AUTH.consumeUrlAuthParams({exchangeUrl:P.adminApiUrl('/auth/link-login',P.PROJECT_URL),adminSurface:P.ADMIN_SURFACE||'line_report'});const token=window.LINE_REPORT_AUTH&&LINE_REPORT_AUTH.getToken?LINE_REPORT_AUTH.getToken():'';const r=await fetch(P.adminApiUrl('/foodcourt/weekly-report?store_key='+encodeURIComponent(store)+'&week_start='+encodeURIComponent(week),P.PROJECT_URL),{headers:{'x-admin-token':token,'x-admin-surface':P.ADMIN_SURFACE||'line_report'}}),b=await r.json();if(!r.ok)throw new Error(b.error||'読み込みに失敗しました。');document.getElementById('meta').textContent=(b.week_start||'')+' から '+(b.week_end||'');const d=b.raw_data||{},rows=Array.isArray(d.dailySales)?d.dailySales:[],max=Math.max(1,...rows.map(x=>Number(x.sales)||0));document.getElementById('kpis').innerHTML=[['週売上',yen(d.totalSales)],['週客数',(Number(d.totalGuests)||0).toLocaleString('ja-JP')+'人'],['平均順位',Number(d.avgRank)?Number(d.avgRank).toFixed(1)+'位':'-']].map(x=>'<div class="kpi"><div class="label">'+x[0]+'</div><div class="value">'+x[1]+'</div></div>').join('');document.getElementById('salesChart').innerHTML=rows.map(x=>'<div class="bar" style="height:'+Math.max(4,Math.round((Number(x.sales)||0)/max*100))+'%"><span>'+String(x.date||'').slice(5)+'</span></div>').join('');document.getElementById('rankChart').innerHTML=rows.map(x=>'<span>'+String(x.date||'').slice(5)+'<br>'+((x.salesRank==null)?'-':x.salesRank+'位')+'</span>').join('');el.innerHTML=b.report_html||'';}catch(e){el.innerHTML='<p class="err">'+String(e.message||e)+'</p>';}})();</script></body></html>
