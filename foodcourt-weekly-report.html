<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>フードコート週次報告</title>
<style>body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:860px;margin:0 auto;padding:30px 18px 64px}.head{border-bottom:3px solid #1677b8;padding-bottom:16px;margin-bottom:24px}.kicker{color:#1677b8;font-weight:700;font-size:13px}.title{font-size:27px;margin:6px 0}.meta{color:#637381;font-size:14px}.card{background:#fff;border:1px solid #dfe5ea;border-radius:8px;padding:24px;line-height:1.85;box-shadow:0 1px 2px #0000000d}.weekly-report-content{white-space:normal}.err{color:#b42318}.loading{color:#637381}</style>
<script src="./pages-config.js"></script><script src="./auth-session.js"></script></head><body><main><header class="head"><div class="kicker">FOODCOURT WEEKLY REPORT</div><h1 class="title">週次経営報告</h1><div class="meta" id="meta"></div></header><section class="card" id="content"><p class="loading">報告書を読み込んでいます。</p></section></main>
<script>(async function(){const P=window.LINE_REPORT_PAGES;const q=new URLSearchParams(location.search);const store=q.get('store_key')||'';const week=q.get('week_start')||'';const el=document.getElementById('content');try{if(window.LINE_REPORT_AUTH&&LINE_REPORT_AUTH.consumeUrlAuthParams)await LINE_REPORT_AUTH.consumeUrlAuthParams({exchangeUrl:P.adminApiUrl('/auth/link-login',P.PROJECT_URL),adminSurface:P.ADMIN_SURFACE||'line_report'});const token=window.LINE_REPORT_AUTH&&LINE_REPORT_AUTH.getToken?LINE_REPORT_AUTH.getToken():'';const r=await fetch(P.adminApiUrl('/foodcourt/weekly-report?store_key='+encodeURIComponent(store)+'&week_start='+encodeURIComponent(week),P.PROJECT_URL),{headers:{'x-admin-token':token,'x-admin-surface':P.ADMIN_SURFACE||'line_report'}});const b=await r.json();if(!r.ok)throw new Error(b.error||'読み込みに失敗しました。');document.getElementById('meta').textContent=(b.week_start||'')+' から '+(b.week_end||'');el.innerHTML=b.report_html||'';}catch(e){el.innerHTML='<p class="err">'+String(e.message||e)+'</p>';}})();</script></body></html>
