project_id = "line_report"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[functions.line-webhook]
verify_jwt = false

[functions.line-admin-webhook]
verify_jwt = false

[functions.admin-api]
verify_jwt = false

[functions.receipt-sheets-sync-cron]
verify_jwt = false

# receipt-midreport-cron は pg_cron（毎分）と admin-api（テスト送信）から呼ばれる内部関数。
# 新形式キー（sb_secret_…）は JWT ではないためゲートウェイの verify_jwt が 401 を返す。
# 認可は関数側で実施（テスト送信は X-Receipt-Midreport-Test-Key、定期実行は重複防止で冪等）するため false にする。
[functions.receipt-midreport-cron]
verify_jwt = false

# reservation-today-cron は pg_cron（毎分）から呼ばれる内部関数。
# 認可は冪等性（room_id×target_dateの重複防止）で担保し、テスト送信は X-Reservation-Today-Test-Key で保護する。
[functions.reservation-today-cron]
verify_jwt = false

# reservation-ai-cache-cron は毎日 JST05:37 に過去予約を店舗別・日別キャッシュへ確定保存する内部関数。
# 認可は関数内で CRON_AUTH_TOKEN / Vault のresolve_edge_cron_auth_tokenを定数時間比較する。
[functions.reservation-ai-cache-cron]
verify_jwt = false

# gmail-alert-cron は pg_cron（毎分）から呼ばれる内部関数＋admin-api/手動のテスト送信。
# 新形式キー（sb_secret_…）は JWT ではないためゲートウェイの verify_jwt が 401 を返す
# （この設定漏れで 2026-05-31 以降、毎分401になり予約メールの取得・通知・カレンダー登録が全停止していた）。
# 認可は関数側で実施（テスト送信は X-Gmail-Alert-Test-Key、定期実行は gmail_reservation_alert_logs の重複防止で冪等）するため false にする。
[functions.gmail-alert-cron]
verify_jwt = false

# tokyo-dome-events-cron は pg_cron（1日1回）から呼ばれる内部関数。東京ドーム公式の日程を取得して保存する分析専用。
# 新形式キー（sb_secret_…）は JWT ではないためゲートウェイの verify_jwt が 401 を返すため false。
# 送信は無く、書き込みは upsert（主キー event_date+title）で冪等のため、認可は冪等性で担保する。
[functions.tokyo-dome-events-cron]
verify_jwt = false

# weather-daily-cron は pg_cron（1日1回）から呼ばれる内部関数。Open-Meteoの日次天気を取得して保存する分析専用。
# verify_jwt は他cronと同様 false（sb_secret_… は JWT でないため）。upsert（主キー weather_date+location）で冪等。
[functions.weather-daily-cron]
verify_jwt = false

# tokyo-dome-weekly-cron は pg_cron（毎分）から呼ばれる。設定曜日・時刻に一致したルームへ翌週のドーム
# イベントをLINE配信する。verify_jwt は他cronと同様 false。二重送信は tokyo_dome_weekly_logs で防止。
[functions.tokyo-dome-weekly-cron]
verify_jwt = false

# foodcourt-forecast-cron は pg_cron（JST05:00）から呼ばれる自己再学習型の来客予測。verify_jwt は他cronと同様 false。
# forecast_predictions の (target_date,tenant_name,metric) 一意 upsert で冪等。
[functions.foodcourt-forecast-cron]
verify_jwt = false

# pv-japan-alert-cron は pg_cron（10分毎）から呼ばれ、新たに確定した「PVの日本戦」を単独で即LINE配信する。
# verify_jwt は他cronと同様 false。二重送信は pv_japan_alert_logs (room_id+event_date+title) で防止。
[functions.pv-japan-alert-cron]
verify_jwt = false

# review-alert-cron は pg_cron（毎分）から呼ばれ、ルームごとの配信時刻(review_alert_hour/minute、
# 既定8時10分JST)に一致した時だけ自店舗・登録済み競合の新着口コミを review_alert_enabled=true の
# ルームへLINE通知する。verify_jwt は他cronと同様 false。
# 二重送信は last_alerted_rating_total（直近通知時点の累計口コミ数）で防止する冪等設計。
[functions.review-alert-cron]
verify_jwt = false
