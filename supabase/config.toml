project_id = "line_report"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true

[functions.line-webhook]
verify_jwt = false

[functions.line-admin-webhook]
verify_jwt = false

[functions.admin-api]
verify_jwt = false

[functions.receipt-sheets-sync-cron]
verify_jwt = false

# receipt-midreport-cron は pg_cron（毎分）と admin-api（テスト送信）から呼ばれる内部関数。
# 新形式キー（sb_secret_…）は JWT ではないためゲートウェイの verify_jwt が 401 を返す。
# 認可は関数側で実施（テスト送信は X-Receipt-Midreport-Test-Key、定期実行は重複防止で冪等）するため false にする。
[functions.receipt-midreport-cron]
verify_jwt = false

# reservation-today-cron は pg_cron（毎分）から呼ばれる内部関数。
# 認可は冪等性（room_id×target_dateの重複防止）で担保し、テスト送信は X-Reservation-Today-Test-Key で保護する。
[functions.reservation-today-cron]
verify_jwt = false

# gmail-alert-cron は pg_cron（毎分）から呼ばれる内部関数＋admin-api/手動のテスト送信。
# 新形式キー（sb_secret_…）は JWT ではないためゲートウェイの verify_jwt が 401 を返す
# （この設定漏れで 2026-05-31 以降、毎分401になり予約メールの取得・通知・カレンダー登録が全停止していた）。
# 認可は関数側で実施（テスト送信は X-Gmail-Alert-Test-Key、定期実行は gmail_reservation_alert_logs の重複防止で冪等）するため false にする。
[functions.gmail-alert-cron]
verify_jwt = false

# tokyo-dome-events-cron は pg_cron（1日1回）から呼ばれる内部関数。東京ドーム公式の日程を取得して保存する分析専用。
# 新形式キー（sb_secret_…）は JWT ではないためゲートウェイの verify_jwt が 401 を返すため false。
# 送信は無く、書き込みは upsert（主キー event_date+title）で冪等のため、認可は冪等性で担保する。
[functions.tokyo-dome-events-cron]
verify_jwt = false
