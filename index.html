<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARUGO-s ファイル管理システム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      padding: 40px 20px;
      color: #e0e0e0;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(145deg, #1a1a1a, #121212);
      padding: 40px;
      border-radius: 4px;
      border: 1px solid #2a2a2a;
      margin-bottom: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .header h1 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header p {
      color: #808080;
      font-size: 14px;
      font-weight: 400;
    }

    .upload-section {
      background: linear-gradient(145deg, #1a1a1a, #121212);
      padding: 32px;
      border-radius: 4px;
      border: 1px solid #2a2a2a;
      margin-bottom: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .upload-area {
      border: 2px dashed #404040;
      border-radius: 4px;
      padding: 60px 40px;
      text-align: center;
      background: #0f0f0f;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .upload-area:hover {
      background: #151515;
      border-color: #606060;
    }

    .upload-area.dragover {
      background: #1a1a1a;
      border-color: #808080;
    }

    .upload-icon {
      font-size: 36px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: #ffffff;
      color: #000000;
      padding: 12px 32px;
      border: none;
      border-radius: 2px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    .btn:hover {
      background: #e0e0e0;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .documents-section {
      background: linear-gradient(145deg, #1a1a1a, #121212);
      padding: 32px;
      border-radius: 4px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .document-list {
      list-style: none;
    }

    .document-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #222;
      transition: all 0.2s ease;
    }

    .document-item:last-child {
      border-bottom: none;
    }

    .document-item:hover {
      padding-left: 8px;
    }

    .document-info {
      flex: 1;
    }

    .document-name {
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .document-meta {
      font-size: 12px;
      color: #606060;
      font-weight: 400;
    }

    .document-actions {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      padding: 8px 20px;
      font-size: 13px;
      border-radius: 2px;
      border: 1px solid #404040;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .btn-view {
      background: #ffffff;
      color: #000000;
      border: none;
    }

    .btn-view:hover {
      background: #e0e0e0;
    }

    .btn-delete {
      background: transparent;
      color: #808080;
    }

    .btn-delete:hover {
      background: #ff4444;
      color: #ffffff;
      border-color: #ff4444;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #606060;
      font-size: 14px;
    }

    .error {
      background: #1a0000;
      border: 1px solid #330000;
      color: #ff6666;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .success {
      background: #001a00;
      border: 1px solid #003300;
      color: #66ff66;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .info {
      background: #00131a;
      border: 1px solid #003040;
      color: #7ad7ff;
      padding: 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: #1a1a1a;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 20px;
      display: none;
    }

    .progress-fill {
      height: 100%;
      background: #ffffff;
      transition: width 0.3s ease;
      width: 0%;
    }

    h2 {
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 24px;
      letter-spacing: -0.3px;
    }

    .upload-area p {
      color: #808080;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #606060;
      font-size: 14px;
    }

    .upload-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
    }

    .selected-files {
      color: #808080;
      font-size: 13px;
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>MARUGO-s ファイル管理</h1>
      <p>ドキュメントの一元管理システム</p>
    </div>

    <div id="message"></div>

    <div class="upload-section">
      <h2>ファイルアップロード</h2>
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">↑</div>
        <p>PDF、Word、Excel、Markdown、TXT、CSVファイルをドラッグ＆ドロップ</p>
        <button class="btn" onclick="document.getElementById('fileInput').click()">
          ファイルを選択
        </button>
        <input type="file" id="fileInput" accept=".pdf,.txt,.md,.docx,.xlsx,.xls,.csv" multiple>
      </div>
      <div class="upload-controls">
        <div class="selected-files" id="selectedFilesText">ファイルが選択されていません</div>
        <button class="btn" id="uploadBtn" disabled>アップロード</button>
      </div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="documents-section">
      <h2>ドキュメント一覧</h2>
      <ul class="document-list" id="documentList">
        <li class="loading">読み込み中...</li>
      </ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabaseClient = null;
    let storageMode = "supabase"; // 'supabase' | 'local'
    const BUCKET = "company-documents";
    const ALLOWED_EXTENSIONS = ["pdf", "txt", "md", "docx", "xlsx", "xls", "csv"];

    const uploadArea = document.getElementById("uploadArea");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const selectedFilesText = document.getElementById("selectedFilesText");
    const progressBar = document.getElementById("progressBar");
    const progressFill = document.getElementById("progressFill");

    let pendingFiles = [];

    function showMessage(text, type = "success") {
      const messageDiv = document.getElementById("message");
      messageDiv.className = type;
      messageDiv.textContent = text;
      if (type !== "info") {
        setTimeout(() => {
          messageDiv.textContent = "";
          messageDiv.className = "";
        }, 6000);
      }
    }

    function encodeForStorage(name) {
      return name
        .replace(/[\\/:*?"<>|\s]+/g, "_")
        .replace(/[^\x00-\x7F]/g, "_")
        .replace(/_+/g, "_")
        .replace(/^_+|_+$/g, "");
    }

    function splitName(fileName) {
      const lastDot = fileName.lastIndexOf(".");
      if (lastDot <= 0 || lastDot === fileName.length - 1) {
        return { base: fileName, ext: "" };
      }
      return {
        base: fileName.slice(0, lastDot),
        ext: fileName.slice(lastDot + 1).toLowerCase(),
      };
    }

    function setPendingFiles(files) {
      pendingFiles = files;
      if (!pendingFiles.length) {
        selectedFilesText.textContent = "ファイルが選択されていません";
        uploadBtn.disabled = true;
        return;
      }
      const names = pendingFiles.map((f) => f.name).join(", ");
      selectedFilesText.textContent =
        pendingFiles.length === 1
          ? `選択中: ${names}`
          : `選択中: ${pendingFiles.length}件（${names}）`;
      uploadBtn.disabled = storageMode === "supabase" ? !supabaseClient : false;
    }

    function saveFileNameMapping(storageName, originalName) {
      const raw = storageName.includes("/") ? storageName.split("/").pop() : storageName;
      const mappings = JSON.parse(localStorage.getItem("fileNameMapping") || "{}");
      mappings[raw] = originalName;
      localStorage.setItem("fileNameMapping", JSON.stringify(mappings));
    }

    function getOriginalFileName(storageName) {
      const raw = storageName.includes("/") ? storageName.split("/").pop() : storageName;
      const mappings = JSON.parse(localStorage.getItem("fileNameMapping") || "{}");
      return mappings[raw] || raw;
    }

    async function syncFileMappingsToServer() {
      try {
        const mappings = JSON.parse(localStorage.getItem("fileNameMapping") || "{}");
        if (!Object.keys(mappings).length) return;
        await fetch("/api/file-mapping/bulk", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mappings }),
        });
      } catch (error) {
        console.warn("Failed to sync mappings to server:", error);
      }
    }

    async function initSupabase() {
      // 1) Prefer server-provided config (local/server deploy)
      try {
        const res = await fetch("/api/config");
        if (res.ok) {
          const cfg = await res.json();
          if (cfg?.supabaseUrl && cfg?.supabaseKey) {
            supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
            return;
          }
        }
      } catch (_) {
        // ignore (e.g. static hosting)
      }
      // No hardcoded keys here (avoid leaking secrets). If not configured, we fallback to local mode.
      supabaseClient = null;
    }

    async function decideStorageMode() {
      // Default: Supabase. If network/DNS fails, fallback to local.
      if (!supabaseClient) {
        storageMode = "local";
        return;
      }
      try {
        const { error } = await supabaseClient.storage.from(BUCKET).list("", { limit: 1 });
        if (error) {
          console.warn("Supabase list error:", error);
          // If it's clearly a network issue (often shown as "Load failed" in browser),
          // fallback to local to keep the app usable.
          const msg = String(error?.message || "");
          if (/load failed|fetch failed|network|enotfound/i.test(msg)) {
            storageMode = "local";
          }
        }
      } catch (e) {
        console.warn("Supabase connectivity check failed:", e);
        storageMode = "local";
      }
    }

    async function uploadSingleFile(file, index, total) {
      if (storageMode === "local") {
        const form = new FormData();
        form.append("files", file, file.name);
        const res = await fetch("/api/local/upload", { method: "POST", body: form });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || `Local upload failed (${res.status})`);
        }
        return "local";
      }

      const { base, ext } = splitName(file.name);
      if (!ext || !ALLOWED_EXTENSIONS.includes(ext)) {
        throw new Error(`対応していないファイル形式です: ${file.name}`);
      }

      const timestamp = Date.now();
      const safeBase = encodeForStorage(base) || "file";
      const storagePath = `uploads/${timestamp}_${safeBase}.${ext}`;

      progressBar.style.display = "block";
      progressFill.style.width = `${Math.floor((index / total) * 100)}%`;

      const { error } = await supabaseClient.storage.from(BUCKET).upload(storagePath, file, {
        cacheControl: "3600",
        upsert: false,
        contentType: file.type || "application/octet-stream",
        metadata: { originalName: file.name },
      });
      if (error) throw error;

      saveFileNameMapping(storagePath, file.name);

      try {
        await fetch("/api/file-mapping", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ storageName: storagePath, originalName: file.name }),
        });
      } catch (e) {
        console.warn("Failed to save mapping to server:", e);
      }

      return storagePath;
    }

    async function startUpload(files) {
      if (!supabaseClient) {
        showMessage("Supabase設定が読み込めていません。サーバーの環境変数を確認してください。", "error");
        return;
      }

      const list = Array.from(files || []);
      if (!list.length) return;

      uploadBtn.disabled = true;
      fileInput.disabled = true;
      showMessage("アップロード中...", "info");

      try {
        for (let i = 0; i < list.length; i++) {
          await uploadSingleFile(list[i], i, list.length);
        }
        progressFill.style.width = "100%";
        showMessage(`アップロード完了: ${list.length}件`, "success");
        await syncFileMappingsToServer();
        await loadDocuments();
        setPendingFiles([]);
      } catch (error) {
        console.error("Upload error:", error);
        showMessage(`アップロードに失敗しました: ${error?.message || String(error)}`, "error");
      } finally {
        setTimeout(() => {
          progressBar.style.display = "none";
          progressFill.style.width = "0%";
        }, 800);
        uploadBtn.disabled = !pendingFiles.length;
        fileInput.disabled = false;
      }
    }

    async function listAllFiles(prefix = "") {
      if (storageMode === "local") {
        const res = await fetch("/api/local/files");
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || `Local list failed (${res.status})`);
        }
        const json = await res.json();
        const files = Array.isArray(json.files) ? json.files : [];
        return files.map((f) => ({
          fullPath: f.id,
          created_at: f.createdAt ? new Date(f.createdAt).toISOString() : null,
          metadata: { size: f.size },
        }));
      }

      const collected = [];
      let page = 0;
      while (true) {
        const { data, error } = await supabaseClient.storage.from(BUCKET).list(prefix, {
          limit: 100,
          offset: page * 100,
          sortBy: { column: "created_at", order: "desc" },
        });
        if (error) throw error;
        if (!data || data.length === 0) break;

        for (const item of data) {
          const isFolder = !item.metadata && !item.name.includes(".");
          const fullPath = prefix ? `${prefix}/${item.name}` : item.name;
          if (isFolder) {
            const nested = await listAllFiles(fullPath);
            collected.push(...nested);
          } else {
            collected.push({ ...item, fullPath });
          }
        }

        if (data.length < 100) break;
        page += 1;
      }
      return collected;
    }

    async function loadDocuments() {
      const listElement = document.getElementById("documentList");

      if (storageMode === "supabase" && !supabaseClient) {
        listElement.innerHTML = '<li class="loading">Supabase設定がありません</li>';
        return;
      }

      try {
        const allFiles = await listAllFiles(storageMode === "local" ? "" : "uploads");
        if (!allFiles || allFiles.length === 0) {
          listElement.innerHTML = '<li class="loading">アップロード済みのファイルはありません</li>';
          return;
        }

        const filesWithNames = allFiles
          .filter((file) => {
            if (storageMode === "local") return true;
            const ext = (file.fullPath.split(".").pop() || "").toLowerCase();
            return ALLOWED_EXTENSIONS.includes(ext);
          })
          .map((file) => {
            const storageName = file.fullPath;
            const displayName =
              storageMode === "local"
                ? (file.originalName || storageName)
                : getOriginalFileName(storageName);
            const createdAt = file.created_at ? new Date(file.created_at) : null;
            const sizeBytes = file.metadata?.size ?? file.size ?? 0;
            return {
              storageName,
              displayName,
              uploadedAt: createdAt ? createdAt.toLocaleString("ja-JP") : "-",
              sizeKb: (sizeBytes / 1024).toFixed(2),
            };
          });

        if (!filesWithNames.length) {
          listElement.innerHTML = '<li class="loading">アップロード済みのファイルはありません</li>';
          return;
        }

        listElement.innerHTML = filesWithNames
          .map(
            (fileInfo) => `
          <li class="document-item">
            <div class="document-info">
              <div class="document-name">${fileInfo.displayName}</div>
              <div class="document-meta">
                サイズ: ${fileInfo.sizeKb} KB | アップロード: ${fileInfo.uploadedAt}
              </div>
            </div>
            <div class="document-actions">
              <button class="btn-small btn-view" data-action="view" data-name="${fileInfo.storageName}">表示</button>
              <button class="btn-small btn-delete" data-action="delete" data-name="${fileInfo.storageName}">削除</button>
            </div>
          </li>
        `
          )
          .join("");
      } catch (error) {
        console.error("Load error:", error);
        showMessage(`Load failed: ${error?.message || String(error)}`, "error");
        listElement.innerHTML = `<li class="loading">Load failed: ${String(
          error?.message || error
        )}</li>`;
      }
    }

    async function viewDocument(fileName) {
      try {
        if (storageMode === "local") {
          window.open(`/api/local/download/${encodeURIComponent(fileName)}`, "_blank");
          return;
        }
        const { data } = await supabaseClient.storage.from(BUCKET).getPublicUrl(fileName);
        window.open(data.publicUrl, "_blank");
      } catch (error) {
        showMessage("ファイルを開けませんでした", "error");
      }
    }

    async function deleteDocument(fileName) {
      if (!confirm("このファイルを削除しますか？")) return;
      try {
        if (storageMode === "local") {
          const res = await fetch(`/api/local/files/${encodeURIComponent(fileName)}`, { method: "DELETE" });
          if (!res.ok) throw new Error(`Local delete failed (${res.status})`);
          showMessage("ファイルを削除しました", "success");
          await loadDocuments();
          return;
        }
        const { error } = await supabaseClient.storage.from(BUCKET).remove([fileName]);
        if (error) throw error;
        showMessage("ファイルを削除しました", "success");
        await loadDocuments();
      } catch (error) {
        showMessage(`削除に失敗しました: ${error?.message || String(error)}`, "error");
      }
    }

    function attachHandlers() {
      uploadArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        uploadArea.classList.add("dragover");
      });

      uploadArea.addEventListener("dragleave", () => {
        uploadArea.classList.remove("dragover");
      });

      uploadArea.addEventListener("drop", async (e) => {
        e.preventDefault();
        uploadArea.classList.remove("dragover");
        const files = Array.from(e.dataTransfer.files || []);
        setPendingFiles(files);
        await startUpload(files);
      });

      fileInput.addEventListener("change", (e) => {
        const files = Array.from(e.target.files || []);
        setPendingFiles(files);
      });

      uploadBtn.addEventListener("click", async () => {
        await startUpload(pendingFiles);
      });

      document.getElementById("documentList").addEventListener("click", async (e) => {
        const btn = e.target?.closest("button");
        if (!btn) return;
        const action = btn.getAttribute("data-action");
        const name = btn.getAttribute("data-name");
        if (!action || !name) return;
        if (action === "view") await viewDocument(name);
        if (action === "delete") await deleteDocument(name);
      });
    }

    async function initializeApp() {
      try {
        await initSupabase();
        await decideStorageMode();
        uploadBtn.disabled = true;
        attachHandlers();
        await syncFileMappingsToServer();
        await loadDocuments();
        if (storageMode === "local") {
          uploadBtn.disabled = false;
          showMessage("準備完了（ローカル保存モード）。ファイルを選択してアップロードしてください。", "success");
        } else {
          showMessage("準備完了（Supabaseモード）。ファイルを選択してアップロードしてください。", "success");
        }
      } catch (error) {
        console.error("Init error:", error);
        showMessage(`初期化に失敗しました: ${error?.message || String(error)}`, "error");
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initializeApp);
    } else {
      initializeApp();
    }
  </script>
</body>
</html>
