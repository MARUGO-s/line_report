<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://hocbnifuactbvmyjraxy.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
  <title>小口現金（出金・経費）</title>
  <style>
    /* 既定はダーク（他ページと統一）。data-theme='light' でライトに切替。テーマキーは全ページ共有。 */
    :root {
      color-scheme: dark;
      --bg: #0f1620; --surface: #18212c; --surface-2: #1e2935; --border: #2a3744;
      --text: #e7ecf2; --text-2: #9fadbd; --text-3: #6f7d8d;
      --accent: #4a9fde; --accent-soft: rgba(74,159,222,.16); --danger: #e05656; --ok: #36b37e;
      --ok-soft: rgba(54,179,126,.18); --danger-soft: rgba(224,86,86,.18);
      --shadow: 0 1px 3px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.7);
    }
    body[data-theme='light'] {
      color-scheme: light;
      --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e2e6ea;
      --text: #1d2733; --text-2: #5b6573; --text-3: #8a96a3;
      --accent: #1a6fa8; --accent-soft: #e7f1f8; --danger: #c0392b; --ok: #1a7f37;
      --ok-soft: #e6f4ea; --danger-soft: #fdecea;
      --shadow: 0 1px 3px rgba(20,30,45,.07), 0 6px 18px rgba(20,30,45,.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
      font-size: 14px; line-height: 1.5; -webkit-text-size-adjust: 100%;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 18px 14px 60px; }
    header.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
    header.top h1 { font-size: 20px; margin: 0; font-weight: 800; letter-spacing: .02em; }
    header.top .sub { color: var(--text-3); font-size: 12px; }
    .theme-toggle {
      margin-left: auto; align-self: center; border: 1px solid var(--border); background: var(--surface);
      color: var(--text-2); border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: border-color .12s, color .12s;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 16px; margin-top: 14px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 11px; color: var(--text-3); font-weight: 700; }
    input, select, button, textarea { font: inherit; }
    input, select, textarea {
      border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; background: var(--surface);
      color: var(--text); min-width: 0;
    }
    textarea { resize: vertical; line-height: 1.4; width: 100%; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 9px; padding: 9px 16px; font-weight: 700; cursor: pointer; }
    .btn:hover { filter: brightness(1.05); }
    .btn.ghost { background: var(--surface); color: var(--accent); }
    .btn.sm { padding: 5px 10px; font-size: 12px; }
    .btn.danger { border-color: var(--danger); background: var(--surface); color: var(--danger); }
    .taxq { display: flex; gap: 4px; margin-top: 4px; }
    .taxbtn { border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); border-radius: 7px; padding: 2px 8px; font-size: 11px; cursor: pointer; }
    .taxbtn:hover { border-color: var(--accent); color: var(--accent); }
    .totalbox { border: 1px solid var(--border); border-radius: 9px; padding: 8px 10px; background: var(--surface-2); font-weight: 800; font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; color: var(--accent); }
    /* 品目（明細）: 1商品ごとの入力行 */
    .itemrows { display: flex; flex-direction: column; gap: 6px; }
    .itemrow { display: flex; gap: 6px; align-items: center; }
    .itemrow .iname { flex: 1 1 auto; min-width: 0; }
    .itemrow .iprice { display: flex; align-items: center; gap: 2px; border: 1px solid var(--border); border-radius: 9px; padding: 0 9px; background: var(--surface); flex: none; }
    .itemrow .iprice span { color: var(--text-3); font-size: 12px; }
    .itemrow .iprice input { border: 0; background: transparent; padding: 8px 2px; width: 74px; text-align: right; font-variant-numeric: tabular-nums; }
    .itemrow .iprice input:focus { outline: none; }
    .itemrow .iprice:focus-within { border-color: var(--accent); }
    .itemrow .irm { flex: none; width: 32px; height: 34px; border: 1px solid var(--border); background: var(--surface); color: var(--text-3); border-radius: 8px; font-size: 17px; line-height: 1; cursor: pointer; }
    .itemrow .irm:hover { border-color: var(--danger); color: var(--danger); }
    .additem { align-self: flex-start; margin-top: 2px; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .toolbar .grow { flex: 1; }
    .badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 700; }
    .badge.ok { background: var(--ok-soft); color: var(--ok); }
    .badge.ng { background: var(--danger-soft); color: var(--danger); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { font-size: 11px; color: var(--text-3); font-weight: 700; background: var(--surface-2); position: sticky; top: 0; }
    td.amt, th.amt { text-align: right; font-variant-numeric: tabular-nums; }
    td.item { white-space: pre-line; min-width: 160px; }
    .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
    .tag.store { background: var(--accent-soft); color: var(--accent); }
    .tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; max-height: 62vh; overflow-y: auto; border-radius: 10px; border: 1px solid var(--border); }
    .summary { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .total { font-size: 22px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
    .catchip { font-size: 12px; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
    .catchip b { color: var(--text); margin-left: 5px; font-variant-numeric: tabular-nums; }
    .muted { color: var(--text-3); }
    .empty { text-align: center; padding: 30px 10px; color: var(--text-3); }
    .msg { font-size: 12px; min-height: 16px; }
    .msg.err { color: var(--danger); }
    .msg.ok { color: var(--ok); }
    #authCard input { width: 260px; max-width: 60vw; }
    @media (max-width: 640px) {
      .field.grow-m { flex: 1 1 100%; }
      header.top h1 { font-size: 18px; }
    }
  </style>
</head>
<body>
  <!-- 描画前に保存済みテーマを適用（ちらつき防止）。テーマキーは全ページ共有。 -->
  <script>try{document.body.setAttribute('data-theme',(localStorage.getItem('line_reservation_calendar_theme')==='light')?'light':'dark');}catch(e){}</script>
  <div class="wrap">
    <header class="top">
      <h1>小口現金 <span class="muted" style="font-weight:700;font-size:14px;">出金・経費</span></h1>
      <span class="sub">レジ出金・経費の記録と月集計（売上・予約とは別管理）</span>
      <button id="themeToggleBtn" type="button" class="theme-toggle" aria-pressed="false" title="ライトモードに切り替え">ライトモード</button>
    </header>

    <!-- 認証カード（未ログイン時のみ表示） -->
    <div class="card" id="authCard" style="display:none;">
      <div class="field" style="max-width:520px;">
        <label>管理トークン（本部）／またはLINEの最新リンクから開いてください</label>
        <div class="toolbar">
          <input id="tokenInput" type="password" placeholder="ADMIN_DASHBOARD_TOKEN" autocomplete="off" />
          <button class="btn" id="saveTokenBtn" type="button">接続</button>
        </div>
        <div class="msg err" id="authMsg"></div>
      </div>
    </div>

    <!-- 操作バー -->
    <div class="card">
      <div class="toolbar">
        <div class="field">
          <label>店舗</label>
          <select id="storeSel"></select>
        </div>
        <div class="field">
          <label>対象月</label>
          <input id="monthInput" type="month" />
        </div>
        <button class="btn ghost sm" id="reloadBtn" type="button">再読込</button>
        <div class="grow"></div>
        <span class="badge ng" id="authBadge">未接続</span>
      </div>
    </div>

    <!-- 入力フォーム -->
    <div class="card">
      <div class="row">
        <div class="field">
          <label>出金日</label>
          <input id="fDate" type="date" />
        </div>
        <div class="field grow-m" style="flex:1;min-width:240px;">
          <label>品目（明細・1商品ずつ）</label>
          <div class="itemrows" id="itemRows"></div>
          <button type="button" class="btn ghost sm additem" id="addItemBtn">＋ 品目を追加</button>
        </div>
        <div class="field">
          <label>勘定科目</label>
          <input id="fCategory" type="text" list="catList" placeholder="消耗品費 等" />
          <datalist id="catList"></datalist>
        </div>
        <div class="field">
          <label>本体価格（円）</label>
          <input id="fBase" type="number" min="0" step="1" inputmode="numeric" placeholder="548" style="width:108px;" />
        </div>
        <div class="field">
          <label>税額（円）</label>
          <input id="fTax" type="number" min="0" step="1" inputmode="numeric" placeholder="43" style="width:92px;" />
          <div class="taxq">
            <button type="button" class="taxbtn" data-rate="8">税8%</button>
            <button type="button" class="taxbtn" data-rate="10">税10%</button>
          </div>
        </div>
        <div class="field">
          <label>出金額（合計）</label>
          <div class="totalbox" id="fTotal">¥0</div>
        </div>
        <div class="field">
          <label>取扱者</label>
          <input id="fHandler" type="text" placeholder="例: Y.MIYANO" style="width:118px;" />
        </div>
        <button class="btn" id="addBtn" type="button">追加</button>
        <button class="btn ghost" id="cancelEditBtn" type="button" style="display:none;">編集をやめる</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <div class="field" style="flex:1;">
          <label>メモ（任意）</label>
          <input id="fNote" type="text" placeholder="補足があれば" />
        </div>
      </div>
      <div class="msg ok" id="addMsg" style="margin-top:8px;"></div>
    </div>

    <!-- 月集計 -->
    <div class="card">
      <div class="summary">
        <div>
          <div class="muted" style="font-size:11px;font-weight:700;">月合計（出金）</div>
          <div class="total" id="totalYen">¥0</div>
          <div class="muted" id="totalBreak" style="font-size:11px;margin-top:2px;">本体 ¥0 ／ 税 ¥0</div>
        </div>
        <div style="flex:1;"></div>
        <div class="summary" id="byCategory"></div>
      </div>
    </div>

    <!-- 小口表 -->
    <div class="card">
      <div class="tablewrap">
        <table>
          <thead>
            <tr id="theadRow">
              <th>日付</th>
              <th>品目 / 摘要</th>
              <th>勘定科目</th>
              <th class="amt">本体</th>
              <th class="amt">税額</th>
              <th class="amt">出金額</th>
              <th>取扱者</th>
              <th class="colStore">店舗</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyState" style="display:none;">この月の記録はありません。上のフォームから追加できます。</div>
    </div>
  </div>

  <script src="pages-config.js?v=20260608"></script>
  <script src="auth-session.js"></script>
  <script>
  'use strict';
  (function () {
    const PAGES = window.LINE_REPORT_PAGES;
    const AUTH = window.LINE_REPORT_AUTH;
    const STORE_NAMES = (PAGES && PAGES.STORE_NAMES) || {};
    const DEFAULT_CATEGORIES = ['消耗品費', '食材・仕入', '雑費', '衛生用品', '修繕費', 'その他'];
    const LS_STORE = 'petty_cash_last_store';
    const LS_MONTH = 'petty_cash_last_month';
    let editingId = null;      // 編集中の行ID（null=新規追加モード）
    let lastEntries = [];      // 直近に表示した行（編集時のフォーム流し込み用）

    const $ = (id) => document.getElementById(id);
    const dom = {
      authCard: $('authCard'), tokenInput: $('tokenInput'), saveTokenBtn: $('saveTokenBtn'), authMsg: $('authMsg'),
      storeSel: $('storeSel'), monthInput: $('monthInput'), reloadBtn: $('reloadBtn'), authBadge: $('authBadge'), themeToggleBtn: $('themeToggleBtn'),
      fDate: $('fDate'), itemRows: $('itemRows'), addItemBtn: $('addItemBtn'), fCategory: $('fCategory'),
      fBase: $('fBase'), fTax: $('fTax'), fTotal: $('fTotal'),
      fHandler: $('fHandler'), fNote: $('fNote'), addBtn: $('addBtn'), cancelEditBtn: $('cancelEditBtn'), addMsg: $('addMsg'), catList: $('catList'),
      totalYen: $('totalYen'), totalBreak: $('totalBreak'), byCategory: $('byCategory'), tbody: $('tbody'),
      emptyState: $('emptyState'), colStoreHead: document.querySelector('#theadRow .colStore'),
    };

    const yen = (n) => '¥' + Number(n || 0).toLocaleString('ja-JP');
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const storeName = (key) => STORE_NAMES[key] || (PAGES && PAGES.resolveStoreName ? PAGES.resolveStoreName(key, '') : '') || key || '';

    /* ===== テーマ（ダーク/ライト切替・全ページ共有キー line_reservation_calendar_theme） ===== */
    const STORE_THEME_KEY = 'line_reservation_calendar_theme';
    function normalizeTheme(t) { return t === 'light' ? 'light' : 'dark'; }
    function getTheme() { try { return normalizeTheme(localStorage.getItem(STORE_THEME_KEY)); } catch (_) { return 'dark'; } }
    function applyTheme(theme) {
      const t = normalizeTheme(theme);
      document.body.setAttribute('data-theme', t);
      const btn = dom.themeToggleBtn;
      if (btn) {
        const isLight = t === 'light';
        btn.textContent = isLight ? 'ダークモード' : 'ライトモード';
        btn.setAttribute('aria-pressed', isLight ? 'true' : 'false');
        btn.title = isLight ? 'ダークモードに切り替え' : 'ライトモードに切り替え';
      }
    }
    function setTheme(theme) { const t = normalizeTheme(theme); try { localStorage.setItem(STORE_THEME_KEY, t); } catch (_) {} applyTheme(t); }
    function toggleTheme() { setTheme(document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light'); }

    function getToken() { return AUTH ? AUTH.getToken() : (localStorage.getItem('line_summary_admin_token') || ''); }
    function lockedStore() {
      try { return sessionStorage.getItem('line_locked_store') || localStorage.getItem('line_locked_store') || ''; } catch (_) { return ''; }
    }
    // LINE経由（?from=line&store_key=...）で開いた時、その店舗を line_locked_store に保存して
    // 店舗をロックする（＝その店舗のみ閲覧）。売上分析ページと同じ仕組み。
    function captureLockedStoreFromUrl() {
      try {
        const params = new URLSearchParams(location.search);
        if (params.get('from') !== 'line') return;
        const raw = String(params.get('store_key') || params.get('store') || '').trim();
        if (!raw) return;
        let key = (PAGES && typeof PAGES.resolveStoreKey === 'function') ? PAGES.resolveStoreKey(raw, '') : raw.toLowerCase();
        key = String(key || '').trim();
        if (!key || !STORE_NAMES[key]) return; // 既知店舗のみロック
        try { sessionStorage.setItem('line_locked_store', key); } catch (_) {}
        try { localStorage.setItem('line_locked_store', key); } catch (_) {}
      } catch (_) {}
    }
    function isLineEntry() {
      try { return new URLSearchParams(location.search).get('from') === 'line' || !!lockedStore(); } catch (_) { return false; }
    }

    function setAuthBadge(ok) {
      dom.authBadge.textContent = ok ? '接続済み' : '未接続';
      dom.authBadge.className = 'badge ' + (ok ? 'ok' : 'ng');
      dom.authCard.style.display = ok ? 'none' : '';
    }

    async function apiFetch(path, opts) {
      const url = PAGES.receiptAdminApiUrl(path);
      const headers = Object.assign({ 'x-admin-token': getToken() }, (opts && opts.headers) || {});
      let res;
      try {
        res = await fetch(url, Object.assign({}, opts, { headers }));
      } catch (e) {
        throw new Error('通信に失敗しました（ネットワーク/接続先）。');
      }
      if (res.status === 401 || res.status === 403) { setAuthBadge(false); throw new Error('認証が必要です。管理トークンを入力するか、LINEの最新リンクから開いてください。'); }
      const body = await res.json().catch(() => ({}));
      if (!res.ok || body.error) throw new Error(body.error || ('エラー（HTTP ' + res.status + '）'));
      return body;
    }

    function populateStores() {
      const locked = lockedStore();
      const keys = Object.keys(STORE_NAMES).sort((a, b) => storeName(a).localeCompare(storeName(b), 'ja'));
      const opts = [];
      if (!locked) opts.push('<option value="">全店舗</option>');
      for (const k of keys) {
        if (locked && k !== locked) continue;
        opts.push('<option value="' + esc(k) + '">' + esc(storeName(k)) + '</option>');
      }
      dom.storeSel.innerHTML = opts.join('');
      const saved = (() => { try { return localStorage.getItem(LS_STORE) || ''; } catch (_) { return ''; } })();
      dom.storeSel.value = locked || saved || '';
      if (locked) dom.storeSel.disabled = true;
    }

    function populateCategories(cats) {
      const list = (Array.isArray(cats) && cats.length) ? cats : DEFAULT_CATEGORIES;
      dom.catList.innerHTML = list.map((c) => '<option value="' + esc(c) + '"></option>').join('');
    }

    function currentMonth() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    }
    function todayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function renderSummary(data) {
      dom.totalYen.textContent = yen(data.total_yen);
      const tax = Number(data.tax_total_yen || 0);
      const base = Number(data.base_total_yen != null ? data.base_total_yen : (Number(data.total_yen || 0) - tax));
      dom.totalBreak.textContent = '本体 ' + yen(base) + ' ／ 税 ' + yen(tax);
      const by = Array.isArray(data.by_category) ? data.by_category : [];
      dom.byCategory.innerHTML = by.length
        ? by.map((c) => '<span class="catchip">' + esc(c.category) + '<b>' + yen(c.amount_yen) + '</b></span>').join('')
        : '<span class="muted" style="font-size:12px;">—</span>';
    }

    function renderTable(data) {
      const showStore = !dom.storeSel.value; // 全店舗のとき店舗列を表示
      dom.colStoreHead.style.display = showStore ? '' : 'none';
      const entries = Array.isArray(data.entries) ? data.entries : [];
      if (!entries.length) {
        dom.tbody.innerHTML = '';
        dom.emptyState.style.display = '';
        return;
      }
      dom.emptyState.style.display = 'none';
      dom.tbody.innerHTML = entries.map((e) => {
        const src = e.source === 'line_image' ? ' <span class="tag">LINE</span>' : '';
        const storeCell = showStore ? '<td><span class="tag store">' + esc(storeName(e.store_partition_key)) + '</span></td>' : '';
        const amt = Math.max(0, Math.floor(Number(e.amount_yen || 0)));
        const tax = Math.max(0, Math.floor(Number(e.tax_yen || 0)));
        const base = Math.max(0, amt - tax);
        return '<tr>'
          + '<td>' + esc(e.spent_on || '') + '</td>'
          + '<td class="item">' + esc(e.item || '') + (e.note ? ' <span class="muted">（' + esc(e.note) + '）</span>' : '') + src + '</td>'
          + '<td>' + (e.category ? '<span class="tag">' + esc(e.category) + '</span>' : '<span class="muted">未分類</span>') + '</td>'
          + '<td class="amt">' + yen(base) + '</td>'
          + '<td class="amt">' + (tax > 0 ? yen(tax) : '<span class="muted">—</span>') + '</td>'
          + '<td class="amt">' + yen(amt) + '</td>'
          + '<td>' + esc(e.handler || '') + '</td>'
          + storeCell
          + '<td style="white-space:nowrap;"><button class="btn ghost sm" data-edit="' + esc(e.id) + '" type="button">編集</button> <button class="btn danger sm" data-del="' + esc(e.id) + '" type="button">削除</button></td>'
          + '</tr>';
      }).join('');
    }

    async function loadEntries() {
      if (!getToken()) { setAuthBadge(false); return; }
      const store = dom.storeSel.value;
      const month = dom.monthInput.value;
      try { localStorage.setItem(LS_STORE, store); localStorage.setItem(LS_MONTH, month); } catch (_) {}
      const qs = new URLSearchParams();
      if (store) qs.set('store', store);
      if (month) qs.set('month', month);
      try {
        const data = await apiFetch('/petty-cash?' + qs.toString());
        setAuthBadge(true);
        populateCategories(data.categories);
        lastEntries = Array.isArray(data.entries) ? data.entries : [];
        renderSummary(data);
        renderTable(data);
      } catch (e) {
        dom.addMsg.className = 'msg err';
        dom.addMsg.textContent = e.message || String(e);
      }
    }

    function computeTotal() {
      const base = Math.max(0, Math.floor(Number(dom.fBase.value || 0)) || 0);
      const tax = Math.max(0, Math.floor(Number(dom.fTax.value || 0)) || 0);
      dom.fTotal.textContent = yen(base + tax);
    }

    /* ===== 品目（明細）: 1商品ごとの入力行 ===== */
    function parsePrice(s) { const d = String(s == null ? '' : s).replace(/[^\d]/g, ''); return d ? String(parseInt(d, 10)) : ''; }
    function makeItemRow(name, price) {
      const row = document.createElement('div');
      row.className = 'itemrow';
      const ni = document.createElement('input');
      ni.type = 'text'; ni.className = 'iname'; ni.placeholder = '品名（例: お徳用おろし生姜）'; ni.value = name || '';
      const pw = document.createElement('div'); pw.className = 'iprice';
      const ps = document.createElement('span'); ps.textContent = '¥';
      const pi = document.createElement('input');
      pi.type = 'number'; pi.min = '0'; pi.step = '1'; pi.inputMode = 'numeric'; pi.className = 'ipval'; pi.placeholder = '299'; pi.value = price || '';
      pi.addEventListener('input', syncBaseFromItems);
      pw.appendChild(ps); pw.appendChild(pi);
      const rm = document.createElement('button');
      rm.type = 'button'; rm.className = 'irm'; rm.title = 'この品目を削除'; rm.textContent = '×';
      rm.addEventListener('click', () => { row.remove(); if (!dom.itemRows.children.length) addItemRow(); syncBaseFromItems(); });
      row.appendChild(ni); row.appendChild(pw); row.appendChild(rm);
      return row;
    }
    function addItemRow(name, price) { dom.itemRows.appendChild(makeItemRow(name, price)); }
    function renderItemRows(items) {
      dom.itemRows.innerHTML = '';
      const list = (Array.isArray(items) && items.length) ? items : [{ name: '', price: '' }];
      list.forEach((it) => addItemRow(it.name, it.price));
    }
    function collectItemsArray() {
      return Array.prototype.map.call(dom.itemRows.children, (row) => {
        const ni = row.querySelector('.iname'); const pi = row.querySelector('.ipval');
        return { name: ni ? ni.value.trim() : '', price: parsePrice(pi ? pi.value : '') };
      }).filter((it) => it.name || it.price);
    }
    // 保存用テキスト（従来形式と互換: 複数は「・品名 ¥価格」改行区切り、1件はそのまま）
    function collectItemsText() {
      const items = collectItemsArray();
      if (!items.length) return '';
      const lines = items.map((it) => [it.name, it.price ? '¥' + Number(it.price).toLocaleString('ja-JP') : ''].filter(Boolean).join(' '));
      return lines.length > 1 ? lines.map((s) => '・' + s).join('\n') : lines[0];
    }
    function itemsSum() { return collectItemsArray().reduce((a, it) => a + (Number(it.price) || 0), 0); }
    // 明細の価格合計を本体価格に反映（価格が1つでも入っていれば上書き）。
    function syncBaseFromItems() { const sum = itemsSum(); if (sum > 0) dom.fBase.value = String(sum); computeTotal(); }
    // 保存済みテキスト（「・品名 ¥価格」等）を入力行に逆パース。
    function parseItemsText(str) {
      const t = String(str == null ? '' : str);
      if (!t.trim()) return [];
      return t.split(/\r?\n/).map((raw) => {
        const line = raw.replace(/^[・･\-\s　]+/, '').trim();
        if (!line) return null;
        const m = line.match(/^(.*?)[\s　]*[¥\\]\s*([\d,]+)\s*$/) || line.match(/^(.*?)[\s　]*([\d,]+)\s*円\s*$/);
        if (m) return { name: m[1].trim(), price: parsePrice(m[2]) };
        return { name: line, price: '' };
      }).filter(Boolean);
    }

    function exitEditMode() {
      editingId = null;
      dom.addBtn.textContent = '追加';
      dom.cancelEditBtn.style.display = 'none';
    }
    function clearForm() {
      renderItemRows([]); dom.fBase.value = ''; dom.fTax.value = '';
      dom.fNote.value = ''; dom.fCategory.value = ''; dom.fHandler.value = '';
      dom.fDate.value = todayStr();
      computeTotal();
    }
    function cancelEdit() {
      exitEditMode(); clearForm();
      dom.addMsg.className = 'msg'; dom.addMsg.textContent = '';
    }
    // 行の「編集」: 値を上のフォームに読み込み、更新モードに切替。
    function startEdit(id) {
      const e = lastEntries.find((x) => String(x.id) === String(id));
      if (!e) return;
      editingId = e.id;
      const amt = Math.max(0, Math.floor(Number(e.amount_yen || 0)));
      const tax = Math.max(0, Math.floor(Number(e.tax_yen || 0)));
      dom.fDate.value = e.spent_on || todayStr();
      renderItemRows(parseItemsText(e.item)); // 既存の品目テキストを明細行に展開
      dom.fCategory.value = e.category || '';
      dom.fBase.value = String(Math.max(0, amt - tax)); // 保存済み本体価格を優先（明細合計で上書きしない）
      dom.fTax.value = String(tax);
      dom.fHandler.value = e.handler || '';
      dom.fNote.value = e.note || '';
      computeTotal();
      dom.addBtn.textContent = '更新';
      dom.cancelEditBtn.style.display = '';
      dom.addMsg.className = 'msg';
      dom.addMsg.textContent = '編集中：' + (e.spent_on || '') + ' / ' + yen(amt) + '（内容を直して「更新」）';
      try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (_) { window.scrollTo(0, 0); }
    }

    // 追加（新規）／更新（編集中）を分岐して保存。
    async function saveEntry() {
      const spent_on = dom.fDate.value;
      const base = Math.floor(Number(dom.fBase.value || 0));
      const tax = Math.floor(Number(dom.fTax.value || 0));
      if (!spent_on) { dom.addMsg.className = 'msg err'; dom.addMsg.textContent = '出金日を入力してください。'; return; }
      if (!Number.isFinite(base) || base < 0 || !Number.isFinite(tax) || tax < 0) { dom.addMsg.className = 'msg err'; dom.addMsg.textContent = '本体価格・税額を正しく入力してください。'; return; }
      const amount = base + tax;
      if (amount <= 0) { dom.addMsg.className = 'msg err'; dom.addMsg.textContent = '本体価格（と税額）を入力してください。'; return; }
      const fields = {
        spent_on: spent_on,
        item: collectItemsText(),
        category: dom.fCategory.value.trim(),
        amount_yen: amount,
        tax_yen: tax,
        handler: dom.fHandler.value.trim(),
        note: dom.fNote.value.trim(),
      };
      const m = spent_on.slice(0, 7);
      dom.addBtn.disabled = true;
      try {
        if (editingId) {
          await apiFetch('/petty-cash', { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ id: editingId }, fields)) });
          exitEditMode(); clearForm();
          dom.addMsg.className = 'msg ok';
          dom.addMsg.textContent = '更新しました（出金 ' + yen(amount) + '／本体 ' + yen(base) + '・税 ' + yen(tax) + '）。';
          if (m && dom.monthInput.value !== m) dom.monthInput.value = m;
          await loadEntries();
        } else {
          const store = dom.storeSel.value || lockedStore();
          if (!store) { dom.addMsg.className = 'msg err'; dom.addMsg.textContent = '店舗を選択してください（全店舗のままでは追加できません）。'; return; }
          await apiFetch('/petty-cash', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ store_partition_key: store }, fields)) });
          dom.addMsg.className = 'msg ok';
          dom.addMsg.textContent = '追加しました（出金 ' + yen(amount) + '／本体 ' + yen(base) + '・税 ' + yen(tax) + '）。';
          renderItemRows([]); dom.fBase.value = ''; dom.fTax.value = ''; dom.fNote.value = ''; computeTotal();
          if (m && dom.monthInput.value !== m) dom.monthInput.value = m;
          await loadEntries();
        }
      } catch (e) {
        dom.addMsg.className = 'msg err';
        dom.addMsg.textContent = e.message || String(e);
      } finally {
        dom.addBtn.disabled = false;
      }
    }

    async function deleteEntry(id) {
      if (!id) return;
      if (!confirm('この出金記録を削除しますか？')) return;
      try {
        await apiFetch('/petty-cash?id=' + encodeURIComponent(id), { method: 'DELETE' });
        await loadEntries();
      } catch (e) {
        dom.addMsg.className = 'msg err';
        dom.addMsg.textContent = e.message || String(e);
      }
    }

    // ── events ──
    dom.reloadBtn.addEventListener('click', loadEntries);
    dom.themeToggleBtn.addEventListener('click', toggleTheme);
    dom.addItemBtn.addEventListener('click', () => addItemRow());
    dom.storeSel.addEventListener('change', () => { if (editingId) cancelEdit(); loadEntries(); });
    dom.monthInput.addEventListener('change', () => { if (editingId) cancelEdit(); loadEntries(); });
    dom.addBtn.addEventListener('click', saveEntry);
    dom.cancelEditBtn.addEventListener('click', cancelEdit);
    dom.fBase.addEventListener('input', computeTotal);
    dom.fTax.addEventListener('input', computeTotal);
    document.querySelectorAll('.taxbtn').forEach((b) => b.addEventListener('click', () => {
      const rate = Number(b.getAttribute('data-rate')) || 0;
      const base = Math.max(0, Math.floor(Number(dom.fBase.value || 0)) || 0);
      dom.fTax.value = String(Math.floor(base * rate / 100));
      computeTotal();
    }));
    dom.tbody.addEventListener('click', (ev) => {
      const t = ev.target;
      const editBtn = t && t.closest ? t.closest('[data-edit]') : null;
      if (editBtn) { startEdit(editBtn.getAttribute('data-edit')); return; }
      const delBtn = t && t.closest ? t.closest('[data-del]') : null;
      if (delBtn) deleteEntry(delBtn.getAttribute('data-del'));
    });
    dom.saveTokenBtn.addEventListener('click', async () => {
      const t = dom.tokenInput.value.trim();
      if (!t) { dom.authMsg.textContent = 'トークンを入力してください。'; return; }
      dom.tokenInput.value = '';
      try {
        if (AUTH) {
          await AUTH.loginWithToken(t, {
            sessionUrl: PAGES.adminApiUrl('/auth/session', PAGES.PROJECT_URL),
            adminSurface: PAGES.ADMIN_SURFACE || 'line_report',
          });
        } else {
          localStorage.setItem('line_summary_admin_token', t);
        }
        dom.authMsg.textContent = '';
        setAuthBadge(true);
        await loadEntries();
      } catch (e) {
        dom.authMsg.textContent = (e && e.message) ? e.message : String(e);
      }
    });

    // ── init ──
    (async function init() {
      applyTheme(getTheme()); // 保存済みテーマを適用＋ボタン文言を同期
      renderItemRows([]); // 品目の入力行を1行用意
      captureLockedStoreFromUrl(); // populateStores より前（ロック判定に反映するため）
      populateStores();
      populateCategories(DEFAULT_CATEGORIES);
      dom.fDate.value = todayStr();
      computeTotal();
      const savedMonth = (() => { try { return localStorage.getItem(LS_MONTH) || ''; } catch (_) { return ''; } })();
      dom.monthInput.value = savedMonth || currentMonth();

      if (AUTH && AUTH.consumeUrlAuthParams) {
        try {
          await AUTH.consumeUrlAuthParams({
            exchangeUrl: PAGES.adminApiUrl('/auth/link-login', PAGES.PROJECT_URL),
            adminSurface: PAGES.ADMIN_SURFACE || 'line_report',
          });
        } catch (e) { /* トークン入力にフォールバック */ }
      }
      setAuthBadge(!!getToken());
      if (getToken()) await loadEntries();
    })();
  })();
  </script>
</body>
</html>
