name: Deploy Edge Functions

# main にマージされたら DB マイグレーションと Edge Functions を本番へ自動デプロイする。
#
# ※ 当初は「Supabase の GitHub 統合（Dashboard の Integrations）が DB マイグレーションだけは
#    自動適用してくれる」前提でこのワークフローは Edge Functions のみを担当していたが、
#    2026-07-12 に実際は複数のマイグレーションが未適用のまま放置されていたことが判明した
#    （Dashboard 連携が機能していなかった/設定されていなかった）。そのため、マイグレーション
#    適用もこのワークフロー自身で確実に行うようにした。
#    これにより「シークレット変更時のマーカー行ハック」や「config.toml の
#    verify_jwt 設定漏れによる 401」を防ぎ、関数コード・DBスキーマを常に git と同期させる。
#
# 必要な事前設定（1回だけ・人手）:
#   GitHub リポジトリ → Settings → Secrets and variables → Actions →
#   "New repository secret" で以下を登録する:
#     - SUPABASE_ACCESS_TOKEN: Supabase ダッシュボード → Account → Access Tokens で発行
#     - SUPABASE_DB_PASSWORD:  Supabase ダッシュボード → Project Settings → Database の
#                              データベースパスワード（`supabase link` の非対話認証に使う）
#   （値はこのファイルやコードには絶対に書かない）

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch: {}   # 手動実行（Actions タブの Run workflow）も可能

# 連続 push 時は古い実行を打ち切り、最新だけをデプロイする
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: hocbnifuactbvmyjraxy   # 公開情報（URL に出る）。秘密ではない
    steps:
      - name: Checkout
        uses: actions/checkout@v6   # Node24 ランタイム（旧 v4 は Node20 deprecation 対象）

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2   # composite 方式・Node ランタイム非依存
        with:
          version: 2.106.0   # ローカル CLI と同一。必要なら更新可

      - name: Link project and apply DB migrations
        # SUPABASE_DB_PASSWORD が未設定の場合はスキップし、Edge Functions のデプロイだけは
        # 継続する（シークレット未設定でワークフロー全体を落とさないための保険）。
        # continue-on-error: マイグレーション履歴の不整合など db push 側の問題で
        # このステップが失敗しても、Edge Functions のデプロイ自体は止めない
        # （関数コードのデプロイはDBスキーマ変更と独立して価値があるため）。
        # ただし失敗時はジョブサマリーに warning を残すので、Actions タブで気づける。
        continue-on-error: true
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::SUPABASE_DB_PASSWORD が未設定のため、DBマイグレーションの自動適用をスキップします。リポジトリSecretsに追加してください。"
            exit 0
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          if ! supabase db push; then
            echo "::warning::supabase db push が失敗しました。マイグレーション履歴の不整合の可能性があります。Edge Functionsのデプロイは続行します。"
            exit 1
          fi

      - name: Deploy all functions
        # 関数名を省略すると supabase/functions 配下の全関数ディレクトリ
        # （_shared は共通コードとして自動除外）をデプロイする。
        # config.toml の [functions.X] verify_jwt 設定もそのまま反映されるため、
        # gmail-alert-cron / line-webhook / admin-api 等の verify_jwt=false が
        # 確実に適用され、過去にあった「毎分 401」トラップの再発を防ぐ。
        # --use-api: Docker 不要のサーバー側バンドル。_shared への共通 import も
        #            各関数に取り込まれる。
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
