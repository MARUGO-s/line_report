name: Deploy Edge Functions

# main にマージされたら Edge Functions を本番へ自動デプロイする。
#
# ※ Supabase の GitHub 統合（Dashboard の Integrations）は DB マイグレーションだけを
#    自動適用し、Edge Functions は対象外。このワークフローがその穴を埋める。
#    これにより「シークレット変更時のマーカー行ハック」や「config.toml の
#    verify_jwt 設定漏れによる 401」を防ぎ、関数コードを常に git と同期させる。
#
# 必要な事前設定（1回だけ・人手）:
#   GitHub リポジトリ → Settings → Secrets and variables → Actions →
#   "New repository secret" で SUPABASE_ACCESS_TOKEN を登録する。
#   値は Supabase ダッシュボード → Account → Access Tokens で発行したトークン。
#   （トークンはこのファイルやコードには絶対に書かない）

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch: {}   # 手動実行（Actions タブの Run workflow）も可能

# 連続 push 時は古い実行を打ち切り、最新だけをデプロイする
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hocbnifuactbvmyjraxy   # 公開情報（URL に出る）。秘密ではない
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.106.0   # ローカル CLI と同一。必要なら更新可

      - name: Deploy all functions
        # 関数名を省略すると supabase/functions 配下の全関数ディレクトリ
        # （_shared は共通コードとして自動除外）をデプロイする。
        # config.toml の [functions.X] verify_jwt 設定もそのまま反映されるため、
        # gmail-alert-cron / line-webhook / admin-api 等の verify_jwt=false が
        # 確実に適用され、過去にあった「毎分 401」トラップの再発を防ぐ。
        # --use-api: Docker 不要のサーバー側バンドル。_shared への共通 import も
        #            各関数に取り込まれる。
        run: supabase functions deploy --project-ref "$PROJECT_REF" --use-api
