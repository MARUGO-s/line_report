name: Deploy Edge Functions

# main への push で DB マイグレーションと Edge Functions を本番へ自動デプロイする。
#
# 設計:
# - validate と deploy を同一ジョブにする。GitHub-hosted runner 枯渇時に
#   「validate 成功 → deploy ジョブが runner 取得失敗」で止まるのを防ぐ。
# - db push が履歴ズレで失敗しても関数デプロイは続行する（警告を出し、
#   最終的に db 失敗なら job を fail にして気づけるようにする）。
# - 関数は1つずつ + リトライ（一括 deploy の 502/409 回避）。
#
# 必要な Repo Secrets:
#   - SUPABASE_ACCESS_TOKEN
#   - SUPABASE_DB_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "検証をスキップしてデプロイのみ（緊急用）"
        type: boolean
        default: false
      skip_db_push:
        description: "DB migration push をスキップ"
        type: boolean
        default: false

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: hocbnifuactbvmyjraxy
      SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests }}
      SKIP_DB_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_db_push }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: env.SKIP_TESTS != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        if: env.SKIP_TESTS != 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1

      - name: Install dependencies
        if: env.SKIP_TESTS != 'true'
        run: npm ci

      - name: Static checks
        if: env.SKIP_TESTS != 'true'
        run: npm run check

      - name: Test
        if: env.SKIP_TESTS != 'true'
        run: npm run test:ci

      - name: Check Journal AI Edge Function
        if: env.SKIP_TESTS != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if DENO_DIR="$RUNNER_TEMP/line-report-deno-check" deno check --no-lock --node-modules-dir=auto supabase/functions/ai-analyze/index.ts; then
              exit 0
            fi
            echo "::warning::deno check attempt ${attempt} failed; retrying after $((attempt * 5)) seconds"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Verify diff formatting
        if: env.SKIP_TESTS != 'true'
        run: git diff --check

      - name: Setup Node.js for deploy helpers
        if: env.SKIP_TESTS == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.106.0

      - name: Link project and apply DB migrations
        id: db
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${SKIP_DB_PUSH}" = "true" ]; then
            echo "::warning::skip_db_push=true のため DB migration push をスキップします。"
            exit 0
          fi
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::SUPABASE_DB_PASSWORD が未設定です。"
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN が未設定です。"
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push

      - name: Deploy all functions
        id: functions
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN が未設定です。"
            exit 1
          fi
          mapfile -t FUNCS < <(
            node -e "const m=require('./knowledge/supabase-ownership.json'); for (const f of [...m.ownedFunctions].sort()) console.log(f)"
          )
          PRIORITY=(ai-analyze admin-api line-webhook)
          ORDER=()
          for p in "${PRIORITY[@]}"; do
            for f in "${FUNCS[@]}"; do
              if [ "$f" = "$p" ]; then ORDER+=("$f"); fi
            done
          done
          for f in "${FUNCS[@]}"; do
            skip=0
            for p in "${PRIORITY[@]}"; do
              if [ "$f" = "$p" ]; then skip=1; break; fi
            done
            if [ "$skip" -eq 0 ]; then ORDER+=("$f"); fi
          done

          failed=()
          for name in "${ORDER[@]}"; do
            ok=0
            for attempt in 1 2 3 4; do
              echo "::group::Deploy ${name} (attempt ${attempt})"
              if supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api; then
                ok=1
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              echo "::warning::Deploy ${name} attempt ${attempt} failed; waiting before retry"
              sleep $((attempt * 15))
            done
            if [ "$ok" -ne 1 ]; then
              failed+=("$name")
            fi
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed to deploy: ${failed[*]}"
            exit 1
          fi
          echo "Deployed functions: ${ORDER[*]}"

      - name: Fail if DB migration push failed
        if: steps.db.outcome == 'failure'
        run: |
          echo "::error::DB migration push に失敗しました。関数デプロイは完了していますが、スキーマとコードの不整合がないか確認してください。"
          exit 1
