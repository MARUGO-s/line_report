name: Deploy Edge Functions

# main にマージされたら DB マイグレーションと Edge Functions を本番へ自動デプロイする。
#
# ※ 当初は「Supabase の GitHub 統合（Dashboard の Integrations）が DB マイグレーションだけは
#    自動適用してくれる」前提でこのワークフローは Edge Functions のみを担当していたが、
#    2026-07-12 に実際は複数のマイグレーションが未適用のまま放置されていたことが判明した
#    （Dashboard 連携が機能していなかった/設定されていなかった）。そのため、マイグレーション
#    適用もこのワークフロー自身で確実に行うようにした。
#    これにより「シークレット変更時のマーカー行ハック」や「config.toml の
#    verify_jwt 設定漏れによる 401」を防ぎ、関数コード・DBスキーマを常に git と同期させる。
#
# 必要な事前設定（1回だけ・人手）:
#   GitHub リポジトリ → Settings → Secrets and variables → Actions →
#   "New repository secret" で以下を登録する:
#     - SUPABASE_ACCESS_TOKEN: Supabase ダッシュボード → Account → Access Tokens で発行
#     - SUPABASE_DB_PASSWORD:  Supabase ダッシュボード → Project Settings → Database の
#                              データベースパスワード（`supabase link` の非対話認証に使う）
#   （値はこのファイルやコードには絶対に書かない）

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch: {}   # 手動実行（Actions タブの Run workflow）も可能

# 連続 push 時は古い実行を打ち切り、最新だけをデプロイする
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm run check

      - name: Test
        run: npm run test:ci

      - name: Check Journal AI Edge Function
        run: deno check --no-lock supabase/functions/ai-analyze/index.ts

      - name: Verify diff formatting
        run: git diff --check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: hocbnifuactbvmyjraxy   # 公開情報（URL に出る）。秘密ではない
    steps:
      - name: Checkout
        uses: actions/checkout@v6   # Node24 ランタイム（旧 v4 は Node20 deprecation 対象）

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2   # composite 方式・Node ランタイム非依存
        with:
          version: 2.106.0   # ローカル CLI と同一。必要なら更新可

      - name: Link project and apply DB migrations
        # DB変更と関数コードの不整合を防ぐため、パスワード未設定・link失敗・db push失敗は
        # すべてデプロイ停止とする。Edge Functionsだけを先行公開しない。
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD が未設定です。DBと関数の不整合を防ぐためデプロイを停止します。"
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push

      - name: Deploy all functions
        # 関数を1つずつデプロイする。一括 deploy は Supabase API の 502/409
        # （deployment already exists）で全体が落ちることがあるため、個別+リトライにする。
        # config.toml の [functions.X] verify_jwt も各デプロイで反映される。
        # --use-api: Docker 不要のサーバー側バンドル。_shared への共通 import も取り込む。
        run: |
          set -euo pipefail
          mapfile -t FUNCS < <(
            node -e "const m=require('./knowledge/supabase-ownership.json'); for (const f of [...m.ownedFunctions].sort()) console.log(f)"
          )
          # 変更の多い入口を先にデプロイ
          PRIORITY=(ai-analyze admin-api line-webhook)
          ORDER=()
          for p in "${PRIORITY[@]}"; do
            for f in "${FUNCS[@]}"; do
              if [ "$f" = "$p" ]; then ORDER+=("$f"); fi
            done
          done
          for f in "${FUNCS[@]}"; do
            skip=0
            for p in "${PRIORITY[@]}"; do
              if [ "$f" = "$p" ]; then skip=1; break; fi
            done
            if [ "$skip" -eq 0 ]; then ORDER+=("$f"); fi
          done

          failed=()
          for name in "${ORDER[@]}"; do
            ok=0
            for attempt in 1 2 3 4; do
              echo "::group::Deploy ${name} (attempt ${attempt})"
              if supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api; then
                ok=1
                echo "::endgroup::"
                break
              fi
              echo "::endgroup::"
              echo "::warning::Deploy ${name} attempt ${attempt} failed; waiting before retry"
              sleep $((attempt * 15))
            done
            if [ "$ok" -ne 1 ]; then
              failed+=("$name")
            fi
          done

          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Failed to deploy: ${failed[*]}"
            exit 1
          fi
          echo "Deployed functions: ${ORDER[*]}"
