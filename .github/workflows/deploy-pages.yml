name: Deploy GitHub Pages

# main の public/ 更新を GitHub Pages へ配信する。
# validate と deploy を同一ジョブにし、runner 枯渇で二段目だけ落ちるのを防ぐ。

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "検証をスキップして Pages デプロイのみ（緊急用）"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SKIP_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        if: env.SKIP_TESTS != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect whether this push also requires Edge deploy
        id: edge_gate
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/pages-edge-gate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.nul"
          trap 'rm -f "$paths_file"' EXIT
          zero_sha="0000000000000000000000000000000000000000"
          if [ "$PUSH_BEFORE" = "$zero_sha" ]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            git diff --name-only -z "$empty_tree" "$PUSH_HEAD" > "$paths_file"
          else
            if ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"
            fi
            git diff --name-only -z "$PUSH_BEFORE" "$PUSH_HEAD" > "$paths_file"
          fi
          node scripts/wait-for-edge-deploy.mjs detect --paths-file "$paths_file" >> "$GITHUB_OUTPUT"

      - name: Setup Deno
        if: env.SKIP_TESTS != 'true'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1

      - name: Install dependencies
        if: env.SKIP_TESTS != 'true'
        run: npm ci

      - name: Static checks
        if: env.SKIP_TESTS != 'true'
        run: npm run check

      - name: Test
        if: env.SKIP_TESTS != 'true'
        run: npm run test:ci

      - name: Verify diff formatting
        if: env.SKIP_TESTS != 'true'
        run: git diff --check

      - name: Wait for matching Edge Functions deployment
        if: steps.edge_gate.outputs.required == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/wait-for-edge-deploy.mjs wait \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$GITHUB_SHA" \
            --workflow "deploy-edge-functions.yml" \
            --api-url "$GITHUB_API_URL" \
            --initial-delay-ms 5000 \
            --appearance-timeout-ms 600000 \
            --completion-timeout-ms 3600000 \
            --poll-ms 10000

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

# Redeploy trigger after Actions outage recovery (2026-08-07)
