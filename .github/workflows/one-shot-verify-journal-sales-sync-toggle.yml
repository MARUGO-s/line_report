name: One-shot verify journal sales sync toggle

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-verify-journal-sales-sync-toggle.yml"
      - "scripts/verify-journal-sales-sync-toggle.sh"
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: hocbnifuactbvmyjraxy
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v2
        with:
          version: 2.106.0
      - name: Link and verify toggle behavior
        run: |
          set -euo pipefail
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          chmod +x scripts/verify-journal-sales-sync-toggle.sh
          bash scripts/verify-journal-sales-sync-toggle.sh
