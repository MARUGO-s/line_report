  <style>
    :root{
      --bg:#0b2035; --panel:#0f2942; --panel2:#13314e; --line:rgba(255,255,255,.12);
      --text:#eaf1f8; --muted:#9fb3c8; --accent:#3aa0ff; --base:#ffcf5c; --ok:#2bd07a; --warn:#ffb020;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.5}
    .wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
    .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
    .head h1{font-size:20px;font-weight:600;margin:0}
    .badge{font-size:12px;padding:2px 8px;border-radius:8px}
    .badge.test{background:rgba(255,176,32,.16);color:var(--warn)}
    .pill{font-size:12px;padding:2px 10px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--muted)}
    .pill.ok{background:rgba(43,208,122,.16);color:var(--ok)}

    .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
    .fld{display:flex;flex-direction:column;gap:4px}
    .fld label{font-size:12px;color:var(--muted)}
    select,input,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
    button{cursor:pointer;background:var(--accent);border-color:transparent;color:#04243f;font-weight:600}
    button.ghost{background:var(--panel2);color:var(--text);font-weight:500}
    .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .metric{background:var(--panel2);border-radius:10px;padding:10px 12px}
    .metric .l{font-size:12px;color:var(--muted)}
    .metric .v{font-size:20px;font-weight:600;margin-top:2px}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}

<body>
  <div class="wrap">
    <div class="head">
      <h1>🍴 フードコート内 売上比較</h1>
      <span class="badge test">試験版</span>
      <span id="authBadge" class="pill">未接続</span>
    </div>
    <div class="sub">基準店＝100 として、同じフードコート内の各店を相対比較します（分析専用・売上には登録しません）。</div>

    <div id="authCard" class="card" hidden>
      <div style="font-size:14px;margin-bottom:8px;">閲覧には管理トークンが必要です（またはLINEの最新リンクから開いてください）。</div>
      <div class="controls">
        <div class="fld" style="flex:1;min-width:200px"><label>管理トークン</label><input id="tokenInput" type="password" placeholder="x-admin-token" autocomplete="off"></div>
        <button id="tokenBtn">接続</button>
      </div>
      <div id="authMsg" class="msg"></div>
    </div>

    <div class="card">
      <div class="controls">
        <div class="fld"><label>店舗</label><select id="storeSel"></select></div>
        <div class="fld" style="flex:1;min-width:200px"><label>レポート（受信日時）</label><select id="reportSel"></select></div>
        <button id="reloadBtn" class="ghost">更新</button>
      </div>
      <div id="loadMsg" class="msg"></div>
    </div>

    <div class="card" id="qaCard" hidden>
      <div style="font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px;">💬 データに質問<span class="badge test">試験版</span></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:10px;">蓄積されたフードコートの日次データを根拠に、AIが質問へ回答します（毎回の自動出力はしません）。</div>
      <div id="qSuggest" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;"></div>
      <div class="controls">
        <div class="fld" style="flex:1;min-width:240px"><label>質問</label><input id="qInput" type="text" placeholder="例: 直近でマルゴSが一番売れた日は？ / 客単価を上げるには？"></div>
        <button id="qBtn">質問する</button>
      </div>
      <div id="qAnswer" style="white-space:pre-wrap;font-size:14px;line-height:1.85;margin-top:12px;background:var(--panel2);border-radius:10px;padding:12px 14px;min-height:20px;color:var(--text);"></div>
    </div>

    <div id="resultArea" hidden>
      <div class="card">
        <div style="font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px;">📊 分析結果（自動）<span class="badge test">試験版</span></div>
        <div id="analysis" style="white-space:pre-wrap;font-size:13px;line-height:1.75;color:var(--text)"></div>
      </div>
      <div class="card">
        <div class="summary" id="summary"></div>
      </div>
      <div class="card">
        <div class="tbl-wrap">
          <table>
            <thead><tr>
              <th>順位</th><th class="name">店名</th><th>対象売上</th><th>売上比</th>
              <th>客数</th><th>客数比</th><th>客単価</th><th>単価比</th>
            </tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
        <div class="note">売上比・客数比・単価比はいずれも「基準店=100%」。単価比＝各店の客単価÷基準店の客単価。</div>
      </div>
      <div class="card">
        <div style="font-size:13px;color:var(--muted);margin-bottom:8px;">売上比（基準店=100）</div>
        <div id="bars"></div>
      </div>
    </div>
  </div>

  <script src="pages-config.js?v=20260622"></script>
  <script src="auth-session.js"></script>
  <script>
  'use strict';
  (function(){
    const PAGES = window.LINE_REPORT_PAGES;
    const AUTH = window.LINE_REPORT_AUTH;
    const STORE_NAMES = (PAGES && PAGES.STORE_NAMES) || {};
    const TOKEN_KEY = 'line_summary_admin_token';
    const DEFAULT_STORE = 'marugoS';
    const $ = (id) => document.getElementById(id);
    const dom = {
      authBadge:$('authBadge'), authCard:$('authCard'), authMsg:$('authMsg'), tokenInput:$('tokenInput'), tokenBtn:$('tokenBtn'),
      storeSel:$('storeSel'), reportSel:$('reportSel'), reloadBtn:$('reloadBtn'), loadMsg:$('loadMsg'),
      resultArea:$('resultArea'), summary:$('summary'), tbody:$('tbody'), bars:$('bars'), analysis:$('analysis'),
      qaCard:$('qaCard'), qSuggest:$('qSuggest'), qInput:$('qInput'), qBtn:$('qBtn'), qAnswer:$('qAnswer'),
    };
    const SUGGESTED_Q = ['直近でマルゴSが一番売れた日は？','マルゴSの客単価を上げるには？','フードコート内での強み・弱みは？','売上を伸ばすための提案を3つ'];
    let reports = [];

    const nf = new Intl.NumberFormat('ja-JP');
    const yen = (v) => '¥' + nf.format(Math.round(Number(v)||0));
    const pct = (v) => v==null ? '—' : (Math.round(Number(v)*10)/10).toFixed(1) + '%';
    const norm = (s) => String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');

    function getToken(){ try { return AUTH ? AUTH.getToken() : (localStorage.getItem(TOKEN_KEY)||''); } catch(_){ return ''; } }
    function lockedStore(){ try { return sessionStorage.getItem('line_locked_store') || localStorage.getItem('line_locked_store') || ''; } catch(_){ return ''; } }
    function captureLockedStoreFromUrl(){
      try {
        const p = new URLSearchParams(location.search);
        if (p.get('from') !== 'line') return;
        const raw = String(p.get('store_key') || p.get('store') || '').trim();
        if (!raw) return;
        let key = (PAGES && PAGES.resolveStoreKey) ? PAGES.resolveStoreKey(raw,'') : raw.toLowerCase();
        key = String(key||'').trim();
        if (key) { try { sessionStorage.setItem('line_locked_store', key); localStorage.setItem('line_locked_store', key); } catch(_){} }
      } catch(_){}
    }
    function setAuthBadge(ok){
      dom.authBadge.textContent = ok ? '接続済み' : '未接続';
      dom.authBadge.className = 'pill' + (ok ? ' ok' : '');
      dom.authCard.hidden = !!ok;
      if (dom.qaCard) dom.qaCard.hidden = !ok;
    }

    async function apiFetch(path){
      const url = PAGES.receiptAdminApiUrl(path);
      let res;
      try { res = await fetch(url, { headers: { 'x-admin-token': getToken() } }); }
      catch(_){ throw new Error('通信に失敗しました（ネットワーク/接続先）。'); }
      if (res.status === 401 || res.status === 403){ setAuthBadge(false); throw new Error('認証が必要です。管理トークンを入力するか、LINEの最新リンクから開いてください。'); }
      const body = await res.json().catch(()=>({}));
      if (!res.ok || body.error) throw new Error(body.error || ('エラー（HTTP ' + res.status + '）'));
      return body;
    }
    async function apiPost(path, payload){
      const url = PAGES.receiptAdminApiUrl(path);
      let res;
      try { res = await fetch(url, { method:'POST', headers:{ 'x-admin-token':getToken(), 'Content-Type':'application/json' }, body: JSON.stringify(payload||{}) }); }
      catch(_){ throw new Error('通信に失敗しました（ネットワーク/接続先）。'); }
      if (res.status===401 || res.status===403){ setAuthBadge(false); throw new Error('認証が必要です。管理トークンを入力するか、LINEの最新リンクから開いてください。'); }
      const body = await res.json().catch(()=>({}));
      if (!res.ok || body.error) throw new Error(body.error || ('エラー（HTTP ' + res.status + '）'));
      return body;
    }
    async function askQuestion(q){
      const question = String(q!=null?q:(dom.qInput.value||'')).trim();
      if (!question){ dom.qInput.focus(); return; }
      dom.qInput.value = question;
      dom.qBtn.disabled = true; dom.qAnswer.textContent = '考え中…（蓄積データを参照しています）';
      try {
        const b = await apiPost('/foodcourt/ask', { store_key: dom.storeSel.value || DEFAULT_STORE, question: question });
        dom.qAnswer.textContent = b.answer || '(回答が空でした)';
      } catch(e){ dom.qAnswer.textContent = (e&&e.message) || '質問に失敗しました。'; }
      finally { dom.qBtn.disabled = false; }
    }
    function renderSuggestions(){
      dom.qSuggest.innerHTML = '';
      SUGGESTED_Q.forEach(function(s){
        const b = document.createElement('button'); b.className='ghost'; b.style.fontSize='12px'; b.style.minHeight='30px'; b.style.padding='4px 10px';
        b.textContent = s; b.addEventListener('click', function(){ askQuestion(s); });
        dom.qSuggest.appendChild(b);
      });
    }

    function populateStores(){
      const locked = lockedStore();
      const keys = Object.keys(STORE_NAMES);
      dom.storeSel.innerHTML = '';
      const add = (k,label) => { const o=document.createElement('option'); o.value=k; o.textContent=label; dom.storeSel.appendChild(o); };
      if (locked){ add(locked, STORE_NAMES[locked] || locked); dom.storeSel.value = locked; dom.storeSel.disabled = true; return; }
      if (!keys.length) add(DEFAULT_STORE, STORE_NAMES[DEFAULT_STORE] || 'マルゴエス');
      keys.forEach(k => add(k, STORE_NAMES[k] || k));
      dom.storeSel.value = (STORE_NAMES[DEFAULT_STORE] ? DEFAULT_STORE : (keys[0]||DEFAULT_STORE));
    }

    function fmtWhen(r){
      const iso = r.created_at || '';
      const d = iso ? new Date(iso) : null;
      let label = '';
      if (d && !isNaN(d.getTime())){
        const j = new Date(d.getTime() + 9*3600*1000); // JST表示
        label = j.getUTCFullYear()+'/'+(j.getUTCMonth()+1)+'/'+j.getUTCDate()+' '+String(j.getUTCHours()).padStart(2,'0')+':'+String(j.getUTCMinutes()).padStart(2,'0');
      } else { label = '#' + r.id; }
      if (r.report_date) label = r.report_date + '（受信 ' + label + '）';
      return label;
    }

    function computeComparison(report){
      const list = (report.tenants||[]).map(t=>({ name:String((t&&t.name)||''), sales:(t&&t.sales!=null)?Number(t.sales):null, guests:(t&&t.guests!=null)?Number(t.guests):null }))
        .filter(t => t.sales!=null && isFinite(t.sales) && t.sales>=0 && t.name);
      if (list.length < 2) return null;
      const baseName = report.base_tenant_name || 'MARUGO S';
      const base = list.find(t => norm(t.name)===norm(baseName));
      if (!base) return null;
      const unitOf = (t)=> (t.guests && t.guests>0) ? t.sales/t.guests : null;
      const baseUnit = unitOf(base);
      const total = list.reduce((a,b)=>a+b.sales,0);
      const rows = list.map(t=>{
        const u = unitOf(t);
        return { name:t.name, sales:t.sales, salesRatio: base.sales>0? t.sales/base.sales*100 : null,
          guests:t.guests, guestRatio:(base.guests>0 && t.guests!=null)? t.guests/base.guests*100 : null,
          unit:u, unitRatio:(u!=null && baseUnit)? u/baseUnit*100 : null, isBase:(t===base) };
      }).sort((a,b)=> b.sales - a.sales);
      const salesRank = 1 + list.filter(t=>t.sales>base.sales).length;
      const guestRank = 1 + list.filter(t=>(t.guests||0)>(base.guests||0)).length;
      const unitRank = baseUnit==null?0: 1 + list.filter(t=>{const u=unitOf(t); return u!=null && u>baseUnit;}).length;
      return { baseName:base.name, baseSales:base.sales, baseGuests:base.guests, baseUnit, total,
        share: total>0? base.sales/total*100 : null, salesRank, guestRank, unitRank, count:list.length, rows };
    }

    function median(arr){ const a=arr.filter(x=>x!=null && isFinite(x)).slice().sort((x,y)=>x-y); if(!a.length) return null; const m=Math.floor(a.length/2); return a.length%2? a[m] : (a[m-1]+a[m])/2; }
    function avg(arr){ const a=arr.filter(x=>x!=null && isFinite(x)); return a.length? a.reduce((s,x)=>s+x,0)/a.length : null; }
    function relPct(v, base){ return (base&&base>0&&v!=null)? Math.round(v/base*1000)/10 : null; }

    // 全レポート（履歴）から基準店の日次系列を作る（created_at 昇順）。前年対比が無い新規店のため、自店の履歴が基準。
    function baseSeriesFromReports(allReports, baseName){
      const out=[];
      (allReports||[]).forEach(r=>{
        const li=(r.tenants||[]).map(t=>({name:String((t&&t.name)||''),sales:(t&&t.sales!=null)?Number(t.sales):null,guests:(t&&t.guests!=null)?Number(t.guests):null}))
          .filter(t=>t.name && t.sales!=null && isFinite(t.sales) && t.sales>=0);
        if(li.length<2) return;
        const b=li.find(t=>norm(t.name)===norm(baseName)); if(!b) return;
        const tot=li.reduce((s,t)=>s+t.sales,0);
        const k=(b.guests&&b.guests>0)?b.sales/b.guests:null;
        out.push({ when:String(r.created_at||''), sales:b.sales, guests:b.guests, kt:k,
          salesRank:1+li.filter(t=>t.sales>b.sales).length, share: tot>0?b.sales/tot*100:null });
      });
      out.sort((a,b)=>a.when.localeCompare(b.when));
      return out;
    }
    function fmtDay(when){ const d=when?new Date(when):null; if(!d||isNaN(d.getTime()))return ''; const j=new Date(d.getTime()+9*3600*1000); return (j.getUTCMonth()+1)+'/'+j.getUTCDate(); }

    // これらの数字を多角的に分析し、まとめテキストを生成（ルールベース＝確定的・無料）。本日の売上は“自店の履歴”を参照して考察する。
    function buildAnalysisText(report, allReports){
      const list = (report.tenants||[]).map(t=>({
        name:String((t&&t.name)||''),
        sales:(t&&t.sales!=null)?Number(t.sales):null,
        guests:(t&&t.guests!=null)?Number(t.guests):null,
        cs:(t&&t.compSales!=null)?Number(t.compSales):null,
        cg:(t&&t.compGuests!=null)?Number(t.compGuests):null,
      })).filter(t=>t.name && t.sales!=null && isFinite(t.sales) && t.sales>=0);
      if (list.length<2) return '分析に必要なデータが不足しています。';
      const baseName = report.base_tenant_name || 'MARUGO S';
      const base = list.find(t=>norm(t.name)===norm(baseName));
      if (!base) return '基準店（'+baseName+'）が見つかりませんでした。';
      const ktOf = t=> (t.guests&&t.guests>0)? t.sales/t.guests : null;
      const n = list.length;
      const totalSales = list.reduce((s,t)=>s+t.sales,0);
      const totalGuests = list.reduce((s,t)=>s+(t.guests||0),0);
      const courtKt = totalGuests>0? totalSales/totalGuests : null;
      const avgSales = avg(list.map(t=>t.sales)), medSales = median(list.map(t=>t.sales));
      const avgGuests = avg(list.map(t=>t.guests)), avgKt = avg(list.map(ktOf));
      const medKt = median(list.map(ktOf));
      const baseKt = ktOf(base);
      const rank = (v,key)=>1+list.filter(t=>(key==='kt'?(ktOf(t)||0):(t[key]||0))>v).length;
      const salesRank = rank(base.sales,'sales'), guestRank = rank(base.guests||0,'guests');
      const ktRank = baseKt==null?null:(1+list.filter(t=>{const u=ktOf(t);return u!=null&&u>baseKt;}).length);
      const bySales = list.slice().sort((a,b)=>b.sales-a.sales);
      const leader = bySales[0];
      const idx = bySales.findIndex(t=>t===base);
      const above = idx>0? bySales[idx-1] : null, below = idx<bySales.length-1? bySales[idx+1] : null;
      const share = totalSales>0? base.sales/totalSales*100 : null;

      const L = [];
      const yK = v=>'¥'+nf.format(Math.round(v));
      const p1 = v=>v==null?'—':(Math.round(v*10)/10).toFixed(1)+'%';

      // 総評
      const volWord = (salesRank<=Math.ceil(n/3))?'上位':(salesRank<=Math.ceil(n*2/3)?'中位':'下位');
      const ktWord = ktRank==null?'—':((ktRank<=Math.ceil(n/3))?'上位':(ktRank<=Math.ceil(n*2/3)?'中位':'下位'));
      let typ = '';
      if (ktRank!=null){
        if (guestRank<=Math.ceil(n/2) && ktRank>Math.ceil(n/2)) typ='＝客数で稼ぐ「客数型（単価が弱み）」';
        else if (ktRank<=Math.ceil(n/2) && guestRank>Math.ceil(n/2)) typ='＝単価で稼ぐ「単価型（集客が弱み）」';
        else if (guestRank<=Math.ceil(n/2) && ktRank<=Math.ceil(n/2)) typ='＝客数・単価とも上位の「総合上位」';
        else typ='＝客数・単価とも下位で「全体的に弱い」';
      }
      L.push('【総評】');
      L.push(`${base.name} はフードコート ${n}店中、売上 ${salesRank}位・客数 ${guestRank}位・客単価 ${ktRank==null?'—':ktRank+'位'}。売上シェア ${p1(share)}。`);
      L.push(`売上は${volWord}、客単価は${ktWord}${typ}。`);
      L.push('');

      // 売上
      L.push('【売上】');
      L.push(`対象売上 ${yK(base.sales)}（FC平均 ${yK(avgSales)} の ${p1(relPct(base.sales,avgSales))}、中央値 ${yK(medSales)} の ${p1(relPct(base.sales,medSales))}）。`);
      if (leader && leader!==base) L.push(`首位 ${leader.name} ${yK(leader.sales)} とは ${yK(leader.sales-base.sales)}（${(leader.sales/base.sales).toFixed(2)}倍）差。`);
      if (above) L.push(`すぐ上：${above.name} ${yK(above.sales)}（+${yK(above.sales-base.sales)}）。`);
      if (below) L.push(`すぐ下：${below.name} ${yK(below.sales)}（${yK(below.sales-base.sales)}）。`);
      L.push('');

      // 客数
      L.push('【客数】');
      L.push(`対象客数 ${base.guests!=null?nf.format(base.guests)+'人':'—'}（FC平均 ${avgGuests!=null?nf.format(Math.round(avgGuests))+'人':'—'} の ${p1(relPct(base.guests,avgGuests))}、${guestRank}位）。`);
      L.push('');

      // 客単価
      const byKt = list.map(t=>({name:t.name,kt:ktOf(t)})).filter(x=>x.kt!=null).sort((a,b)=>b.kt-a.kt);
      L.push('【客単価（1人あたり）】');
      L.push(`${baseKt!=null?yK(baseKt):'—'}（FC平均 ${avgKt!=null?yK(avgKt):'—'} の ${p1(relPct(baseKt,avgKt))}、中央値 ${medKt!=null?yK(medKt):'—'} の ${p1(relPct(baseKt,medKt))}、${ktRank==null?'—':ktRank+'位'}）。`);
      if (byKt.length) L.push(`FC内 最高 ${byKt[0].name} ${yK(byKt[0].kt)}／最低 ${byKt[byKt.length-1].name} ${yK(byKt[byKt.length-1].kt)}。`);
      L.push('');

      // 履歴・推移（自店）。新規オープンで前年対比が無いため、これが本日の売上を見る基準。
      L.push('【履歴・推移（自店が基準）】');
      L.push('※新規オープンのため前年対比はありません。毎日の蓄積（自店の履歴）を基準に本日を評価します。');
      const series = baseSeriesFromReports(allReports, baseName);
      const selWhen = String(report.created_at||'');
      let selIdx = series.findIndex(p=>p.when===selWhen);
      if (selIdx<0) selIdx = series.length-1; // 一致しなければ最新を本日扱い
      const past = series.slice(0, Math.max(0, selIdx)); // 本日より前
      if (!series.length){
        L.push('履歴がまだありません。');
      } else if (!past.length){
        L.push(`蓄積 ${series.length}日目（本日が最古のデータ）。履歴比較は明日以降、日数が増えるほど精度が上がります。`);
      } else {
        const pastSalesAvg = avg(past.map(p=>p.sales));
        const pastKtAvg = avg(past.map(p=>p.kt));
        const pastRankAvg = avg(past.map(p=>p.salesRank));
        const prev = past[past.length-1];
        const allSales = series.map(p=>p.sales);
        const best = Math.max.apply(null, allSales), worst = Math.min.apply(null, allSales);
        L.push(`蓄積 ${series.length}日分。本日の売上 ${yK(base.sales)} は、自店の過去平均 ${yK(pastSalesAvg)} の ${p1(relPct(base.sales,pastSalesAvg))}（${base.sales>=pastSalesAvg?'平均以上':'平均以下'}）。`);
        L.push(`前回(${fmtDay(prev.when)}) ${yK(prev.sales)} との差 ${yK(base.sales-prev.sales)}（${p1(prev.sales>0?(base.sales/prev.sales-1)*100:null)}）＝${base.sales>=prev.sales?'増':'減'}。`);
        L.push(`期間中の最高 ${yK(best)}／最低 ${yK(worst)}（本日は${base.sales>=best?'最高':base.sales<=worst?'最低':'中間'}）。`);
        if (baseKt!=null && pastKtAvg!=null) L.push(`客単価 ${yK(baseKt)} は過去平均 ${yK(pastKtAvg)} の ${p1(relPct(baseKt,pastKtAvg))}。`);
        if (pastRankAvg!=null) L.push(`FC内 売上順位は本日 ${salesRank}位、過去平均 ${(Math.round(pastRankAvg*10)/10).toFixed(1)}位（${salesRank<=pastRankAvg?'改善/同等':'やや後退'}）。`);
        // 直近トレンド（後半3日 vs 前半）
        if (series.length>=4){
          const half=Math.floor(series.length/2);
          const early=avg(series.slice(0,half).map(p=>p.sales)), late=avg(series.slice(series.length-half).map(p=>p.sales));
          if (early && late) L.push(`全体トレンド：直近平均 ${yK(late)} は前半平均 ${yK(early)} の ${p1(relPct(late,early))}（${late>=early?'上向き':'下向き'}）。`);
        }
      }
      L.push('');

      // 強み・弱み
      L.push('【強み・弱み】');
      const strengths=[], weaks=[];
      if (guestRank<=Math.ceil(n/2)) strengths.push(`集客力（客数 ${guestRank}位）`); else weaks.push(`集客（客数 ${guestRank}位）`);
      if (ktRank!=null){ if (ktRank<=Math.ceil(n/2)) strengths.push(`客単価（${ktRank}位）`); else weaks.push(`客単価（${ktRank}位・FC平均比 ${p1(relPct(baseKt,avgKt))}）`); }
      if (share!=null && share>=100/n) strengths.push(`売上シェア ${p1(share)}（平均以上）`);
      L.push('強み：'+(strengths.length?strengths.join('、'):'特になし'));
      L.push('弱み：'+(weaks.length?weaks.join('、'):'特になし'));
      L.push('');

      // 打ち手（シミュレーション）
      L.push('【打ち手（試算）】');
      if (baseKt!=null && medKt!=null && base.guests){
        if (medKt>baseKt){
          const proj = Math.round(base.guests*medKt);
          const newRank = 1+list.filter(t=>t.sales>proj).length;
          L.push(`・客単価をFC中央値 ${yK(medKt)} に上げると（客数 ${nf.format(base.guests)}人 維持）売上は ${yK(base.sales)}→${yK(proj)}（${p1((proj/base.sales-1)*100)}増）＝売上 ${newRank}位相当。`);
        } else {
          L.push(`・客単価は既にFC中央値以上。強みを維持しつつ客数増が伸びしろ。`);
        }
      }
      if (avgGuests!=null && base.guests!=null && avgGuests>base.guests && baseKt!=null){
        const proj2 = Math.round(avgGuests*baseKt);
        L.push(`・客数をFC平均 ${nf.format(Math.round(avgGuests))}人 に増やすと（単価維持）売上は ${yK(proj2)}（${p1((proj2/base.sales-1)*100)}増）。`);
      }
      L.push('');

      L.push('【注意】業態（寿司／フレンチ／ラーメン／ビア等）で単価帯が異なるため、客単価の順位は参考程度。新規オープンで前年対比は無いため、最も確実な基準は自店の日々の履歴（推移）です。日数が増えるほど傾向の精度が上がります。');
      return L.join('\n');
    }

    function render(report){
      const c = computeComparison(report);
      if (!c){ dom.resultArea.hidden = true; dom.loadMsg.className='msg err'; dom.loadMsg.textContent='このレポートは比較できませんでした（基準店が見つからない/データ不足）。'; return; }
      dom.loadMsg.textContent='';
      dom.resultArea.hidden = false;
      try { dom.analysis.textContent = buildAnalysisText(report, reports); } catch(e){ dom.analysis.textContent = '分析テキストの生成に失敗しました。'; }
      const cards = [
        ['基準店', c.baseName],
        ['合計売上（FC全体）', yen(c.total)],
        ['基準店シェア', pct(c.share)],
        ['基準店の順位', '売上 '+c.salesRank+'位 / 客数 '+c.guestRank+'位 / 単価 '+(c.unitRank||'—')+'位（'+c.count+'店）'],
      ];
      dom.summary.innerHTML = cards.map(x=>'<div class="metric"><div class="l">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join('');

      let rank=0;
      dom.tbody.innerHTML = c.rows.map(r=>{ rank++; return '<tr'+(r.isBase?' class="base"':'')+'>'
        + '<td>'+rank+'</td>'
        + '<td class="name">'+escapeHtml(r.name)+(r.isBase?'（基準）':'')+'</td>'
        + '<td>'+yen(r.sales)+'</td>'
        + '<td>'+pct(r.salesRatio)+'</td>'
        + '<td>'+(r.guests!=null?nf.format(r.guests):'—')+'</td>'
        + '<td>'+pct(r.guestRatio)+'</td>'
        + '<td>'+(r.unit!=null?yen(r.unit):'—')+'</td>'
        + '<td>'+pct(r.unitRatio)+'</td>'
        + '</tr>'; }).join('');

      const maxRatio = Math.max.apply(null, c.rows.map(r=>r.salesRatio||0).concat([100]));
      dom.bars.innerHTML = c.rows.map(r=>{
        const w = maxRatio>0 ? Math.max(2, (r.salesRatio||0)/maxRatio*100) : 0;
        return '<div class="bar-row"><div class="bar-name" title="'+escapeHtml(r.name)+'">'+escapeHtml(r.name)+'</div>'
          + '<div class="bar-track"><div class="bar-fill'+(r.isBase?' base':'')+'" style="width:'+w.toFixed(1)+'%"></div></div>'
          + '<div class="bar-val">'+pct(r.salesRatio)+'</div></div>';
      }).join('');
    }

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }

    function populateReports(){
      dom.reportSel.innerHTML = '';
      if (!reports.length){ const o=document.createElement('option'); o.textContent='（データなし）'; o.value=''; dom.reportSel.appendChild(o); dom.resultArea.hidden=true; dom.loadMsg.textContent='このフードコート画像のレポートはまだありません。LINEで「テナント一覧」画像を送ると貯まります。'; return; }
      reports.forEach((r,i)=>{ const o=document.createElement('option'); o.value=String(i); o.textContent=fmtWhen(r); dom.reportSel.appendChild(o); });
      dom.reportSel.value='0';
      render(reports[0]);
    }

    async function loadReports(){
      if (!getToken()){ setAuthBadge(false); return; }
      const store = dom.storeSel.value || DEFAULT_STORE;
      dom.loadMsg.className='msg'; dom.loadMsg.textContent='読み込み中…';
      try {
        const body = await apiFetch('/foodcourt/reports?store_key='+encodeURIComponent(store)+'&limit=60');
        reports = Array.isArray(body.reports) ? body.reports : [];
        setAuthBadge(true);
        dom.loadMsg.textContent='';
        populateReports();
      } catch(e){ dom.loadMsg.className='msg err'; dom.loadMsg.textContent=(e&&e.message)||'読み込みに失敗しました。'; }
    }

    async function connectWithToken(){
      const t = dom.tokenInput.value.trim();
      if (!t){ dom.authMsg.className='msg err'; dom.authMsg.textContent='トークンを入力してください。'; return; }
      dom.tokenBtn.disabled = true;
      try {
        if (AUTH && AUTH.loginWithToken){
          await AUTH.loginWithToken(t, { sessionUrl: PAGES.adminApiUrl('/auth/session', PAGES.PROJECT_URL), adminSurface: PAGES.ADMIN_SURFACE || 'line_report' });
        } else { localStorage.setItem(TOKEN_KEY, t); }
        setAuthBadge(true);
        await loadReports();
      } catch(e){ dom.authMsg.className='msg err'; dom.authMsg.textContent=(e&&e.message)||'認証に失敗しました。'; }
      finally { dom.tokenBtn.disabled = false; }
    }

    dom.tokenBtn.addEventListener('click', connectWithToken);
    dom.tokenInput.addEventListener('keydown', e=>{ if(e.key==='Enter') connectWithToken(); });
    dom.qBtn.addEventListener('click', ()=>askQuestion());
    dom.qInput.addEventListener('keydown', e=>{ if(e.key==='Enter') askQuestion(); });
    renderSuggestions();
    dom.reloadBtn.addEventListener('click', loadReports);
    dom.storeSel.addEventListener('change', loadReports);
    dom.reportSel.addEventListener('change', ()=>{ const i=Number(dom.reportSel.value); if(reports[i]) render(reports[i]); });

    (async function init(){
      captureLockedStoreFromUrl();
      populateStores();
      if (AUTH && AUTH.consumeUrlAuthParams){
        try { await AUTH.consumeUrlAuthParams({ exchangeUrl: PAGES.adminApiUrl('/auth/link-login', PAGES.PROJECT_URL), adminSurface: PAGES.ADMIN_SURFACE || 'line_report' }); } catch(_){}
      }
      setAuthBadge(!!getToken());
      if (getToken()) await loadReports();
    })();
  })();
  </script>
</body>
</html>
