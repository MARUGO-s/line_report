<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow" />
<title>ルーム設定</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:        oklch(0.15 0.012 256);
    --surface:   oklch(0.205 0.016 258);
    --surface2:  oklch(0.245 0.018 258);
    --press:     oklch(0.275 0.02 258);
    --line:      oklch(1 0 0 / 0.07);
    --line-soft: oklch(1 0 0 / 0.045);
    --tx-1:      oklch(0.97 0 0);
    --tx-2:      oklch(0.74 0.012 258);
    --tx-3:      oklch(0.56 0.014 258);
    --accent:    oklch(0.62 0.17 256);
    --accent-tx: oklch(0.74 0.13 256);
    --accent-ghost: oklch(0.62 0.17 256 / 0.14);
    --on:        oklch(0.60 0.17 256);
    --off:       oklch(0.34 0.012 258);
    --live:      oklch(0.72 0.15 158);
    --live-soft: oklch(0.72 0.15 158 / 0.16);
    --warn-tx:   oklch(0.80 0.13 70);
    --warn-soft: oklch(0.74 0.13 70 / 0.15);
    --danger:    oklch(0.64 0.2 25);
    --r-card: 18px;
  }
  body[data-theme='light']{
    --bg:        oklch(0.98 0.003 256);
    --surface:   oklch(1 0 0);
    --surface2:  oklch(0.95 0.006 258);
    --press:     oklch(0.91 0.008 258);
    --line:      oklch(0 0 0 / 0.10);
    --line-soft: oklch(0 0 0 / 0.07);
    --tx-1:      oklch(0.22 0.02 258);
    --tx-2:      oklch(0.42 0.02 258);
    --tx-3:      oklch(0.56 0.02 258);
    --accent:    oklch(0.55 0.17 256);
    --accent-tx: oklch(0.48 0.15 256);
    --accent-ghost: oklch(0.55 0.17 256 / 0.12);
    --on:        oklch(0.55 0.17 256);
    --off:       oklch(0.82 0.01 258);
    --live:      oklch(0.55 0.14 158);
    --live-soft: oklch(0.55 0.14 158 / 0.14);
    --warn-tx:   oklch(0.55 0.14 70);
    --warn-soft: oklch(0.55 0.14 70 / 0.14);
    --danger:    oklch(0.55 0.19 25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--tx-1);
    font-family:"Noto Sans JP",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .mono{font-family:"JetBrains Mono",monospace;}
  [hidden]{display:none !important;}

  .phone{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}
  @media (min-width:520px){
    body{background:oklch(0.11 0.01 256);padding:26px 0 40px;}
    body[data-theme='light']{background:oklch(0.93 0.006 258);}
    .phone{min-height:auto;border:1px solid var(--line);border-radius:30px;overflow:hidden;box-shadow:0 30px 80px -30px #000;}
  }

  /* ── login screen ── */
  .login{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:24px 20px calc(env(safe-area-inset-bottom) + 24px);}
  @media (min-width:520px){ .login{min-height:auto;padding-top:60px;padding-bottom:60px;} }
  .login h1{font-size:21px;font-weight:700;margin:0 0 4px;}
  .login .lsub{color:var(--tx-3);font-size:12.5px;margin-bottom:22px;}
  .login .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);padding:18px;}
  .login label{display:block;font-size:12.5px;color:var(--tx-2);margin-bottom:8px;}
  .pwwrap{position:relative;}
  .login input[type=password],.login input[type=text]{width:100%;background:var(--surface2);border:1px solid var(--line);
    border-radius:12px;color:var(--tx-1);padding:13px 64px 13px 13px;font-size:16px;font-family:inherit;outline:none;}
  .pwtoggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:var(--tx-3);
    font-size:12.5px;cursor:pointer;padding:6px 8px;font-family:inherit;}
  .btn{width:100%;font-family:inherit;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;
    background:var(--accent);color:#fff;margin-top:14px;}
  .btn:disabled{opacity:.5;}
  .lmsg{font-size:13px;margin-top:12px;display:none;}
  .lmsg.err{display:block;color:oklch(0.72 0.16 25);}

  /* ── sticky header ── */
  .topbar{position:sticky;top:0;z-index:20;background:color-mix(in oklch, var(--bg) 82%, transparent);
    backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);
    border-bottom:1px solid var(--line-soft);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;}
  .tb-row{display:flex;align-items:center;gap:12px;}
  .tb-title{font-size:19px;font-weight:700;letter-spacing:.01em;}
  .tb-sub{display:flex;align-items:center;gap:7px;margin-top:3px;}
  .roomchip{display:inline-flex;align-items:center;gap:7px;max-width:100%;background:var(--surface);
    border:1px solid var(--line-soft);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--tx-3);cursor:pointer;}
  .roomchip .rc-id{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;}
  .roomchip:active{background:var(--press);}
  .roomchip svg{flex:none;color:var(--tx-3);}
  .theme-toggle{flex:none;font-family:inherit;font-size:11.5px;font-weight:600;color:var(--tx-3);
    background:var(--surface);border:1px solid var(--line-soft);border-radius:999px;padding:6px 12px;cursor:pointer;}
  .theme-toggle:active{background:var(--press);}
  .tb-actions{display:flex;align-items:center;gap:8px;flex:none;}
  .back-mtalk{
    display:inline-flex;align-items:center;justify-content:center;gap:4px;
    flex:none;font-family:inherit;font-size:12.5px;font-weight:700;
    color:#fff;background:var(--accent);border:0;border-radius:999px;
    padding:8px 12px;text-decoration:none;white-space:nowrap;cursor:pointer;
  }
  .back-mtalk:active{opacity:.88;}
  .login .back-mtalk{margin:0 0 18px;width:auto;}
  .back-mtalk-bar{display:flex;width:100%;margin-top:12px;padding:11px 14px;}
  .footer .back-mtalk{display:flex;width:100%;max-width:100%;margin:0 auto 4px;padding:11px 14px;}
  .search{display:flex;align-items:center;gap:9px;margin-top:13px;background:var(--surface);
    border:1px solid var(--line-soft);border-radius:12px;padding:0 12px;}
  .search svg{color:var(--tx-3);flex:none;}
  .search input{flex:1;min-width:0;background:transparent;border:0;outline:none;font-family:inherit;font-size:15px;color:var(--tx-1);padding:11px 0;}
  .search input::placeholder{color:var(--tx-3);}
  .search .clr{display:none;border:0;background:transparent;color:var(--tx-3);cursor:pointer;padding:4px;}
  .search.has .clr{display:flex;}

  .summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 4px;}
  .sum-v{font-size:13px;color:var(--tx-2);}
  .sum-v b{color:var(--tx-1);font-weight:700;}
  .expand-all{font-family:inherit;font-size:12.5px;font-weight:600;color:var(--accent-tx);background:transparent;border:0;cursor:pointer;padding:6px 4px;}

  .list{padding:8px 16px 30px;display:flex;flex-direction:column;gap:14px;}
  .sec{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-card);overflow:hidden;}
  .sec-head{display:flex;align-items:center;gap:13px;width:100%;padding:15px 16px;background:transparent;border:0;cursor:pointer;text-align:left;font-family:inherit;}
  .sec-head:active{background:var(--surface2);}
  .sec-ic{width:38px;height:38px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--accent-ghost);color:var(--accent-tx);}
  .sec-meta{flex:1;min-width:0;}
  .sec-t{display:block;font-size:15.5px;font-weight:700;color:var(--tx-1);}
  .sec-c{display:block;font-size:12px;color:var(--tx-3);margin-top:1px;}
  .sec-count{font-size:12px;font-weight:700;color:var(--tx-2);font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:999px;padding:3px 10px;flex:none;}
  .sec-count.on{color:var(--live);background:var(--live-soft);}
  .sec-chev{flex:none;color:var(--tx-3);transition:transform .26s ease;margin-left:2px;}
  .sec.open .sec-chev{transform:rotate(180deg);}
  .sec-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;}
  .sec.open .sec-body{grid-template-rows:1fr;}
  .sec-body > .sec-inner{min-height:0;overflow:hidden;}
  .sec-inner{border-top:1px solid var(--line-soft);}
  .row{display:flex;align-items:center;gap:14px;padding:13px 16px;min-height:58px;border-bottom:1px solid var(--line-soft);}
  .row:last-child{border-bottom:0;}
  .row-meta{flex:1;min-width:0;}
  .row-t{font-size:15px;color:var(--tx-1);font-weight:500;}
  .row-d{font-size:12px;color:var(--tx-3);margin-top:2px;line-height:1.45;}
  .sw{position:relative;flex:none;width:52px;height:32px;cursor:pointer;}
  .sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .sw .track{position:absolute;inset:0;border-radius:999px;background:var(--off);transition:background .22s ease;}
  .sw .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.35);transition:transform .22s cubic-bezier(.3,1.3,.5,1);}
  .sw input:checked + .track{background:var(--on);}
  .sw input:checked + .track + .knob{transform:translateX(20px);}
  .row.kill{background:var(--warn-soft);}
  .row.kill .row-t{color:var(--warn-tx);font-weight:700;}
  .sw.warn input:checked + .track{background:oklch(0.66 0.14 70);}
  .sec-inner.muted .row:not(.kill){opacity:.4;pointer-events:none;}
  .footer{text-align:center;color:var(--tx-3);font-size:11.5px;padding:4px 20px 30px;}
  .no-result{display:none;text-align:center;color:var(--tx-3);font-size:13.5px;padding:40px 20px;}
  .no-result.show{display:block;}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translateX(-50%) translateY(16px);
    background:var(--tx-1);color:var(--bg);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:40;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.bad{background:var(--danger);color:#fff;}
</style>
</head>
<body>

<!-- ── ① パスワード認証 ── -->
<div class="login" id="loginScreen">
  <a class="back-mtalk" id="backMtalkLogin" hidden href="./chat.html">‹ M-talk に戻る</a>
  <h1>ルーム設定</h1>
  <div class="lsub" id="loginRoom">このルームの Bot 機能を設定します</div>
  <div class="card">
    <label for="pw">アクセスパスワード（管理者から伝えられたもの）</label>
    <div class="pwwrap">
      <input id="pw" type="password" autocomplete="off" inputmode="text" placeholder="パスワードを入力" />
      <button type="button" class="pwtoggle" id="pwToggle" aria-label="表示切替">表示</button>
    </div>
    <button class="btn" id="loginBtn">開く</button>
    <div class="lmsg" id="loginMsg"></div>
  </div>
</div>

<!-- ── ② 設定（認証後）── -->
<div class="phone" id="appScreen" hidden>
  <header class="topbar">
    <div class="tb-row">
      <div style="flex:1;min-width:0;">
        <div class="tb-title">ルーム設定</div>
        <div class="tb-sub">
          <span class="roomchip" id="roomChip" title="コピー">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            <span class="rc-id" id="roomChipId"></span>
          </span>
        </div>
      </div>
      <div class="tb-actions">
        <button id="themeToggleBtn" type="button" class="theme-toggle" aria-pressed="false">ライトモード</button>
      </div>
    </div>
    <div class="search" id="searchWrap">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="設定を検索" autocomplete="off" />
      <button class="clr" id="clearSearch" aria-label="クリア">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
      </button>
    </div>
    <a class="back-mtalk back-mtalk-bar" id="backMtalkApp" hidden href="./chat.html">‹ M-talk に戻る</a>
  </header>

  <div class="summary">
    <span class="sum-v" id="sumText">有効 <b>0</b> / 0 項目</span>
    <button class="expand-all" id="expandAll">すべて展開</button>
  </div>

  <div class="list" id="list"></div>
  <div class="no-result" id="noResult">一致する設定がありません</div>
  <div class="footer">
    <a class="back-mtalk" id="backMtalkFooter" hidden href="./chat.html">‹ M-talk に戻る</a>
    <div style="margin-top:12px;">変更はその場で自動保存されます</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./pages-config.js"></script>
<script src="./vendor/supabase/supabase-2.110.9.min.js"></script>
<script src="./app-theme.js?v=20260712"></script>

    ]},
  ];
  // 東京ドーム週次配信の曜日・時刻（読み込み時にDB値で更新。NULL=既定 土/10時/0分）。

  var gmailAlertInterval = { minutes:1, anchorHour:10, anchorMinute:0 };
  // 本日の予約状況配信の時刻（NULL=既定 18:00）。
  var todayReservationAlert = { hour:18, minute:0 };
  // 予定配信のリマインド設定スロット（最大3件）。
  var calendarReminder = {
    slots: [
      { id: 'slot_1', target: 'tomorrow', hour: 19, minute: 0, enabled: true }
    ]
  };
  var GMAIL_ALERT_INTERVAL_OPTIONS = [
    [1,'1分ごと（リアルタイム）'], [15,'15分ごとにまとめる'], [30,'30分ごとにまとめる'],
    [60,'1時間ごとにまとめる'], [120,'2時間ごとにまとめる'], [180,'3時間ごとにまとめる'],
    [360,'6時間ごとにまとめる'], [480,'8時間ごとにまとめる'], [720,'12時間ごとにまとめる'],

  ];
  var WDAY_JP = ['日','月','火','水','木','金','土'];

  var el = function(id){ return document.getElementById(id); };
  var toast = el('toast'), toastTimer;
  function showToast(msg, bad){
    toast.textContent = msg; toast.classList.toggle('bad', !!bad); toast.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 1500);
  }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  function authHeaders(withSession){
    var h = { 'Content-Type':'application/json', 'apikey':ANON, 'Authorization':'Bearer '+ANON, 'x-admin-surface':SURFACE };
    if (fromChat && chatAccessToken) h['Authorization'] = 'Bearer ' + chatAccessToken;
    else if (withSession && sessionToken) h['x-admin-token'] = sessionToken;
    return h;
  }

  function configUrl(){
    if (fromChat) return apiUrl('/chat-room-config?group_id=' + encodeURIComponent(String(chatGroupId)));
    return apiUrl('/room-config?room_id=' + encodeURIComponent(roomId));
  }

  function saveBody(patch){
    var body = fromChat ? { group_id: chatGroupId } : { room_id: roomId };
    var k;
    for (k in patch) { if (Object.prototype.hasOwnProperty.call(patch, k)) body[k] = patch[k]; }
    return body;
  }

  /* ── 認証 ── */
  el('pwToggle').addEventListener('click', function(){
    var i = el('pw'); var s = i.type === 'password';
    i.type = s ? 'text' : 'password'; this.textContent = s ? '隠す' : '表示';
  });
  function login(){
    var pw = el('pw').value;
    if (!pw){ el('loginMsg').textContent='パスワードを入力してください。'; el('loginMsg').className='lmsg err'; return; }
    if (fromChat){ el('loginMsg').textContent='M-talk にログインしてから開き直してください。'; el('loginMsg').className='lmsg err'; return; }
    if (!lt){ el('loginMsg').textContent='リンクが無効です。LINEからもう一度「設定」を送ってください。'; el('loginMsg').className='lmsg err'; return; }
    el('loginBtn').disabled = true;
    fetch(apiUrl('/auth/room-config-login'), { method:'POST', headers:authHeaders(false),
      body: JSON.stringify({ login_token: lt, password: pw, room_id: roomId, remember_login:false }) })
      .then(function(r){ return r.json().then(function(b){ return {ok:r.ok,b:b}; }); })
      .then(function(res){
        el('loginBtn').disabled = false;
        if (!res.ok || !res.b || !res.b.session_token){
          el('loginMsg').textContent = (res.b && res.b.error) || 'リンクまたはパスワードが正しくありません。';
          el('loginMsg').className = 'lmsg err'; return;
        }
        sessionToken = res.b.session_token;
        try { sessionStorage.setItem(SESSION_KEY, sessionToken); } catch(_e){}
        try { history.replaceState(null,'', location.pathname + '?room_id=' + encodeURIComponent(roomId)); } catch(_e){}
        loadConfig();
      })
      .catch(function(){ el('loginBtn').disabled=false; el('loginMsg').textContent='通信に失敗しました。'; el('loginMsg').className='lmsg err'; });
  }
  el('loginBtn').addEventListener('click', login);
  el('pw').addEventListener('keydown', function(e){ if (e.key==='Enter') login(); });
  // ログイン画面ではまだルーム名を取得できない（認証後の GET /room-config で取得）ため ID は出さない。

  function relogin(){
    sessionToken = '';
    chatAccessToken = '';
    try { sessionStorage.removeItem(SESSION_KEY); } catch(_e){}
    el('appScreen').hidden = true; el('loginScreen').hidden = false;
    el('loginMsg').textContent = fromChat
      ? 'セッションが切れました。M-talk にログインしてから、もう一度設定を開いてください。'
      : 'セッションが切れました。もう一度パスワードを入力してください（リンク使用済みのときはLINEから再度「設定」を送ってください）。';
    el('loginMsg').className = 'lmsg err';
  }

  /* ── 設定の読み込み → 画面表示 ── */
  function loadConfig(){
    fetch(configUrl(), { headers: authHeaders(true) })
      .then(function(r){ if (r.status===401||r.status===403){ relogin(); throw new Error('auth'); } return r.json(); })
      .then(function(b){
        var cfg = (b && b.room_config) || {};
        SECTIONS.forEach(function(s){ s.items.forEach(function(it){ it.on = cfg[it.key] === true; }); });
        domeWeekly.dow    = (cfg.dome_weekly_dow    != null) ? Number(cfg.dome_weekly_dow)    : 6;
        domeWeekly.hour   = (cfg.dome_weekly_hour   != null) ? Number(cfg.dome_weekly_hour)   : 10;
        domeWeekly.minute = (cfg.dome_weekly_minute != null) ? Number(cfg.dome_weekly_minute) : 0;
        fcWeekly.dow    = (cfg.foodcourt_weekly_dow    != null) ? Number(cfg.foodcourt_weekly_dow)    : 1;
        fcWeekly.hour   = (cfg.foodcourt_weekly_hour   != null) ? Number(cfg.foodcourt_weekly_hour)   : 9;
        fcWeekly.minute = (cfg.foodcourt_weekly_minute != null) ? Number(cfg.foodcourt_weekly_minute) : 0;
        reviewAlert.hour   = (cfg.review_alert_hour   != null) ? Number(cfg.review_alert_hour)   : 8;
        reviewAlert.minute = (cfg.review_alert_minute != null) ? Number(cfg.review_alert_minute) : 10;
        gmailAlertInterval.minutes = (cfg.gmail_alert_interval_minutes != null) ? Number(cfg.gmail_alert_interval_minutes) : 1;
        gmailAlertInterval.anchorHour   = (cfg.gmail_alert_anchor_hour   != null) ? Number(cfg.gmail_alert_anchor_hour)   : 10;
        gmailAlertInterval.anchorMinute = (cfg.gmail_alert_anchor_minute != null) ? Number(cfg.gmail_alert_anchor_minute) : 0;
        todayReservationAlert.hour   = (cfg.today_reservation_alert_hour   != null) ? Number(cfg.today_reservation_alert_hour)   : 18;
        todayReservationAlert.minute = (cfg.today_reservation_alert_minute != null) ? Number(cfg.today_reservation_alert_minute) : 0;
        if (Array.isArray(cfg.calendar_reminder_slots) && cfg.calendar_reminder_slots.length > 0) {
          calendarReminder.slots = cfg.calendar_reminder_slots.slice(0, 3).map(function(s, idx){
            return {
              id: String(s.id || ('slot_' + (idx + 1))),
              target: s.target === 'today' ? 'today' : 'tomorrow',
              hour: (s.hour != null) ? Number(s.hour) : 19,
              minute: (s.minute != null) ? Number(s.minute) : 0,
              enabled: s.enabled !== false
            };
          });
        } else {
          var remH = (cfg.calendar_tomorrow_reminder_hour != null) ? Number(cfg.calendar_tomorrow_reminder_hour) : 19;
          var remM = (cfg.calendar_tomorrow_reminder_minute != null) ? Number(cfg.calendar_tomorrow_reminder_minute) : 0;
          calendarReminder.slots = [
            { id: 'slot_1', target: 'tomorrow', hour: remH, minute: remM, enabled: true }
          ];
        }
        var roomName = (cfg.room_name && String(cfg.room_name).trim()) || roomId || 'このルーム';
        el('loginScreen').hidden = true; el('appScreen').hidden = false;
        el('roomChipId').textContent = roomName;
        render(); openFirst();
      })
      .catch(function(e){ if (String(e&&e.message)!=='auth') showToast('設定の読み込みに失敗しました', true); });
  }

  // 東京ドーム週次配信の「曜日・時刻」セレクタ（トグルの直下に表示）。

  // Gmail予約通知の「配信間隔」セレクタ（トグルの直下に表示）。グループ宛Pushは参加人数分
  // 課金されるため、細切れに届くより間隔を空けてまとめた方が送信回数（コスト）を抑えられる。
  function pad2(n){ return (n<10?'0':'')+n; }

  // 基準時刻は「まとめ配信」のときだけ意味を持つ（1分ごと＝リアルタイムは起点を使わない）。
  // リアルタイム選択中に出したままだと、設定しても効かない欄を触らせることになるので隠す。
  function gmailAlertAnchorApplies(){ return Number(gmailAlertInterval.minutes) > 1; }

  function gmailAlertIntervalControlHtml(){
    var opt = GMAIL_ALERT_INTERVAL_OPTIONS.map(function(o){
      return '<option value="'+o[0]+'"'+(o[0]===gmailAlertInterval.minutes?' selected':'')+'>'+esc(o[1])+'</option>';
    }).join('');
    var ss = 'padding:6px 8px;border-radius:8px;border:1px solid var(--line,#d0d5dd);background:var(--surface2,#fff);color:var(--tx-1,#111);font-size:13px;';
    var anchorVal = pad2(gmailAlertInterval.anchorHour)+':'+pad2(gmailAlertInterval.anchorMinute);
    return '<div class="gmail-alert-interval-when" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px 14px;">'
      + '<span style="font-size:12px;color:#8a94a6;font-weight:700;width:100%">⏱ 配信間隔（1分ごとのリアルタイム、または間隔を空けてまとめて配信）</span>'
      + '<select class="gmail-alert-interval-sel" data-gmailalertinterval="minutes" style="'+ss+'width:100%;">'+opt+'</select>'
      + '<div class="gmail-alert-anchor-row" style="'+(gmailAlertAnchorApplies()?'':'display:none;')+'width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;">'
      +   '<span style="font-size:12px;color:#8a94a6;font-weight:700;width:100%">🕐 基準時刻（まとめ配信はこの時刻を起点に送信）</span>'
      +   '<input type="time" class="gmail-alert-anchor-inp" value="'+anchorVal+'" aria-label="Gmail予約通知の基準時刻" style="'+ss+'">'
      + '</div>'
      + '</div>';
  }

  // 本日の予約状況配信の時刻（サイトの type=time と同じ。同じ DB 列を読む／書く）。
  function todayReservationAlertControlHtml(){

  // 予定配信のリマインド設定UI（最大3件のスロット）。

    var ss = 'padding:6px 8px;border-radius:8px;border:1px solid var(--line,#d0d5dd);background:var(--surface2,#fff);color:var(--tx-1,#111);font-size:13px;';
    var btnStyle = 'padding:5px 10px;border-radius:8px;border:1px solid var(--line,#d0d5dd);background:var(--surface2,#fff);color:var(--tx-1,#111);font-size:12px;cursor:pointer;font-weight:700;';

    var html = '<div class="calendar-reminder-slots-container" style="padding:10px 16px 14px;display:flex;flex-direction:column;gap:10px;">'

      + '</div>';

            ? '<button type="button" class="reminder-slot-del-btn" data-slot-idx="'+idx+'" style="'+delBtnStyle+'" title="このリマインドを削除">削除</button>'

    if (calendarReminder.slots.length < 3) {
      html += '<div>'

  // 配信間隔を変えたときに基準時刻欄の表示だけを差し替える。
  // render() を呼ぶと開いているセクションが全部閉じてしまうため、ここでは DOM を直接触る。
  function syncGmailAlertAnchorVisibility(){
    var rows = document.querySelectorAll('.gmail-alert-anchor-row');
    for (var i=0;i<rows.length;i++) rows[i].style.display = gmailAlertAnchorApplies() ? 'flex' : 'none';
  }


  function render(){
    el('list').innerHTML = SECTIONS.map(function(sec){
      var total = sec.items.length, on = sec.items.filter(function(i){return i.on;}).length;
      var killOn = sec.items.some(function(i){ return i.kill && i.on; });
      var muted = (sec.id==='ai' && killOn) ? 'muted' : '';
      var rows = sec.items.map(function(it, idx){
        var r = '<div class="row'+(it.kill?' kill':'')+'" data-text="'+esc(it.t+' '+it.d)+'">'+
          '<div class="row-meta"><div class="row-t">'+esc(it.t)+'</div><div class="row-d">'+esc(it.d)+'</div></div>'+
          '<label class="sw'+(it.kill?' warn':'')+'"><input type="checkbox"'+(it.on?' checked':'')+' data-sec="'+sec.id+'" data-i="'+idx+'" />'+
          '<span class="track"></span><span class="knob"></span></label></div>';
        if (it.extra === 'domeWeekly') r += domeWeeklyControlHtml();
        if (it.extra === 'fcWeekly') r += fcWeeklyControlHtml();
        if (it.extra === 'reviewAlert') r += reviewAlertControlHtml();
        if (it.extra === 'gmailAlertInterval') r += gmailAlertIntervalControlHtml();
        if (it.extra === 'todayReservationAlert') r += todayReservationAlertControlHtml();
        if (it.extra === 'tomorrowReminder') r += tomorrowReminderControlHtml();
        return r;
      }).join('');
      return '<section class="sec" data-sec="'+sec.id+'">'+
        '<button class="sec-head" data-toggle="'+sec.id+'" aria-expanded="false">'+
        '<span class="sec-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+IC[sec.icon]+'</svg></span>'+
        '<span class="sec-meta"><span class="sec-t">'+esc(sec.title)+'</span><span class="sec-c">'+esc(sec.caption)+'</span></span>'+
        '<span class="sec-count'+(on>0?' on':'')+'" data-count="'+sec.id+'">'+on+'/'+total+'</span>'+
        '<svg class="sec-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'+
        '</button><div class="sec-body"><div class="sec-inner '+muted+'" data-inner="'+sec.id+'">'+rows+'</div></div></section>';
    }).join('');
    updateSummary();
  }

  function updateSummary(){
    var on=0,total=0;
    SECTIONS.forEach(function(s){ s.items.forEach(function(i){ total++; if(i.on)on++; }); });
    el('sumText').innerHTML = '有効 <b>'+on+'</b> / '+total+' 項目';
    SECTIONS.forEach(function(s){
      var c = document.querySelector('[data-count="'+s.id+'"]');
      var onN = s.items.filter(function(i){return i.on;}).length;
      if(c){ c.textContent = onN+'/'+s.items.length; c.classList.toggle('on', onN>0); }
      if(s.id==='ai'){
        var inner = document.querySelector('[data-inner="ai"]');
        if(inner) inner.classList.toggle('muted', s.items.some(function(i){ return i.kill && i.on; }));
      }
    });
  }

  /* ── トグル → その場で自動保存（楽観更新＋失敗時ロールバック）── */
  // 「時」と「分」のように複数列を1回の操作で決めるものは、1リクエストにまとめて送る。
  // 分けて送るとトーストが二重に出るうえ、片方だけ失敗したときに時刻が半端に保存される。
  function savePatch(patch){
    fetch(apiUrl(fromChat ? '/chat-room-config' : '/room-config'), { method:'PUT', headers:authHeaders(true), body:JSON.stringify(saveBody(patch)) })
      .then(function(r){ if (r.status===401||r.status===403){ relogin(); throw new Error('auth'); } if(!r.ok) throw new Error('save'); return r.json(); })
      .then(function(){ showToast('保存しました'); })
      .catch(function(e){
        if (String(e&&e.message)==='auth') return;
        showToast('保存に失敗しました', true);
      });
  }

  function saveField(key, value, inp, item){
    var patch = {}; patch[key] = value;
    fetch(apiUrl(fromChat ? '/chat-room-config' : '/room-config'), { method:'PUT', headers:authHeaders(true), body:JSON.stringify(saveBody(patch)) })
      .then(function(r){ if (r.status===401||r.status===403){ relogin(); throw new Error('auth'); } if(!r.ok) throw new Error('save'); return r.json(); })
      .then(function(){ showToast('保存しました'); })
      .catch(function(e){
        if (String(e&&e.message)==='auth') return;
        if (item){ item.on = !value; if(inp) inp.checked = !value; updateSummary(); }
        showToast('保存に失敗しました', true);
      });
  }

  el('list').addEventListener('click', function(e){
    var head = e.target.closest('[data-toggle]');
    if(head){
      var sec = head.closest('.sec');
      var open = sec.classList.toggle('open');
      head.setAttribute('aria-expanded', open?'true':'false');
      syncExpandAll();
    }
  });
  el('list').addEventListener('change', function(e){
    var domeSel = e.target.closest('select.dome-sel');
    if (domeSel){
      var kind = domeSel.dataset.dome; var val = parseInt(domeSel.value, 10);
      if (!isNaN(val)){ domeWeekly[kind] = val; saveField('dome_weekly_'+kind, val); }
      return;
    }
    var fcwSel = e.target.closest('select.fc-weekly-sel');
    if (fcwSel){
      var kind = fcwSel.dataset.fcw; var val = parseInt(fcwSel.value, 10);
      if (!isNaN(val)){ fcWeekly[kind] = val; saveField('foodcourt_weekly_'+kind, val); }
      return;
    }
    var raSel = e.target.closest('select.review-alert-sel');
    if (raSel){
      var kind = raSel.dataset.reviewalert; var val = parseInt(raSel.value, 10);
      if (!isNaN(val)){ reviewAlert[kind] = val; saveField('review_alert_'+kind, val); }
      return;
    }
    var gaiSel = e.target.closest('select.gmail-alert-interval-sel');
    if (gaiSel){
      var val = parseInt(gaiSel.value, 10);
      if (!isNaN(val)){
        gmailAlertInterval.minutes = val;
        saveField('gmail_alert_interval_minutes', val);
        // リアルタイム⇄まとめ配信の切替で基準時刻欄の要否が変わる。
        syncGmailAlertAnchorVisibility();
      }
      return;
    }
    var gaaInp = e.target.closest('input.gmail-alert-anchor-inp');
    if (gaaInp){
      // <input type=time> は "HH:MM"。空欄にされた場合は保存済みの値を維持し、表示だけ戻す。
      var mt = /^(\d{1,2}):(\d{2})$/.exec(String(gaaInp.value||''));
      if (!mt){
        gaaInp.value = pad2(gmailAlertInterval.anchorHour)+':'+pad2(gmailAlertInterval.anchorMinute);
        return;
      }
      var ah = Math.min(23, Math.max(0, parseInt(mt[1], 10)));
      var am = Math.min(59, Math.max(0, parseInt(mt[2], 10)));
      gmailAlertInterval.anchorHour = ah;
      gmailAlertInterval.anchorMinute = am;
      savePatch({ gmail_alert_anchor_hour: ah, gmail_alert_anchor_minute: am });
      return;
    }
    var traInp = e.target.closest('input.today-reservation-alert-inp');
    if (traInp){
      var trmt = /^(\d{1,2}):(\d{2})$/.exec(String(traInp.value||''));
      if (!trmt){
        traInp.value = pad2(todayReservationAlert.hour)+':'+pad2(todayReservationAlert.minute);
        return;
      }
      var th = Math.min(23, Math.max(0, parseInt(trmt[1], 10)));
      var tm = Math.min(59, Math.max(0, parseInt(trmt[2], 10)));
      todayReservationAlert.hour = th;
      todayReservationAlert.minute = tm;
      // 時・分は1リクエストにまとめ、サイトの Webhook 設定と同じ列へ保存する。
      savePatch({ today_reservation_alert_hour: th, today_reservation_alert_minute: tm });
      return;
    }
    // 予定配信リマインドスロットの変更・保存
    function saveCalendarReminderSlots(){
      var firstSlot = calendarReminder.slots[0] || { hour: 19, minute: 0 };
      savePatch({
        calendar_reminder_slots: calendarReminder.slots,
        calendar_tomorrow_reminder_hour: firstSlot.hour,
        calendar_tomorrow_reminder_minute: firstSlot.minute
      });
    }

    function rerenderCalendarReminderSlots(){
      var container = document.querySelector('.calendar-reminder-slots-container');
      if (!container) return;
      var parent = container.parentElement;
      if (!parent) return;
      parent.innerHTML = tomorrowReminderControlHtml();
    }

    var remEnableInp = e.target.closest('input.reminder-slot-enable');
    if (remEnableInp){
      var sidx = Number(remEnableInp.dataset.slotIdx);
      if (calendarReminder.slots[sidx]){
        calendarReminder.slots[sidx].enabled = remEnableInp.checked;
        saveCalendarReminderSlots();
      }
      return;
    }
    var remTargetSel = e.target.closest('select.reminder-slot-target');
    if (remTargetSel){
      var sidx = Number(remTargetSel.dataset.slotIdx);
      if (calendarReminder.slots[sidx]){
        calendarReminder.slots[sidx].target = remTargetSel.value === 'today' ? 'today' : 'tomorrow';
        saveCalendarReminderSlots();
      }
      return;
    }
    var remTimeInp = e.target.closest('input.reminder-slot-time');
    if (remTimeInp){
      var sidx = Number(remTimeInp.dataset.slotIdx);
      var mt = /^(\d{1,2}):(\d{2})$/.exec(String(remTimeInp.value||''));
      if (calendarReminder.slots[sidx]){
        if (!mt){
          remTimeInp.value = pad2(calendarReminder.slots[sidx].hour)+':'+pad2(calendarReminder.slots[sidx].minute);
          return;
        }
        var rh = Math.min(23, Math.max(0, parseInt(mt[1], 10)));
        var rm = Math.min(59, Math.max(0, parseInt(mt[2], 10)));
        calendarReminder.slots[sidx].hour = rh;
        calendarReminder.slots[sidx].minute = rm;
        saveCalendarReminderSlots();
      }
      return;
    }
    var inp = e.target.closest('input[type=checkbox]');
    if(!inp) return;
    var sec = SECTIONS.find(function(s){ return s.id===inp.dataset.sec; });
    var item = sec.items[+inp.dataset.i];
    item.on = inp.checked;
    updateSummary();
    saveField(item.key, inp.checked, inp, item);
  });

  document.addEventListener('click', function(e){
    var addBtn = e.target.closest('.reminder-slot-add-btn');
    if (addBtn){
      if (calendarReminder.slots.length < 3){
        var nextId = 'slot_' + (calendarReminder.slots.length + 1);
        var defaultTarget = calendarReminder.slots.length === 1 ? 'today' : 'tomorrow';
        var defaultHour = calendarReminder.slots.length === 1 ? 8 : 12;
        var defaultMinute = calendarReminder.slots.length === 1 ? 30 : 0;
        calendarReminder.slots.push({
          id: nextId,
          target: defaultTarget,
          hour: defaultHour,
          minute: defaultMinute,
          enabled: true
        });
        saveCalendarReminderSlots();
        rerenderCalendarReminderSlots();
      }
      return;
    }
    var delBtn = e.target.closest('.reminder-slot-del-btn');
    if (delBtn){
      var sidx = Number(delBtn.dataset.slotIdx);
      if (calendarReminder.slots.length > 1 && !isNaN(sidx) && calendarReminder.slots[sidx]){
        calendarReminder.slots.splice(sidx, 1);
        // ID を slot_1.. 再番号付け
        calendarReminder.slots.forEach(function(s, idx){ s.id = 'slot_' + (idx + 1); });
        saveCalendarReminderSlots();
        rerenderCalendarReminderSlots();
      }
      return;
    }

  var expandBtn = el('expandAll');
  function syncExpandAll(){
    var secs = [].slice.call(document.querySelectorAll('.sec'));
    var allOpen = secs.length>0 && secs.every(function(s){ return s.classList.contains('open'); });
    expandBtn.textContent = allOpen ? 'すべて折りたたむ' : 'すべて展開';
  }
  expandBtn.addEventListener('click', function(){
    var secs = [].slice.call(document.querySelectorAll('.sec'));
    var allOpen = secs.every(function(s){ return s.classList.contains('open'); });
    secs.forEach(function(s){ s.classList.toggle('open', !allOpen); s.querySelector('.sec-head').setAttribute('aria-expanded', (!allOpen)+''); });
    syncExpandAll();
  });

  var search = el('search'), searchWrap = el('searchWrap'), noResult = el('noResult');
  el('clearSearch').addEventListener('click', function(){ search.value=''; onSearch(); search.focus(); });
  function onSearch(){
    var q = search.value.trim().toLowerCase();
    searchWrap.classList.toggle('has', !!q);
    var anyVisible=false;
    document.querySelectorAll('.sec').forEach(function(sec){
      var secMatch=0;
      sec.querySelectorAll('.row').forEach(function(r){
        var hit = !q || r.dataset.text.toLowerCase().indexOf(q)>=0;
        r.style.display = hit?'':'none'; if(hit) secMatch++;
      });
      sec.style.display = secMatch? '' : 'none';
      if(secMatch){ anyVisible=true; if(q){ sec.classList.add('open'); sec.querySelector('.sec-head').setAttribute('aria-expanded','true'); } }
    });
    noResult.classList.toggle('show', !anyVisible);
    if(!q) syncExpandAll();
  }
  search.addEventListener('input', onSearch);

  el('roomChip').addEventListener('click', function(){
    var txt = (el('roomChipId').textContent || roomId || '').trim();
    if(!txt) return;
    if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){ showToast('コピーしました'); }).catch(function(){ showToast('コピーしました'); });
    else showToast('コピーしました');
  });

  function openFirst(){
    var first = document.querySelector('.sec');
    if(first){ first.classList.add('open'); first.querySelector('.sec-head').setAttribute('aria-expanded','true'); syncExpandAll(); }
  }

  function startChatSession(){
    el('loginBtn').textContent = 'M-talk から開き直す';
    var pwCard = el('pw') && el('pw').closest('.card');
    if (pwCard) pwCard.hidden = true;
    el('loginRoom').textContent = 'このトークルームの Bot 機能を設定します';
    if (!chatSb) { relogin(); return; }
    chatSb.auth.getSession().then(function(res){
      var token = res && res.data && res.data.session && res.data.session.access_token;
      if (!token) {
        el('loginScreen').hidden = false;
        el('appScreen').hidden = true;
        el('loginMsg').textContent = 'M-talk にログインした状態で、トークから「設定」を開いてください。';
        el('loginMsg').className = 'lmsg err';
        el('loginBtn').disabled = true;
        return;
      }
      chatAccessToken = token;
      loadConfig();
    }).catch(function(){ relogin(); });
  }

  // 既存セッションがあればパスワード入力を飛ばす（同タブ内の再表示）。
  if (fromChat) {
    showBackToMtalk();
    startChatSession();
  }
  else if (sessionToken){ loadConfig(); }
})();
</script>
</body>
</html>
