<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会社規約管理システム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      padding: 40px 20px;
      color: #e0e0e0;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      background: linear-gradient(145deg, #1a1a1a, #121212);
      padding: 40px;
      border-radius: 4px;
      border: 1px solid #2a2a2a;
      margin-bottom: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .header h1 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .header p {
      color: #808080;
      font-size: 14px;
      font-weight: 400;
    }

    .upload-section {
      background: linear-gradient(145deg, #1a1a1a, #121212);
      padding: 32px;
      border-radius: 4px;
      border: 1px solid #2a2a2a;
      margin-bottom: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .upload-area {
      border: 2px dashed #404040;
      border-radius: 4px;
      padding: 60px 40px;
      text-align: center;
      background: #0f0f0f;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .upload-area:hover {
      background: #151515;
      border-color: #606060;
    }

    .upload-area.dragover {
      background: #1a1a1a;
      border-color: #808080;
    }

    .upload-icon {
      font-size: 36px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: #ffffff;
      color: #000000;
      padding: 12px 32px;
      border: none;
      border-radius: 2px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    .btn:hover {
      background: #e0e0e0;
      transform: translateY(-1px);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .documents-section {
      background: linear-gradient(145deg, #1a1a1a, #121212);
      padding: 32px;
      border-radius: 4px;
      border: 1px solid #2a2a2a;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .document-list {
      list-style: none;
    }

    .document-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid #222;
      transition: all 0.2s ease;
    }

    .document-item:last-child {
      border-bottom: none;
    }

    .document-item:hover {
      padding-left: 8px;
    }

    .document-info {
      flex: 1;
    }

    .document-name {
      font-weight: 500;
      color: #ffffff;
      margin-bottom: 6px;
      font-size: 15px;
      word-break: break-all;
    }

    .document-meta {
      font-size: 12px;
      color: #606060;
      font-weight: 400;
    }

    .document-actions {
      display: flex;
      gap: 8px;
    }

    .btn-small {
      padding: 8px 20px;
      font-size: 13px;
      border-radius: 2px;
      border: 1px solid #404040;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .btn-view {
      background: #ffffff;
      color: #000000;
      border: none;
    }

    .btn-view:hover {
      background: #e0e0e0;
    }

    .btn-delete {
      background: transparent;
      color: #808080;
    }

    .btn-delete:hover {
      background: #ff4444;
      color: #ffffff;
      border-color: #ff4444;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #606060;
      font-size: 14px;
    }

    .progress-bar {
      height: 6px;
      width: 100%;
      background: #1f1f1f;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 16px;
      display: none;
    }

    .progress-fill {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #ffffff, #808080);
      transition: width 0.3s ease;
    }

    #message {
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 4px;
      font-size: 14px;
      display: none;
    }

    #message.success {
      display: block;
      background: rgba(124, 252, 0, 0.1);
      color: #9aff6b;
      border: 1px solid rgba(124, 252, 0, 0.2);
    }

    #message.error {
      display: block;
      background: rgba(255, 68, 68, 0.1);
      color: #ff7777;
      border: 1px solid rgba(255, 68, 68, 0.2);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>会社規約管理</h1>
      <p>規約ドキュメントの一元管理</p>
    </div>

    <div id="message"></div>

    <div class="upload-section">
      <h2>ファイルアップロード</h2>
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">↑</div>
        <p>PDFまたはTXTファイルをドラッグ＆ドロップ</p>
        <button class="btn" onclick="document.getElementById('fileInput').click()">
          ファイルを選択
        </button>
        <input type="file" id="fileInput" accept=".pdf,.txt" multiple>
      </div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="documents-section">
      <h2>ドキュメント一覧</h2>
      <ul class="document-list" id="documentList">
        <li class="loading">読み込み中...</li>
      </ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    function encodeFileName(name) {
      return encodeURIComponent(name.replace(/[\\s\\/:*?\"<>|]+/g, '_'));
    }

    function decodeFileName(encoded) {
      try {
        return decodeURIComponent(encoded);
      } catch (error) {
        console.error('ファイル名のデコードに失敗:', encoded, error);
        return encoded;
      }
    }

    function extractOriginalName(storagePath) {
      const rawName = storagePath.includes('/') ? storagePath.split('/').pop() : storagePath;
      const match = rawName.match(/^(\d+)_([^.]*)\.(.+)$/);
      if (match) {
        const encodedOriginal = match[2];
        const extension = match[3];
        return `${decodeFileName(encodedOriginal)}.${extension}`;
    }
      return decodeFileName(rawName);
    }

    let supabase;

    async function initSupabase() {
      try {
        const response = await fetch('/api/config');
        const config = await response.json();
        supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);
        loadDocuments();
      } catch (error) {
        console.error('Init error:', error);
        showMessage('設定の読み込みに失敗しました: ' + error.message, 'error');
      }
    }

    function showMessage(text, type = 'success') {
      const messageDiv = document.getElementById('message');
      messageDiv.className = type;
      messageDiv.textContent = text;
      messageDiv.style.display = 'block';
      setTimeout(() => {
        messageDiv.textContent = '';
        messageDiv.className = '';
        messageDiv.style.display = 'none';
      }, 5000);
    }

    async function uploadFile(file) {
      if (!file.type.includes('pdf') && !file.type.includes('text')) {
        showMessage('PDFまたはTXTファイルのみアップロード可能です', 'error');
        return;
      }

      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      progressBar.style.display = 'block';
      progressFill.style.width = '0%';

      try {
        const timestamp = Date.now();
        const extension = file.name.split('.').pop();
        const encodedName = encodeFileName(file.name.replace(`.${extension}`, ''));
        const safeFileName = `${timestamp}_${encodedName}.${extension}`;
        const storagePath = `uploads/${safeFileName}`;

        const { error } = await supabase.storage
          .from('company-documents')
          .upload(storagePath, file, {
            cacheControl: '3600',
            upsert: false,
            contentType: file.type || 'application/octet-stream'
          });

        if (error) throw error;

        progressFill.style.width = '100%';
        showMessage(`${file.name} をアップロードしました`, 'success');
        
        setTimeout(() => {
          progressBar.style.display = 'none';
          progressFill.style.width = '0%';
        }, 1000);

        loadDocuments();
      } catch (error) {
        console.error('Upload error:', error);
        showMessage('アップロードに失敗しました: ' + error.message, 'error');
        progressBar.style.display = 'none';
      }
    }

    async function listAllFiles(prefix = '') {
      const collected = [];
      let page = 0;

      while (true) {
        const { data, error } = await supabase.storage
          .from('company-documents')
          .list(prefix, {
            limit: 100,
            offset: page * 100,
            sortBy: { column: 'created_at', order: 'desc' }
          });

        if (error) throw error;
        if (!data || data.length === 0) break;

        for (const item of data) {
          const isFolder = !item.metadata && !item.name.includes('.');
          const fullPath = prefix ? `${prefix}/${item.name}` : item.name;

          if (isFolder) {
            const nested = await listAllFiles(fullPath);
            collected.push(...nested);
          } else {
            collected.push({ ...item, fullPath });
          }
        }

        if (data.length < 100) break;
        page += 1;
      }

      return collected;
    }

    async function loadDocuments() {
      const listElement = document.getElementById('documentList');
      
      try {
        const files = await listAllFiles('uploads');

        if (!files || files.length === 0) {
          listElement.innerHTML = '<li class="loading">アップロード済みのファイルはありません</li>';
          return;
        }

        const filesWithMetadata = files
          .filter(file => file.fullPath.split('.').pop().toLowerCase())
          .map((file) => {
            try {
              const originalName = extractOriginalName(file.fullPath);
              const sizeBytes = file.metadata?.size ?? file.size ?? 0;
              const uploadedAt = new Date(file.created_at);

              return {
                storageName: file.fullPath,
                displayName: originalName,
                uploadedAt,
                sizeKb: (sizeBytes / 1024).toFixed(2),
              };
            } catch (err) {
              console.error('File processing error:', err, file);
              return null;
            }
          })
          .filter(f => f !== null);

        if (filesWithMetadata.length === 0) {
          listElement.innerHTML = '<li class="loading">アップロード済みのファイルはありません</li>';
          return;
        }

        listElement.innerHTML = filesWithMetadata.map(fileInfo => `
          <li class="document-item">
            <div class="document-info">
              <div class="document-name">${fileInfo.displayName}</div>
              <div class="document-meta">
                サイズ: ${fileInfo.sizeKb} KB | アップロード: ${fileInfo.uploadedAt.toLocaleString('ja-JP')}
              </div>
            </div>
            <div class="document-actions">
              <button class="btn-small btn-view" onclick="viewDocument('${fileInfo.storageName}')">表示</button>
              <button class="btn-small btn-delete" onclick="deleteDocument('${fileInfo.storageName}')">削除</button>
            </div>
          </li>
        `).join('');
      } catch (error) {
        console.error('Load error:', error);
        listElement.innerHTML = '<li class="loading">エラーが発生しました</li>';
      }
    }

    async function viewDocument(fileName) {
      try {
        const { data } = await supabase.storage
          .from('company-documents')
          .getPublicUrl(fileName);

        window.open(data.publicUrl, '_blank');
      } catch (error) {
        showMessage('ファイルを開けませんでした', 'error');
      }
    }

    async function deleteDocument(fileName) {
      if (!confirm('このファイルを削除しますか？')) return;

      try {
        const { error } = await supabase.storage
          .from('company-documents')
          .remove([fileName]);

        if (error) throw error;

        showMessage('ファイルを削除しました', 'success');
        loadDocuments();
      } catch (error) {
        showMessage('削除に失敗しました', 'error');
      }
    }

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');

      const files = e.dataTransfer.files;
      if (!files || files.length === 0) return;

      for (const file of files) {
        uploadFile(file);
      }
    });

    fileInput.addEventListener('change', (e) => {
      const files = e.target.files;
      if (!files || files.length === 0) return;

      for (const file of files) {
        uploadFile(file);
      }

      fileInput.value = '';
    });

    document.addEventListener('DOMContentLoaded', initSupabase);
  </script>
</body>
</html>
