<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会社規約管理システム</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }

    .header h1 {
      color: #333;
      margin-bottom: 10px;
    }

    .header p {
      color: #666;
    }

    .upload-section {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      margin-bottom: 30px;
    }

    .upload-area {
      border: 3px dashed #667eea;
      border-radius: 10px;
      padding: 50px;
      text-align: center;
      background: #f8f9ff;
      transition: all 0.3s;
      cursor: pointer;
    }

    .upload-area:hover {
      background: #eef1ff;
      border-color: #764ba2;
    }

    .upload-area.dragover {
      background: #e0e7ff;
      border-color: #667eea;
    }

    .upload-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px 30px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .documents-section {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .document-list {
      list-style: none;
    }

    .document-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #eee;
      transition: background 0.2s;
    }

    .document-item:hover {
      background: #f8f9ff;
    }

    .document-info {
      flex: 1;
    }

    .document-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .document-meta {
      font-size: 14px;
      color: #666;
    }

    .document-actions {
      display: flex;
      gap: 10px;
    }

    .btn-small {
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-view {
      background: #667eea;
      color: white;
    }

    .btn-delete {
      background: #ef4444;
      color: white;
    }

    .btn-small:hover {
      transform: translateY(-1px);
      opacity: 0.9;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #dc2626;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #16a34a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 15px;
      display: none;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s;
      width: 0%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 会社規約管理システム</h1>
      <p>PDFファイルをアップロードして会社規約を管理できます</p>
    </div>

    <div id="message"></div>

    <div class="upload-section">
      <h2 style="margin-bottom: 20px;">📤 PDFファイルをアップロード</h2>
      <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📄</div>
        <h3>ここにPDFまたはTXTファイルをドラッグ＆ドロップ</h3>
        <p style="margin: 15px 0; color: #666;">または</p>
        <button class="btn" onclick="document.getElementById('fileInput').click()">
          ファイルを選択
        </button>
        <input type="file" id="fileInput" accept=".pdf,.txt" multiple>
      </div>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="documents-section">
      <h2 style="margin-bottom: 20px;">📚 アップロード済みの規約</h2>
      <ul class="document-list" id="documentList">
        <li class="loading">読み込み中...</li>
      </ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    
    // Supabase設定（環境変数から取得するため、サーバー経由で取得）
    let supabase;

    // 設定を取得
    async function initSupabase() {
      try {
        const response = await fetch('/api/config');
        const config = await response.json();
        supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);
        loadDocuments();
      } catch (error) {
        console.error('Init error:', error);
        showMessage('設定の読み込みに失敗しました: ' + error.message, 'error');
      }
    }

    // メッセージ表示
    function showMessage(text, type = 'success') {
      const messageDiv = document.getElementById('message');
      messageDiv.className = type;
      messageDiv.textContent = text;
      setTimeout(() => {
        messageDiv.textContent = '';
        messageDiv.className = '';
      }, 5000);
    }

    // ファイルアップロード
    async function uploadFile(file) {
      if (!file.type.includes('pdf') && !file.type.includes('text')) {
        showMessage('PDFまたはTXTファイルのみアップロード可能です', 'error');
        return;
      }

      const progressBar = document.getElementById('progressBar');
      const progressFill = document.getElementById('progressFill');
      progressBar.style.display = 'block';
      progressFill.style.width = '0%';

      try {
        const fileName = `${Date.now()}_${file.name}`;
        
        // Supabase Storageにアップロード
        const { data, error } = await supabase.storage
          .from('company-documents')
          .upload(fileName, file);

        if (error) throw error;

        progressFill.style.width = '100%';
        showMessage(`${file.name} をアップロードしました`, 'success');
        
        setTimeout(() => {
          progressBar.style.display = 'none';
          progressFill.style.width = '0%';
        }, 1000);

        loadDocuments();
      } catch (error) {
        console.error('Upload error:', error);
        showMessage('アップロードに失敗しました: ' + error.message, 'error');
        progressBar.style.display = 'none';
      }
    }

    // ドキュメント一覧を読み込み
    async function loadDocuments() {
      const listElement = document.getElementById('documentList');
      
      try {
        const { data, error } = await supabase.storage
          .from('company-documents')
          .list();

        if (error) throw error;

        if (!data || data.length === 0) {
          listElement.innerHTML = '<li class="loading">アップロード済みのファイルはありません</li>';
          return;
        }

        listElement.innerHTML = data
          .filter(file => file.name.endsWith('.pdf') || file.name.endsWith('.txt'))
          .map(file => `
            <li class="document-item">
              <div class="document-info">
                <div class="document-name">${file.name.split('_').slice(1).join('_') || file.name}</div>
                <div class="document-meta">
                  サイズ: ${(file.metadata?.size / 1024).toFixed(2)} KB | 
                  アップロード: ${new Date(file.created_at).toLocaleString('ja-JP')}
                </div>
              </div>
              <div class="document-actions">
                <button class="btn-small btn-view" onclick="viewDocument('${file.name}')">表示</button>
                <button class="btn-small btn-delete" onclick="deleteDocument('${file.name}')">削除</button>
              </div>
            </li>
          `).join('');
      } catch (error) {
        console.error('Load error:', error);
        listElement.innerHTML = '<li class="loading">エラーが発生しました</li>';
      }
    }

    // ドキュメント表示
    async function viewDocument(fileName) {
      try {
        const { data } = await supabase.storage
          .from('company-documents')
          .getPublicUrl(fileName);

        window.open(data.publicUrl, '_blank');
      } catch (error) {
        showMessage('ファイルを開けませんでした', 'error');
      }
    }

    // ドキュメント削除
    async function deleteDocument(fileName) {
      if (!confirm('このファイルを削除しますか？')) return;

      try {
        const { error } = await supabase.storage
          .from('company-documents')
          .remove([fileName]);

        if (error) throw error;

        showMessage('ファイルを削除しました', 'success');
        loadDocuments();
      } catch (error) {
        showMessage('削除に失敗しました', 'error');
      }
    }

    // ドラッグ&ドロップ
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');

    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.classList.add('dragover');
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.classList.remove('dragover');
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.classList.remove('dragover');
      
      const files = Array.from(e.dataTransfer.files);
      files.forEach(uploadFile);
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      files.forEach(uploadFile);
      e.target.value = '';
    });

    // 初期化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSupabase);
    } else {
      initSupabase();
    }
  </script>
</body>
</html>
