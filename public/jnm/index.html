<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
<title>Journal Report</title>
<!--
  このファイルは GitHub Pages のディレクトリ既定ページ（/jnm/）専用の転送スタブです。
  アプリ本体は jnl2txt.html の1本だけ。以前は同じ825KBの中身を index.html にも複製し、
  テストで byte 一致を強制していましたが、片方だけ更新する事故が起きたため転送に変更しました。
  ここにアプリのコードを書き戻さないでください。
-->
<link rel="canonical" href="jnl2txt.html">
<meta http-equiv="refresh" content="0; url=jnl2txt.html">
<style>
  body { font-family: system-ui, -apple-system, "Hiragino Sans", sans-serif; margin: 3rem auto; max-width: 32rem; padding: 0 1.5rem; line-height: 1.8; }
  a { color: #2563eb; }
</style>
</head>
<body>
<script>
  // クエリ・ハッシュを保ったまま本体へ転送する（meta refresh より先に効く）。
  location.replace('jnl2txt.html' + location.search + location.hash);
</script>
<p>Journal Report へ移動しています…</p>
<p><a href="jnl2txt.html">自動で移動しない場合はこちら</a></p>
</body>
</html>
