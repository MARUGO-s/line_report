<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://hocbnifuactbvmyjraxy.supabase.co; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <title>予約・予定</title>
  <link rel="icon" type="image/svg+xml" href="icons/chat-logo-v3.svg">
  <style>
    :root, html, body {
      --bg: #111;
      --surface: #1c1c1e;
      --card: #2c2c2e;
      --line: #2c2c2e;
      --text: #f2f2f2;
      --muted: #8e8e93;
      --meta: #aeaeb2;
      --link: #5ac8fa;
      --accent: #06c755;
      --sun: #ff8f8a;
      --sat: #7ecbff;
      --out: #3a3a3c;
      --warn: #ff9f0a;
      --resv-text: #ff9f0a;
      --allergy-text: #ff453a;
      --birthday-text: #ff453a;
      --overlay: rgba(0,0,0,.55);
    }
    html[data-theme='light'], body[data-theme='light'] {
      --bg: #e8eaed;
      --surface: #f7f7f8;
      --card: #ffffff;
      --line: #d8d8dc;
      --text: #111;
      --muted: #6e6e73;
      --meta: #636366;
      --link: #007aff;
      --accent: #06c755;
      --sun: #d70015;
      --sat: #007aff;
      --out: #c7c7cc;
      --warn: #c93400;
      --resv-text: #c2410c;
      --allergy-text: #c0392b;
      --birthday-text: #c0392b;
      --overlay: rgba(20,20,20,.4);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Segoe UI", sans-serif;
    }
    body {
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .wrap { max-width: 520px; margin: 0 auto; min-height: 100vh; background: var(--surface); }
    header {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: var(--surface); z-index: 5;
    }
    .back {
      color: var(--link); text-decoration: none; font-size: 15px; font-weight: 700;
      padding: 8px 4px; white-space: nowrap;
    }
    header h1 { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; }
    header .sub { color: var(--muted); font-size: 12px; font-weight: 600; }
    .theme-btn {
      border: 0; background: var(--card); color: var(--text);
      height: 32px; padding: 0 10px; border-radius: 10px;
      font-size: 12px; font-weight: 700; font-family: inherit; cursor: pointer; flex-shrink: 0;
    }
    .month-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; gap: 8px;
    }
    .month-nav button {
      border: 0; background: var(--card); color: var(--text);
      width: 40px; height: 36px; border-radius: 10px; font-size: 18px; cursor: pointer;
    }
    .month-nav strong { font-size: 16px; }
    .tabs { display: flex; gap: 8px; padding: 0 12px 12px; }
    .tab {
      flex: 1; height: 40px; border: 0; border-radius: 12px;
      background: var(--card); color: var(--text); font-size: 15px; font-weight: 700;
      font-family: inherit; cursor: pointer;
    }
    .tab.active { background: var(--accent); color: #fff; }
    .cal { padding: 0 10px 8px; }
    .cal-weekdays, .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }
    .cal-weekdays span {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 700;
      padding: 4px 0 6px;
    }
    .cal-weekdays span:first-child { color: var(--sun); }
    .cal-weekdays span:last-child { color: var(--sat); }
    .cal-cell {
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      background: transparent;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5px 0 4px;
      font-family: inherit;
      cursor: pointer;
    }
    .cal-cell.out { color: var(--out); cursor: default; }
    .cal-cell.sun:not(.out):not(.selected) { color: var(--sun); }
    .cal-cell.sat:not(.out):not(.selected) { color: var(--sat); }
    .cal-cell.today { background: var(--card); }
    .cal-cell.selected { background: var(--accent); color: #fff; }
    .cal-num { font-size: 13px; font-weight: 700; line-height: 1.1; }
    .cal-marks { display: flex; gap: 3px; min-height: 7px; margin-top: 3px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; }
    .dot.resv { background: var(--accent); }
    .dot.evt { background: var(--sat); }
    .cal-cell.selected .dot { background: #fff; }
    .cal-legend {
      display: flex; gap: 12px; justify-content: flex-end;
      padding: 4px 4px 2px; font-size: 11px; color: var(--muted);
    }
    .cal-legend i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    .cal-legend .resv { background: var(--accent); }
    .cal-legend .evt { background: var(--sat); }
    .timeline { padding-bottom: 24px; }
    .note, .empty, .error, .login {
      margin: 8px 12px 16px; color: var(--muted); font-size: 13px; line-height: 1.6;
    }
    .error { color: var(--warn); }
    .hidden { display: none !important; }
    .day { padding: 4px 12px 14px; scroll-margin-top: 64px; }
    .day h2 {
      font-size: 13px; color: var(--muted); font-weight: 700;
      padding: 10px 2px 8px; border-top: 1px solid var(--line);
    }
    .day.selected-day h2 { color: var(--accent); }
    .card {
      display: block; width: 100%; text-align: left;
      background: var(--card); border: 0; border-radius: 12px;
      padding: 12px; margin-bottom: 8px; color: inherit;
      font-family: inherit; cursor: pointer;
    }
    .card .time { font-weight: 800; font-size: 15px; color: var(--text); }
    .card .name { font-size: 15px; font-weight: 700; margin-top: 2px; color: var(--text); }
    .card .meta { font-size: 12px; color: var(--text); margin-top: 4px; opacity: 0.86; }
    .card .plan { font-size: 13px; font-weight: 700; color: var(--text); margin-top: 4px; }
    .card .flag { font-size: 12.5px; font-weight: 800; margin-top: 6px; line-height: 1.45; color: var(--allergy-text); }
    .card .flag.allergy, .card .flag.birthday { color: var(--allergy-text); }
    .detail {
      position: fixed; inset: 0; background: var(--overlay); z-index: 20;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .detail.hidden { display: none; }
    .sheet {
      width: 100%; max-width: 520px; background: var(--surface);
      border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
      max-height: 92vh; overflow-y: auto;
    }
    .sheet h3 { font-size: 17px; margin-bottom: 10px; color: var(--text); }
    .row { display: flex; gap: 10px; padding: 6px 0; font-size: 14px; }
    .row span { color: var(--muted); width: 88px; flex-shrink: 0; }
    .row div { color: var(--text); }
    .row.note span, .row.note div,
    .row.allergy span, .row.allergy div,
    .row.birthday span, .row.birthday div { color: var(--allergy-text); }
    .row.note div, .row.allergy div, .row.birthday div { font-weight: 800; }
    .close {
      margin-top: 12px; width: 100%; height: 42px; border: 0; border-radius: 12px;
      background: var(--card); color: var(--text); font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .actions { padding: 0 12px 12px; }
    .add-btn {
      width: 100%; height: 42px; border: 0; border-radius: 12px;
      background: var(--accent); color: #fff; font-weight: 800;
      font-family: inherit; cursor: pointer; font-size: 15px;
    }
    .add-btn:disabled { opacity: 0.45; cursor: default; }
    .add-btn.hidden { display: none; }
    .sheet .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
    .sheet label { font-size: 12px; color: var(--muted); font-weight: 700; }
    .sheet input, .sheet textarea {
      width: 100%; border: 1px solid var(--line); background: var(--card);
      color: var(--text); border-radius: 10px; padding: 10px 12px;
      font-size: 16px; font-family: inherit;
    }
    .sheet textarea { min-height: 72px; resize: vertical; }
    .sheet .actions-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .btn {
      flex: 1; min-width: 90px; height: 42px; border: 0; border-radius: 12px;
      font-weight: 700; font-family: inherit; cursor: pointer; font-size: 15px;
    }
    .btn.primary { background: var(--accent); color: #fff; }
    .btn.danger { background: #b3382e; color: #fff; }
    .btn.ghost { background: var(--card); color: var(--text); }
    .btn:disabled { opacity: 0.55; }
    .form-error { color: var(--warn); font-size: 13px; min-height: 16px; margin: 4px 0 0; }
  </style>
  <script src="app-theme.js"></script>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="back" id="backLink" href="./chat.html">‹ 戻る</a>
      <div style="min-width:0;flex:1;">
        <h1>予約・予定</h1>
        <div class="sub" id="roomSub"></div>
      </div>
      <button type="button" class="theme-btn" id="themeToggleBtn">ライトモード</button>
    </header>
    <div class="month-nav">
      <button type="button" id="prevMonth" aria-label="前月">‹</button>
      <strong id="monthLabel">—</strong>
      <button type="button" id="nextMonth" aria-label="翌月">›</button>
    </div>
    <div class="tabs">
      <button class="tab active" type="button" data-tab="reservations">予約</button>
      <button class="tab" type="button" data-tab="events">予定</button>
    </div>
    <div class="actions">
      <button type="button" class="add-btn hidden" id="addBtn">＋ 予約を追加</button>
    </div>
    <p class="login hidden" id="loginNote">M-talk にログインしてから開いてください。</p>
    <p class="error hidden" id="errorNote"></p>
    <p class="note hidden" id="reservationNote"></p>
    <div class="cal">
      <div class="cal-weekdays">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend">
        <span id="legendResv"><i class="resv"></i>予約</span>
        <span id="legendEvt"><i class="evt"></i>予定</span>
      </div>
    </div>
    <div class="timeline" id="list"></div>
  </div>
  <div class="detail hidden" id="detail" onclick="if(event.target===this) closeDetail()">
    <div class="sheet" id="detailSheet"></div>
  </div>
  <script src="vendor/supabase/supabase-2.110.9.min.js"></script>
  <script src="pages-config.js"></script>
  <script>
    const CONFIG = window.LINE_REPORT_PAGES || {};
    const SUPABASE_URL = CONFIG.PROJECT_URL || 'https://hocbnifuactbvmyjraxy.supabase.co';
    const SUPABASE_ANON_KEY = CONFIG.RECEIPT_ADMIN_ANON_KEY || '';
    const STORE_NAMES = CONFIG.STORE_NAMES || {};
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true }
    });
    const params = new URLSearchParams(location.search);
    const groupId = Number(params.get('group_id') || params.get('group') || '');
    const $ = (id) => document.getElementById(id);
    let tab = params.get('tab') === 'events' ? 'events' : 'reservations';
    let month = currentMonth();
    let payload = null;
    let selectedDay = '';
    let editing = null;

    $('backLink').href = './chat.html' + (Number.isSafeInteger(groupId) && groupId > 0 ? ('?group=' + encodeURIComponent(String(groupId))) : '');

    function currentMonth() {
      const parts = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit' }).formatToParts(new Date());
      return (parts.find((p) => p.type === 'year')?.value || '2026') + '-' + (parts.find((p) => p.type === 'month')?.value || '01');
    }
    function shiftMonth(value, delta) {
      const [y, m] = String(value).split('-').map(Number);
      const date = new Date(Date.UTC(y, m - 1 + delta, 1));
      return date.getUTCFullYear() + '-' + String(date.getUTCMonth() + 1).padStart(2, '0');
    }
    function weekdayJa(iso) {
      if (!iso) return '';
      return new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', weekday: 'short' }).format(new Date(iso)).replace('曜日', '');
    }
    function dayKey(iso) {
      if (!iso) return '';
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(iso));
    }
    function dayLabel(iso) {
      const key = dayKey(iso);
      if (!key) return '日時未設定';
      const [y, m, d] = key.split('-');
      const wd = weekdayJa(iso);
      return Number(m) + '月' + Number(d) + '日' + (wd ? '（' + wd + '）' : '');
    }
    function timeLabel(iso) {
      if (!iso) return '';
      return new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso));
    }
    function escapeHtml(text) {
      return String(text ?? '').replace(/[&<>"']/g, (ch) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[ch]));
    }
    function sourceLabel(source) {
      if (source === 'tabelog') return '食べログ';
      if (source === 'ikyu') return '一休';
      if (source === 'manual') return '手入力';
      return source || '';
    }
    const BIRTHDAY_RE = /お誕生日|誕生日|バースデー|birthday|生誕/i;
    const CELEBRATION_RE = /お祝い|記念日|anniversary|結婚記念/i;
    function notableAllergy(label) {
      const text = String(label || '').trim();
      if (!text) return '';
      if (/^(なし|無|無し|ありません|特になし|該当なし|なしです|不要|記載なし)$/i.test(text)) return '';
      return text;
    }
    function isBirthdayText(value) {
      const text = String(value || '');
      return BIRTHDAY_RE.test(text) || CELEBRATION_RE.test(text);
    }
    function notableBirthday(row) {
      const anniversary = String(row?.anniversary_label || '').trim();
      if (anniversary) return anniversary;
      const candidates = [row?.request_note_label, row?.plan_label, row?.dislikes_label];
      for (const candidate of candidates) {
        const text = String(candidate || '').trim();
        if (text && isBirthdayText(text)) return text;
      }
      return '';
    }
    function birthdayFlagText(text) {
      const value = String(text || '').trim();
      if (!value) return '';
      if (isBirthdayText(value)) return value;
      return 'お誕生日: ' + value;
    }
    function isoToLocalInput(iso) {
      const date = new Date(iso);
      if (!iso || Number.isNaN(date.getTime())) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }
    function localInputToIso(value) {
      const raw = String(value || '').trim();
      if (!raw) return '';
      const date = new Date(raw);
      return Number.isNaN(date.getTime()) ? '' : date.toISOString();
    }
    function isoToMonth(iso) {
      const key = dayKey(iso);
      return key ? key.slice(0, 7) : '';
    }
    function defaultDateTimeValue(hour) {
      const key = selectedDay || dayKey(new Date().toISOString());
      return (key || currentMonth() + '-01') + 'T' + String(hour || '18').padStart(2, '0') + ':00';
    }
    async function authHeaders() {
      const { data: sessionData } = await sb.auth.getSession();
      const token = sessionData?.session?.access_token;
      if (!token) throw new Error('ログインしてください。');
      return { Authorization: 'Bearer ' + token, apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
    }
    function scheduleApiUrl(path) {
      return CONFIG.adminApiUrl
        ? CONFIG.adminApiUrl(path)
        : (SUPABASE_URL.replace(/\/+$/, '') + '/functions/v1/admin-api' + path);
    }
    async function apiSend(path, method, body) {
      const response = await fetch(scheduleApiUrl(path), {
        method,
        headers: await authHeaders(),
        body: body ? JSON.stringify(body) : undefined,
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || ('HTTP ' + response.status));
      return result;
    }
    function updateAddButton() {
      const btn = $('addBtn');
      if (!btn) return;
      const loggedIn = $('loginNote').classList.contains('hidden');
      const ready = loggedIn && !!payload;
      btn.classList.toggle('hidden', !ready);
      btn.textContent = tab === 'events' ? '＋ 予定を追加' : '＋ 予約を追加';
      btn.disabled = tab === 'reservations' && payload && !payload.reservation_available;
    }
    function reservationFlagsHtml(row) {
      const flags = [];
      const allergy = notableAllergy(row.allergy_label);
      const dislikes = String(row.dislikes_label || '').trim();
      const birthday = notableBirthday(row);
      if (allergy) flags.push('<div class="flag allergy">⚠ アレルギー: ' + escapeHtml(allergy) + '</div>');
      if (dislikes && dislikes !== allergy) flags.push('<div class="flag allergy">苦手: ' + escapeHtml(dislikes) + '</div>');
      if (birthday) flags.push('<div class="flag birthday">' + escapeHtml(birthdayFlagText(birthday)) + '</div>');
      return flags.join('');
    }

    document.querySelectorAll('.tab').forEach((btn) => {
      btn.onclick = () => {
        tab = btn.getAttribute('data-tab') || 'reservations';
        document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('active', el === btn));
        renderAll();
      };
      btn.classList.toggle('active', (btn.getAttribute('data-tab') || 'reservations') === tab);
    });
    $('addBtn').onclick = () => openEditForm(tab === 'events' ? 'event' : 'reservation', null);
    $('prevMonth').onclick = () => { month = shiftMonth(month, -1); selectedDay = ''; load(); };
    $('nextMonth').onclick = () => { month = shiftMonth(month, 1); selectedDay = ''; load(); };

    async function load() {
      $('monthLabel').textContent = month.replace('-', '年') + '月';
      $('errorNote').classList.add('hidden');
      $('list').innerHTML = '<p class="empty">読み込み中…</p>';
      if (!Number.isSafeInteger(groupId) || groupId <= 0) {
        $('errorNote').textContent = 'ルームが指定されていません。M-talkから開き直してください。';
        $('errorNote').classList.remove('hidden');
        $('calGrid').innerHTML = '';
        $('list').innerHTML = '';
        updateAddButton();
        return;
      }
      const { data: sessionData } = await sb.auth.getSession();
      const token = sessionData?.session?.access_token;
      if (!token) {
        $('loginNote').classList.remove('hidden');
        $('calGrid').innerHTML = '';
        $('list').innerHTML = '';
        updateAddButton();
        return;
      }
      try {
        const url = CONFIG.adminApiUrl
          ? CONFIG.adminApiUrl('/chat-schedule?group_id=' + encodeURIComponent(String(groupId)) + '&month=' + encodeURIComponent(month))
          : (SUPABASE_URL.replace(/\/+$/, '') + '/functions/v1/admin-api/chat-schedule?group_id=' + encodeURIComponent(String(groupId)) + '&month=' + encodeURIComponent(month));
        const response = await fetch(url, {
          headers: { Authorization: 'Bearer ' + token, apikey: SUPABASE_ANON_KEY }
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || ('HTTP ' + response.status));
        payload = result;
        const storeName = STORE_NAMES[result.store_key] || result.store_key || '';
        $('roomSub').textContent = [result.room_name, storeName].filter(Boolean).join(' / ');
        renderAll();
      } catch (error) {
        payload = null;
        $('errorNote').textContent = error.message || '読み込みに失敗しました。';
        $('errorNote').classList.remove('hidden');
        $('calGrid').innerHTML = '';
        $('list').innerHTML = '';
        updateAddButton();
      }
    }

    function collectMarks() {
      const marks = new Map();
      if (tab === 'reservations') {
        for (const row of payload?.reservations || []) {
          const key = dayKey(row.visit_at);
          if (!key) continue;
          marks.set(key, { resv: true, evt: false });
        }
      } else {
        for (const row of payload?.events || []) {
          const key = dayKey(row.starts_at);
          if (!key) continue;
          marks.set(key, { resv: false, evt: true });
        }
      }
      return marks;
    }

    function renderCalendar() {
      const [year, monthNum] = month.split('-').map(Number);
      const first = new Date(`${month}-01T12:00:00+09:00`);
      const startPad = first.getUTCDay();
      const days = new Date(year, monthNum, 0).getDate();
      const todayKey = dayKey(new Date().toISOString());
      const marks = collectMarks();
      const cells = [];
      for (let i = 0; i < startPad; i += 1) cells.push('<div class="cal-cell out"></div>');
      for (let day = 1; day <= days; day += 1) {
        const key = month + '-' + String(day).padStart(2, '0');
        const mark = marks.get(key);
        const wd = (startPad + day - 1) % 7;
        const cls = [
          'cal-cell',
          wd === 0 ? 'sun' : '',
          wd === 6 ? 'sat' : '',
          key === todayKey ? 'today' : '',
          key === selectedDay ? 'selected' : '',
        ].filter(Boolean).join(' ');
        cells.push(
          '<button type="button" class="' + cls + '" data-day="' + key + '">' +
          '<span class="cal-num">' + day + '</span>' +
          '<span class="cal-marks">' +
            (mark?.resv ? '<i class="dot resv"></i>' : '') +
            (mark?.evt ? '<i class="dot evt"></i>' : '') +
          '</span></button>'
        );
      }
      $('calGrid').innerHTML = cells.join('');
      $('calGrid').querySelectorAll('[data-day]').forEach((btn) => {
        btn.onclick = () => selectDay(btn.getAttribute('data-day') || '');
      });
      if ($('legendResv')) $('legendResv').classList.toggle('hidden', tab !== 'reservations');
      if ($('legendEvt')) $('legendEvt').classList.toggle('hidden', tab !== 'events');
    }

    function dayHasKind(key, kind) {
      if (kind === 'event') return (payload?.events || []).some((row) => dayKey(row.starts_at) === key);
      return (payload?.reservations || []).some((row) => dayKey(row.visit_at) === key);
    }

    function selectDay(key) {
      if (!key) return;
      selectedDay = key;
      renderAll();
      requestAnimationFrame(() => {
        requestAnimationFrame(() => scrollToSelectedDay());
      });
    }

    function scrollToSelectedDay() {
      if (!selectedDay) return;
      const target = document.getElementById('day-' + selectedDay);
      if (!target) return;
      const header = document.querySelector('header');
      const offset = (header ? header.getBoundingClientRect().height : 0) + 8;
      const top = target.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }

    function renderAll() {
      renderCalendar();
      renderList();
      updateAddButton();
    }

    function renderList() {
      const note = $('reservationNote');
      if (tab === 'reservations' && payload?.reservation_note) {
        note.textContent = payload.reservation_note;
        note.classList.remove('hidden');
      } else {
        note.classList.add('hidden');
      }
      const items = tab === 'events'
        ? (payload?.events || []).map((row) => ({
            kind: 'event',
            sort: row.starts_at || '',
            iso: row.starts_at,
            time: [timeLabel(row.starts_at), row.ends_at ? timeLabel(row.ends_at) : ''].filter(Boolean).join('–'),
            title: row.title || '予定',
            meta: row.description || row.source || '',
            raw: row,
          }))
        : (payload?.reservations || []).map((row) => ({
            kind: 'reservation',
            sort: row.visit_at || '',
            iso: row.visit_at,
            time: row.visit_time_label || timeLabel(row.visit_at),
            title: row.customer_name || '予約',
            meta: [row.party_size_label, sourceLabel(row.source)].filter(Boolean).join(' / '),
            plan: row.plan_label || '',
            raw: row,
          }));
      items.sort((a, b) => String(a.sort).localeCompare(String(b.sort)));
      const groups = new Map();
      for (const item of items) {
        const key = dayKey(item.iso) || 'none';
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(item);
      }
      if (selectedDay && !groups.has(selectedDay)) groups.set(selectedDay, []);
      if (!groups.size) {
        $('list').innerHTML = '<p class="empty">' + (tab === 'events' ? 'この月の予定はありません。' : 'この月の予約はありません。') + '</p>';
        return;
      }
      const orderedKeys = [...groups.keys()].sort((a, b) => {
        if (a === 'none') return 1;
        if (b === 'none') return -1;
        return a.localeCompare(b);
      });
      const html = [];
      for (const key of orderedKeys) {
        const rows = groups.get(key) || [];
        const heading = key === 'none'
          ? '日時未設定'
          : (rows[0] ? dayLabel(rows[0].iso) : dayLabel(key + 'T12:00:00+09:00'));
        html.push(
          '<section class="day' + (key === selectedDay ? ' selected-day' : '') + '" id="day-' + escapeHtml(key) + '">' +
          '<h2>' + escapeHtml(heading) + '</h2>'
        );
        if (!rows.length) {
          html.push('<p class="empty">' + (tab === 'events' ? 'この日の予定はありません。' : 'この日の予約はありません。') + '</p>');
        }
        rows.forEach((row, index) => {
          html.push(
            '<button type="button" class="card' + (row.kind === 'reservation' ? ' card-resv' : ' card-evt') + '" data-kind="' + row.kind + '" data-key="' + escapeHtml(key) + '" data-index="' + index + '">' +
            '<div class="time">' + escapeHtml(row.time || '時間未設定') + '</div>' +
            '<div class="name">' + escapeHtml(row.title) + '</div>' +
            (row.meta ? '<div class="meta">' + escapeHtml(row.meta) + '</div>' : '') +
            (row.plan ? '<div class="plan">' + escapeHtml(row.plan) + '</div>' : '') +
            (row.kind === 'reservation' ? reservationFlagsHtml(row.raw) : '') +
            '</button>'
          );
        });
        html.push('</section>');
      }
      $('list').innerHTML = html.join('');
      $('list').querySelectorAll('.card').forEach((btn) => {
        btn.onclick = () => {
          const kind = btn.getAttribute('data-kind');
          const key = btn.getAttribute('data-key');
          const index = Number(btn.getAttribute('data-index'));
          const rows = groups.get(key) || [];
          const row = rows[index];
          if (!row) return;
          openDetail(kind, row.raw);
        };
      });
    }

    function openDetail(kind, raw) {
      editing = { kind, raw, mode: 'view' };
      const rows = kind === 'event'
        ? [
            { label: '日時', value: (timeLabel(raw.starts_at) || '') + (raw.ends_at ? ' – ' + timeLabel(raw.ends_at) : ''), cls: '' },
            { label: '内容', value: raw.title || '', cls: '' },
            { label: '詳細', value: raw.description || 'なし', cls: '' },
            { label: '登録元', value: raw.source || '', cls: '' },
          ]
        : reservationDetailRows(raw);
      $('detailSheet').className = 'sheet' + (kind === 'reservation' ? ' sheet-resv' : '');
      $('detailSheet').innerHTML =
        '<h3>' + escapeHtml(kind === 'event' ? (raw.title || '予定') : (raw.customer_name || '予約')) + '</h3>' +
        rows.filter((row) => String(row.value || '').trim()).map((row) =>
          '<div class="row' + (row.cls ? ' ' + row.cls : '') + '"><span>' + escapeHtml(row.label) + '</span><div>' + escapeHtml(row.value) + '</div></div>'
        ).join('') +
        '<div class="actions-row">' +
          '<button class="btn primary" type="button" id="detailEditBtn">編集・日付変更</button>' +
          '<button class="btn danger" type="button" id="detailCancelBtn">' + (kind === 'event' ? '削除' : 'キャンセル') + '</button>' +
        '</div>' +
        '<button class="close" type="button" onclick="closeDetail()">閉じる</button>';
      $('detail').classList.remove('hidden');
      $('detailEditBtn').onclick = () => openEditForm(kind, raw);
      $('detailCancelBtn').onclick = () => cancelCurrentItem(kind, raw);
    }
    function reservationDetailRows(raw) {
      const allergy = notableAllergy(raw.allergy_label);
      const birthday = notableBirthday(raw);
      const plan = String(raw.plan_label || '').trim();
      const requestNote = String(raw.request_note_label || '').trim();
      const dislikes = String(raw.dislikes_label || '').trim();
      const rows = [
        { label: '来店', value: raw.visit_time_label || timeLabel(raw.visit_at), cls: '' },
        { label: '予約者', value: raw.customer_name || '', cls: '' },
        { label: '人数', value: raw.party_size_label || '', cls: '' },
        { label: '経路', value: raw.route_label || sourceLabel(raw.source), cls: '' },
        { label: 'コース', value: plan, cls: '' },
        { label: 'アレルギー', value: allergy || 'なし', cls: allergy ? 'note' : '' },
      ];
      if (birthday && birthday !== plan) {
        rows.push({ label: isBirthdayText(birthday) && !BIRTHDAY_RE.test(birthday) ? '記念日' : 'お誕生日', value: birthday, cls: 'note' });
      }
      if (dislikes) rows.push({ label: '苦手', value: dislikes, cls: 'note' });
      if (requestNote && requestNote !== birthday) {
        rows.push({ label: '要望', value: requestNote, cls: 'note' });
      }
      rows.push(
        { label: 'TEL', value: raw.customer_phone || '', cls: '' },
        { label: '来店回数', value: raw.visit_count ? raw.visit_count + '回' : '', cls: '' },
        { label: '店舗', value: raw.store_name || '', cls: '' },
      );
      return rows;
    }
    function fieldHtml(id, label, type, value, extra) {
      const input = type === 'textarea'
        ? '<textarea id="' + id + '"' + (extra || '') + '>' + escapeHtml(value || '') + '</textarea>'
        : '<input id="' + id + '" type="' + type + '" value="' + escapeHtml(value || '') + '"' + (extra || '') + '>';
      return '<div class="field"><label for="' + id + '">' + escapeHtml(label) + '</label>' + input + '</div>';
    }
    function openEditForm(kind, raw) {
      if (kind === 'reservation' && payload && !payload.reservation_available) {
        $('errorNote').textContent = payload.reservation_note || 'このルームでは予約を編集できません。';
        $('errorNote').classList.remove('hidden');
        return;
      }
      editing = { kind, raw: raw || null, mode: raw ? 'edit' : 'create' };
      const isEvent = kind === 'event';
      const title = raw
        ? (isEvent ? '予定を編集' : '予約を編集')
        : (isEvent ? '予定を追加' : '予約を追加');
      let fields = '';
      if (isEvent) {
        fields =
          fieldHtml('ef_starts', '開始日時', 'datetime-local', raw ? isoToLocalInput(raw.starts_at) : defaultDateTimeValue('10')) +
          fieldHtml('ef_ends', '終了日時（任意）', 'datetime-local', raw ? isoToLocalInput(raw.ends_at) : '') +
          fieldHtml('ef_title', '内容', 'text', raw ? (raw.title || '') : '') +
          fieldHtml('ef_desc', '詳細', 'textarea', raw ? (raw.description || '') : '');
      } else {
        fields =
          fieldHtml('ef_visit', '来店日時', 'datetime-local', raw ? isoToLocalInput(raw.visit_at) : defaultDateTimeValue('18')) +
          fieldHtml('ef_name', '予約者', 'text', raw ? (raw.customer_name || '') : '') +
          fieldHtml('ef_phone', 'TEL', 'tel', raw ? (raw.customer_phone || '') : '') +
          fieldHtml('ef_party', '人数', 'text', raw ? (raw.party_size_label || '') : '', ' placeholder="例: 2名"') +
          fieldHtml('ef_plan', 'コース', 'text', raw ? (raw.plan_label || '') : '') +
          fieldHtml('ef_allergy', 'アレルギー', 'text', notableAllergy(raw && raw.allergy_label) || '') +
          fieldHtml('ef_anniversary', 'お誕生日・記念日', 'text', raw ? (raw.anniversary_label || '') : '') +
          fieldHtml('ef_request', '要望', 'text', raw ? (raw.request_note_label || '') : '') +
          fieldHtml('ef_dislikes', '苦手', 'text', raw ? (raw.dislikes_label || '') : '');
      }
      $('detailSheet').className = 'sheet' + (isEvent ? '' : ' sheet-resv');
      $('detailSheet').innerHTML =
        '<h3>' + escapeHtml(title) + '</h3>' +
        fields +
        '<p class="form-error" id="editError"></p>' +
        '<div class="actions-row">' +
          '<button class="btn primary" type="button" id="editSaveBtn">保存</button>' +
          (raw ? '<button class="btn danger" type="button" id="editCancelBtn">' + (isEvent ? '削除' : 'キャンセル') + '</button>' : '') +
        '</div>' +
        '<button class="close" type="button" onclick="closeDetail()">閉じる</button>';
      $('detail').classList.remove('hidden');
      $('editSaveBtn').onclick = () => saveEditForm();
      if (raw && $('editCancelBtn')) $('editCancelBtn').onclick = () => cancelCurrentItem(kind, raw);
    }
    async function saveEditForm() {
      if (!editing) return;
      const err = $('editError');
      const saveBtn = $('editSaveBtn');
      err.textContent = '';
      saveBtn.disabled = true;
      try {
        if (editing.kind === 'event') {
          const starts = localInputToIso($('ef_starts').value);
          if (!starts) throw new Error('開始日時を入力してください。');
          const title = String($('ef_title').value || '').trim();
          if (!title) throw new Error('予定の内容を入力してください。');
          const endsRaw = String($('ef_ends').value || '').trim();
          const body = {
            group_id: groupId,
            title,
            description: String($('ef_desc').value || '').trim(),
            starts_at: starts,
            ends_at: endsRaw ? localInputToIso(endsRaw) : '',
          };
          if (editing.raw && editing.raw.id) {
            body.id = editing.raw.id;
            await apiSend('/chat-schedule/event', 'PATCH', body);
          } else {
            await apiSend('/chat-schedule/event', 'POST', body);
          }
          const nextMonth = isoToMonth(starts);
          if (nextMonth) month = nextMonth;
          tab = 'events';
          document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('active', el.getAttribute('data-tab') === 'events'));
          selectedDay = dayKey(starts);
        } else {
          const visitAt = localInputToIso($('ef_visit').value);
          if (!visitAt) throw new Error('来店日時を入力してください。');
          const name = String($('ef_name').value || '').trim();
          if (!name) throw new Error('予約者名を入力してください。');
          const body = {
            group_id: groupId,
            visit_at: visitAt,
            customer_name: name,
            customer_phone: String($('ef_phone').value || '').trim(),
            party_size_label: String($('ef_party').value || '').trim(),
            plan_label: String($('ef_plan').value || '').trim(),
            allergy_label: String($('ef_allergy').value || '').trim(),
            anniversary_label: String($('ef_anniversary').value || '').trim(),
            request_note_label: String($('ef_request').value || '').trim(),
            dislikes_label: String($('ef_dislikes').value || '').trim(),
          };
          if (editing.raw && editing.raw.id) {
            body.source = editing.raw.source;
            body.id = editing.raw.id;
            await apiSend('/chat-schedule/reservation', 'PATCH', body);
          } else {
            await apiSend('/chat-schedule/reservation', 'POST', body);
          }
          const nextMonth = isoToMonth(visitAt);
          if (nextMonth) month = nextMonth;
          tab = 'reservations';
          document.querySelectorAll('.tab').forEach((el) => el.classList.toggle('active', el.getAttribute('data-tab') === 'reservations'));
          selectedDay = dayKey(visitAt);
        }
        closeDetail();
        await load();
        requestAnimationFrame(() => {
          requestAnimationFrame(() => scrollToSelectedDay());
        });
      } catch (error) {
        err.textContent = error.message || '保存に失敗しました。';
      } finally {
        saveBtn.disabled = false;
      }
    }
    async function cancelCurrentItem(kind, raw) {
      if (!raw || !raw.id) return;
      const isEvent = kind === 'event';
      const ok = confirm(isEvent
        ? 'この予定を削除します。よろしいですか？'
        : 'この予約をキャンセルします。一覧からは消えますが、記録は残ります。よろしいですか？');
      if (!ok) return;
      try {
        if (isEvent) {
          await apiSend('/chat-schedule/event', 'PATCH', { group_id: groupId, id: raw.id, cancel: true });
        } else {
          await apiSend('/chat-schedule/reservation', 'PATCH', {
            group_id: groupId,
            source: raw.source,
            id: raw.id,
            cancel: true,
          });
        }
        closeDetail();
        await load();
      } catch (error) {
        const err = $('editError');
        if (err) err.textContent = error.message || '処理に失敗しました。';
        else alert(error.message || '処理に失敗しました。');
      }
    }
    function closeDetail() {
      $('detail').classList.add('hidden');
      editing = null;
    }
    window.closeDetail = closeDetail;
    load();
  </script>
</body>
</html>
