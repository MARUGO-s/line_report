<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>電子ジャーナルに聞く</title>
  <link rel="icon" type="image/svg+xml" href="icons/chat-logo-v3.svg">
  <style>
    :root, html, body {
      --bg: #111; --surface: #1c1c1e; --card: #2c2c2e; --line: #2c2c2e;
      --text: #f2f2f2; --muted: #8e8e93; --meta: #aeaeb2; --accent: #06c755;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    body { display: flex; flex-direction: column;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    header {
      display: flex; align-items: center; gap: 10px; padding: 12px 14px;
      border-bottom: 1px solid var(--line); background: var(--surface); flex: 0 0 auto;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; flex: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn { border: 0; border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
      background: var(--card); color: var(--text); }
    .btn.primary { background: var(--accent); color: #06231a; font-weight: 700; }
    .btn:disabled { opacity: .5; cursor: default; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      border-bottom: 1px solid var(--line); flex: 0 0 auto; }
    .bar label { font-size: 12px; color: var(--muted); }
    input[type="month"], textarea {
      background: var(--card); color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 11px; font-size: 15px; font-family: inherit;
    }
    #thread { flex: 1 1 auto; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 88%; padding: 11px 13px; border-radius: 14px; font-size: 15px; line-height: 1.65;
      white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: var(--accent); color: #06231a; }
    .msg.ai { align-self: flex-start; background: var(--card); }
    .meta { font-size: 11px; color: var(--muted); margin-top: 6px; }
    .meta.warn { color: #ff8a80; }
    .msg-actions { display: flex; gap: 6px; margin-top: 8px; }
    .msg-actions button { border: 0; border-radius: 999px; padding: 5px 11px; font-size: 11px;
      background: rgba(255,255,255,.09); color: var(--meta); cursor: pointer; }
    .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 20px; line-height: 1.9; }
    footer { flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--surface);
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; }
    footer textarea { flex: 1; resize: none; max-height: 120px; }
    .notice { margin: 14px; padding: 12px 14px; border-radius: 12px; background: var(--card);
      color: var(--meta); font-size: 13px; line-height: 1.8; }

    /* PDFは既存のジャーナル画面と同じく window.print() で出す（PDFライブラリは入れない）。 */
    #printReport { display: none; }
    @media print {
      @page { size: A4; margin: 12mm 12mm; }
      body.printing { background: #fff !important; color: #111 !important;
        -webkit-print-color-adjust: exact; print-color-adjust: exact; display: block; }
      body.printing > *:not(#printReport) { display: none !important; }
      body.printing #printReport { display: block !important; }
      #printReport { color: #111; font-size: 11.5pt; line-height: 1.7; }
      .print-head { border-bottom: 2px solid #111; padding-bottom: 10px; margin-bottom: 16px; }
      .print-kicker { font-size: 9pt; letter-spacing: .08em; color: #666; }
      .print-head h1 { margin: 4px 0 8px; font-size: 17pt; }
      .print-meta { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 9.5pt; color: #444; }
      .print-turn { margin: 0 0 14px; page-break-inside: avoid; }
      .print-q { font-weight: 700; margin: 0 0 5px; }
      .print-q::before { content: "Q. "; color: #666; }
      .print-a { margin: 0; white-space: pre-wrap; }
      .print-a::before { content: "A. "; color: #666; font-weight: 700; }
      .print-note { margin: 4px 0 0; font-size: 8.5pt; color: #777; }
      .print-warn { margin: 4px 0 0; font-size: 8.5pt; color: #b03a2e; }
      .print-foot { margin-top: 18px; padding-top: 8px; border-top: 1px solid #bbb;
        font-size: 8.5pt; color: #666; display: flex; justify-content: space-between; }
    }
  </style>
</head>
<body>
  <header>
    <button class="btn" type="button" id="backBtn">← 戻る</button>
    <h1>電子ジャーナルに聞く</h1>
  </header>
  <div class="bar">
    <label for="monthSel">対象月</label>
    <input type="month" id="monthSel">
    <button class="btn" type="button" id="pdfBtn" title="このやり取りをPDFにする">PDF</button>
    <button class="btn" type="button" id="clearBtn" title="この画面の会話を消す">履歴を消す</button>
  </div>
  <div id="thread"><div class="empty">読み込んでいます…</div></div>
  <footer>
    <textarea id="q" rows="1" placeholder="質問を入力（例: 前年同月より伸びた商品は？）"></textarea>
    <button class="btn primary" type="button" id="askBtn">送信</button>
  </footer>

  <div id="printReport" aria-hidden="true"></div>

  <script src="vendor/supabase/supabase-2.110.9.min.js"></script>
  <script src="pages-config.js"></script>
  <script>
    const CONFIG = window.LINE_REPORT_PAGES || {};
    const SUPABASE_URL = CONFIG.PROJECT_URL || 'https://hocbnifuactbvmyjraxy.supabase.co';
    const SUPABASE_ANON_KEY = CONFIG.RECEIPT_ADMIN_ANON_KEY || '';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true },
    });
    const params = new URLSearchParams(location.search);
    const groupId = Number(params.get('group_id') || 0);
    const el = (id) => document.getElementById(id);
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function apiUrl(path) {
      return CONFIG.adminApiUrl
        ? CONFIG.adminApiUrl(path)
        : (SUPABASE_URL.replace(/\/+$/, '') + '/functions/v1/admin-api' + path);
    }
    // 失敗の原因が「未ログイン」「権限なし」「1対1でない」のどれか分かるようにする。
    // 区別せず1つの文言にすると、利用者も私も切り分けられない。
    function appError(message, kind) {
      const error = new Error(message);
      error.kind = kind || 'other';
      return error;
    }
    async function authHeaders() {
      const { data } = await sb.auth.getSession();
      const token = data?.session?.access_token;
      if (!token) {
        throw appError('M-talkにログインしてから開いてください。', 'signin');
      }
      return { Authorization: 'Bearer ' + token, apikey: SUPABASE_ANON_KEY, 'Content-Type': 'application/json' };
    }
    async function api(method, body) {
      const suffix = method === 'GET' ? ('?group_id=' + encodeURIComponent(String(groupId))) : '';
      const res = await fetch(apiUrl('/chat-journal-ai' + suffix), {
        method,
        headers: await authHeaders(),
        body: body ? JSON.stringify(body) : undefined,
        cache: 'no-store',
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) return data;
      const detail = String(data.error || '').trim();
      if (res.status === 401) throw appError(detail || 'ログインの有効期限が切れています。', 'signin');
      if (res.status === 403) throw appError(detail || 'この画面を使う権限がありません。', 'forbidden');
      throw appError(detail || ('通信に失敗しました（HTTP ' + res.status + '）'), 'other');
    }

    // 行き止まりにしない。必ずトークへ戻れるようにする。
    function showNotice(error) {
      const kind = error && error.kind;
      const message = esc((error && error.message) || String(error));
      const hint = kind === 'signin'
        ? 'トークの画面でログインしたあと、もう一度「ジャーナルに聞く」から開いてください。'
        : kind === 'forbidden'
          ? '店舗Bot（例: Bistro CAVACAVA）との1対1のトークから開いてください。人同士の1対1では使えません。'
          : '通信状況を確認して、もう一度お試しください。';
      el('thread').innerHTML = `<div class="notice">${message}<br><span style="color:var(--muted)">`
        + `${esc(hint)}</span><div style="margin-top:12px;display:flex;gap:8px">`
        + '<button class="btn primary" type="button" data-notice="back">トークへ戻る</button>'
        + '<button class="btn" type="button" data-notice="retry">再試行</button></div></div>';
    }

    function backToChat() {
      const url = new URL('chat.html', location.href);
      if (groupId) url.searchParams.set('group_id', String(groupId));
      location.href = url.href;
    }

    let turns = [];
    function render() {
      const box = el('thread');
      if (!turns.length) {
        box.innerHTML = '<div class="empty">対象月を選び、質問を送ってください。<br>'
          + '登録済みの電子ジャーナル（日計精算・会計明細）だけを根拠に答えます。<br>'
          + '続けて質問すると、前のやり取りを踏まえます。</div>';
        return;
      }
      box.innerHTML = turns.map((t, i) => {
        if (t.role === 'user') return `<div class="msg user">${esc(t.content)}</div>`;
        const meta = t.meta ? `<div class="meta">${esc(t.meta)}</div>` : '';
        const warn = t.warning ? `<div class="meta warn">⚠️ ${esc(t.warning)}</div>` : '';
        return `<div class="msg ai">${esc(t.content)}${warn}${meta}`
          + `<div class="msg-actions"><button type="button" data-share="${i}">この回答をトークに貼る</button></div></div>`;
      }).join('');
      box.scrollTop = box.scrollHeight;
    }

    async function load() {
      try {
        const data = await api('GET');
        turns = (data.history || []).map((row) => ({ role: row.role, content: row.content }));
        render();
      } catch (error) {
        showNotice(error);
      }
    }

    async function ask() {
      const question = el('q').value.trim();
      if (!question) return;
      const month = el('monthSel').value;
      if (!month) { alert('対象月を選んでください。'); return; }
      el('askBtn').disabled = true;
      turns.push({ role: 'user', content: question });
      el('q').value = '';
      render();
      try {
        const data = await api('POST', { group_id: groupId, month, question });
        const meta = [(data.ai_generated ? 'AI生成' : '基本回答（AI未使用）'), data.model].filter(Boolean).join(' / ');
        turns.push({ role: 'assistant', content: data.answer || '回答が空でした。', meta, warning: data.warning || '' });
      } catch (error) {
        // ログインが切れている場合は、会話に混ぜず案内に切り替える。
        if (error && error.kind === 'signin') {
          turns.pop();
          el('askBtn').disabled = false;
          showNotice(error);
          return;
        }
        turns.push({ role: 'assistant', content: String(error.message || error), meta: 'エラー' });
      } finally {
        el('askBtn').disabled = false;
        render();
      }
    }

    // 回答をトークへ流す。画面に閉じたままだと共有できないため。
    async function shareToChat(index) {
      const turn = turns[index];
      if (!turn || !groupId) return;
      const { data: sessionData } = await sb.auth.getSession();
      const userId = sessionData?.session?.user?.id;
      if (!userId) { alert('ログインしてください。'); return; }
      const { data: me } = await sb.from('chat_users').select('username').eq('id', userId).maybeSingle();
      const { error } = await sb.from('chat_messages').insert({
        group_id: groupId,
        user_id: userId,
        username: me?.username || '',
        content: '[電子ジャーナル]\n' + String(turn.content).slice(0, 1800),
      });
      if (error) alert('トークへ貼れませんでした: ' + error.message);
      else alert('トークに貼りました。');
    }

    // Q&Aを1枚にまとめてPDFへ。既存のジャーナル画面と同じく window.print() を使う
    // （PDFライブラリを増やさない。印刷ダイアログから「PDFとして保存」を選ぶ）。
    function printReportHtml() {
      const month = el('monthSel').value || '';
      const now = new Date();
      const stamp = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/`
        + `${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:`
        + `${String(now.getMinutes()).padStart(2, '0')}`;

      // 質問と回答を1往復ずつ組にする。相手が無い分も落とさない。
      const blocks = [];
      for (let i = 0; i < turns.length; i += 1) {
        if (turns[i].role !== 'user') continue;
        const answer = turns[i + 1] && turns[i + 1].role === 'assistant' ? turns[i + 1] : null;
        blocks.push({ q: turns[i].content, a: answer });
      }
      const body = blocks.map((b) => {
        const note = b.a && b.a.meta ? `<p class="print-note">${esc(b.a.meta)}</p>` : '';
        const warn = b.a && b.a.warning ? `<p class="print-warn">⚠️ ${esc(b.a.warning)}</p>` : '';
        const ans = b.a ? esc(b.a.content) : '（回答なし）';
        return `<div class="print-turn"><p class="print-q">${esc(b.q)}</p>`
          + `<p class="print-a">${ans}</p>${warn}${note}</div>`;
      }).join('');

      return '<div class="print-head"><div class="print-kicker">LINE Report / M-talk</div>'
        + '<h1>電子ジャーナル Q&amp;A</h1><div class="print-meta">'
        + `<span>対象月: ${esc(month)}</span><span>出力: ${esc(stamp)}</span>`
        + `<span>やり取り: ${blocks.length}件</span></div></div>`
        + (body || '<p>やり取りがありません。</p>')
        + '<div class="print-foot"><span>登録済みの電子ジャーナルのみを根拠にしています。</span>'
        + '<span>保存時点のデータに基づきます。</span></div>';
    }

    function savePdf() {
      if (!turns.length) { alert('PDFにできるやり取りがありません。'); return; }
      const report = el('printReport');
      report.innerHTML = printReportHtml();
      report.setAttribute('aria-hidden', 'false');
      const previousTitle = document.title;
      document.title = `電子ジャーナルQA_${(el('monthSel').value || '').replace('-', '')}`;
      document.body.classList.add('printing');
      const cleanup = () => {
        document.body.classList.remove('printing');
        document.title = previousTitle;
        report.setAttribute('aria-hidden', 'true');
        window.removeEventListener('afterprint', cleanup);
      };
      window.addEventListener('afterprint', cleanup);
      setTimeout(() => { window.print(); setTimeout(cleanup, 1500); }, 50);
    }

    el('pdfBtn').addEventListener('click', savePdf);
    el('backBtn').addEventListener('click', backToChat);
    el('askBtn').addEventListener('click', ask);
    el('thread').addEventListener('click', (e) => {
      const share = e.target.closest('[data-share]');
      if (share) { shareToChat(Number(share.dataset.share)); return; }
      const notice = e.target.closest('[data-notice]');
      if (!notice) return;
      if (notice.dataset.notice === 'back') backToChat();
      else load();
    });
    el('clearBtn').addEventListener('click', () => {
      if (!confirm('この画面の会話を消しますか？（トークの発言は消えません）')) return;
      turns = [];
      render();
    });
    el('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ask(); }
    });

    (function init() {
      const now = new Date();
      el('monthSel').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      if (!groupId) {
        showNotice(appError('トークから開いてください。', 'other'));
        return;
      }
      load();
    })();
  </script>
</body>
</html>
