name = "line-wine-gateway"
main = "src/index.js"
compatibility_date = "2026-03-10"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[durable_objects]
bindings = [{ name = "SCHEDULE_STORE", class_name = "ScheduleStore" }]

[[migrations]]
tag = "v1"
new_classes = ["ScheduleStore"]

[vars]
APP_URL = "https://line-wine-api.onrender.com"
HEALTH_URL = "https://line-wine-api.onrender.com/api/health"
HEALTH_TIMEOUT_MS = "2500"
RENDER_SERVICE_ID = "srv-d6mmfgvtskes73e082ag"
AUTO_SUSPEND_RESUME_ENABLED = "true"
SUSPEND_TIME_JST = "02:00"
RESUME_TIME_JST = "12:00"
