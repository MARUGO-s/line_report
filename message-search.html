<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <base href="/line_report/">
  <script>
    /* LINE経由（店舗）アクセスは売上分析ページのみ許可。このページは売上分析へ強制リダイレクト。 */
    (function(){
      try {
        var p = new URLSearchParams(location.search);
        var isLine = (p.get('from') === 'line') || /Line\//i.test(String(navigator.userAgent || ''));
        if (!isLine) return;
        var sk = '';
        try { sk = sessionStorage.getItem('line_locked_store') || localStorage.getItem('line_locked_store') || ''; } catch (_) {}
        location.replace('/line_report/analytics.html?from=line' + (sk ? ('&store_key=' + encodeURIComponent(sk)) : ''));
      } catch (_) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://hocbnifuactbvmyjraxy.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'">
  <title>会話検索 | LINE Report</title>
  <link rel="icon" type="image/svg+xml" href="icons/logo-mark.svg">
  <style>
    :root {
      --bg0: #061320;
      --bg1: #173247;
      --card: rgba(8, 21, 35, 0.88);
      --line: rgba(155, 220, 255, 0.25);
      --txt: #e7f6ff;
      --sub: #a6cadf;
      --accent: #57d8ff;
      --ok: #69edbf;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--txt);
      font-family: "Zen Kaku Gothic New", system-ui, sans-serif;
      background: linear-gradient(145deg, var(--bg0), var(--bg1));
      padding: 20px;
    }
    .app { max-width: 960px; margin: 0 auto; display: grid; gap: 16px; }
    .hero, .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--card);
      padding: 18px 20px;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; }
    p { margin: 0; color: var(--sub); line-height: 1.5; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
    .input, select {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(0,0,0,0.25);
      color: var(--txt);
      padding: 10px 12px;
      min-width: 0;
    }
    .input.grow { flex: 1 1 220px; }
    .button {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(87, 216, 255, 0.12);
      color: var(--txt);
      padding: 10px 14px;
      cursor: pointer;
    }
    .button.primary { background: rgba(87, 216, 255, 0.28); }
    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.82rem;
      color: var(--sub);
    }
    .pill.link { color: var(--accent); text-decoration: none; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 8px 14px;
      background: transparent;
      color: var(--sub);
      cursor: pointer;
    }
    .tab.active { background: rgba(87, 216, 255, 0.2); color: var(--txt); }
    .results { display: grid; gap: 10px; margin-top: 12px; }
    .hit {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: rgba(0,0,0,0.18);
    }
    .hit-meta { font-size: 0.82rem; color: var(--sub); margin-bottom: 6px; }
    .hit-snippet { line-height: 1.55; word-break: break-word; }
    mark { background: rgba(105, 237, 191, 0.35); color: inherit; padding: 0 2px; border-radius: 3px; }
    .empty { color: var(--sub); padding: 12px 0; }
    .error { color: #ff9f9f; }
    .pager { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    [hidden] { display: none !important; }

    /* ルーム選択: アコーディオン式カスタムドロップダウン */
    .room-chooser { position: relative; flex: 1 1 300px; min-width: 0; }
    .room-chooser-trigger {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      text-align: left; cursor: pointer;
    }
    .room-chooser-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .room-chooser-label.placeholder { color: var(--sub); }
    .room-chooser-caret { color: var(--sub); flex: 0 0 auto; font-size: 0.8em; }
    .room-chooser-panel {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 50;
      max-height: 380px; overflow-y: auto;
      border: 1px solid var(--line); border-radius: 10px;
      background: #0a1d30; box-shadow: 0 14px 36px rgba(0,0,0,0.5);
      padding: 6px;
    }
    .rc-item {
      display: flex; align-items: center; gap: 8px;
      padding: 9px 10px; border-radius: 8px; cursor: pointer;
      color: var(--txt); line-height: 1.35; user-select: none;
    }
    .rc-item:hover { background: rgba(87,216,255,0.14); }
    .rc-item.selected { background: rgba(87,216,255,0.24); }
    .rc-caret { flex: 0 0 auto; color: var(--sub); font-size: 0.75em; transition: transform 0.15s; }
    .rc-group.open > .rc-caret { transform: rotate(90deg); }
    .rc-count { margin-left: auto; font-size: 0.78rem; color: var(--sub); }
    .rc-sub { margin: 2px 0 4px 10px; padding-left: 8px; border-left: 2px solid var(--line); }
    .rc-leaf { padding-left: 12px; font-size: 0.95rem; color: var(--sub); }
    .rc-leaf:hover, .rc-leaf.selected { color: var(--txt); }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>会話・予定検索</h1>
      <p>保存期間は直近1年です。ルーム単位の会話検索・全会話の横断検索・ルーム内の予定検索に対応しています。</p>
      <div class="row">
        <span id="authState" class="pill">未接続</span>
        <a href="./index.html" class="pill link">管理画面へ</a>
      </div>
      <div class="row">
        <input id="tokenInput" class="input grow" type="password" placeholder="ADMIN_DASHBOARD_TOKEN または lrst_ セッション">
        <button id="saveTokenBtn" class="button primary" type="button">保存して接続</button>
      </div>
    </header>

    <section class="card">
      <div class="tabs" role="tablist">
        <button type="button" class="tab active" data-mode="room-messages">ルーム会話</button>
        <button type="button" class="tab" data-mode="global-messages">全会話（横断）</button>
        <button type="button" class="tab" data-mode="room-calendar">ルーム予定</button>
      </div>

      <div class="row">
        <div id="roomChooser" class="room-chooser">
          <button type="button" id="roomChooserTrigger" class="input room-chooser-trigger" aria-haspopup="listbox" aria-expanded="false">
            <span id="roomChooserLabel" class="room-chooser-label placeholder">ルームを選択</span>
            <span class="room-chooser-caret" aria-hidden="true">▾</span>
          </button>
          <div id="roomChooserPanel" class="room-chooser-panel" role="listbox" hidden></div>
        </div>
        <select id="roomSelect" hidden aria-hidden="true" tabindex="-1"></select>
        <input id="queryInput" class="input grow" type="search" placeholder="キーワード（部分一致）" autocomplete="off">
        <button id="searchBtn" class="button primary" type="button">検索</button>
      </div>

      <p id="modeHint" class="empty" style="margin-top:10px;font-size:0.9rem;"></p>
      <p id="statusText" class="empty"></p>
      <div id="results" class="results"></div>
      <div class="pager" id="pager" hidden>
        <button id="prevBtn" class="button" type="button">前へ</button>
        <span id="pagerMeta" class="pill"></span>
        <button id="nextBtn" class="button" type="button">次へ</button>
      </div>
    </section>
  </div>

  <script src="pages-config.js"></script>
  <script src="admin-auth.js"></script>
  <script>
    'use strict';

    const STORE_TOKEN_KEY = 'line_summary_admin_token';
    const FIXED_PROJECT_URL = (window.LINE_REPORT_PAGES && LINE_REPORT_PAGES.PROJECT_URL) || 'https://hocbnifuactbvmyjraxy.supabase.co';
    const PAGE_LIMIT = 30;

    const state = {
      mode: 'room-messages',
      offset: 0,
      totalCount: 0,
      lastQuery: '',
      rooms: [],
      roomGroups: [],
    };

    const dom = {
      authState: document.getElementById('authState'),
      tokenInput: document.getElementById('tokenInput'),
      saveTokenBtn: document.getElementById('saveTokenBtn'),
      roomChooser: document.getElementById('roomChooser'),
      roomChooserTrigger: document.getElementById('roomChooserTrigger'),
      roomChooserLabel: document.getElementById('roomChooserLabel'),
      roomChooserPanel: document.getElementById('roomChooserPanel'),
      roomSelect: document.getElementById('roomSelect'),
      queryInput: document.getElementById('queryInput'),
      searchBtn: document.getElementById('searchBtn'),
      modeHint: document.getElementById('modeHint'),
      statusText: document.getElementById('statusText'),
      results: document.getElementById('results'),
      pager: document.getElementById('pager'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      pagerMeta: document.getElementById('pagerMeta'),
      tabs: document.querySelectorAll('.tab'),
    };

    function getToken() {
      return window.LINE_REPORT_AUTH ? LINE_REPORT_AUTH.getToken() : (localStorage.getItem(STORE_TOKEN_KEY) || '');
    }

    function setToken(token) {
      const next = String(token || '').trim();
      if (next) localStorage.setItem(STORE_TOKEN_KEY, next);
      else localStorage.removeItem(STORE_TOKEN_KEY);
      dom.tokenInput.value = next;
      dom.authState.textContent = next ? '接続済み' : '未接続';
    }

    async function api(path) {
      const token = getToken();
      if (!token) throw new Error('先に管理トークンを保存してください。');
      const url = LINE_REPORT_PAGES.adminApiUrl(path, FIXED_PROJECT_URL);
      const res = await fetch(url, {
        headers: { 'x-admin-token': token },
        referrerPolicy: 'no-referrer',
        cache: 'no-store',
      });
      const text = await res.text();
      let body = {};
      try { body = text ? JSON.parse(text) : {}; } catch (_) { body = { raw: text }; }
      if (!res.ok) throw new Error(body.error || ('API error: ' + res.status));
      return body;
    }

    function updateModeUi() {
      const global = state.mode === 'global-messages';
      const calendar = state.mode === 'room-calendar';
      dom.roomChooser.hidden = global; // 全会話モードではルーム選択を隠す
      if (global) closeRoomChooser();

      if (global) {
        dom.modeHint.textContent = '全会話を横断して検索します（「会話検索」がONのルームのみ・直近1年）。';
      } else if (calendar) {
        dom.modeHint.textContent = '選択ルームの予定（タイトル・説明）を直近1年分から検索します。';
      } else {
        dom.modeHint.textContent = '選択ルームのトークを検索します（「会話検索」がONのルームのみ・直近1年。OFF中も記録は継続されます）。';
      }

      dom.tabs.forEach(function(tab) {
        tab.classList.toggle('active', tab.dataset.mode === state.mode);
      });
    }

    function openRoomChooser() {
      dom.roomChooserPanel.hidden = false;
      dom.roomChooserTrigger.setAttribute('aria-expanded', 'true');
    }
    function closeRoomChooser() {
      dom.roomChooserPanel.hidden = true;
      dom.roomChooserTrigger.setAttribute('aria-expanded', 'false');
    }
    function setRoomChooserLabel(text) {
      const has = !!text;
      dom.roomChooserLabel.textContent = has ? text : 'ルームを選択';
      dom.roomChooserLabel.classList.toggle('placeholder', !has);
    }

    // アコーディオン式の選択UIを構築。検索は dom.roomSelect.value（隠しselect）を読む。
    function fillRoomChooser(groups) {
      // 値保持用の隠しselectに全ルームを入れる
      dom.roomSelect.innerHTML = '<option value=""></option>';
      groups.forEach(function(g) {
        g.rooms.forEach(function(r) {
          const o = document.createElement('option');
          o.value = r.room_id;
          o.textContent = r.label;
          dom.roomSelect.appendChild(o);
        });
      });
      dom.roomSelect.value = '';

      // パネル構築
      const panel = dom.roomChooserPanel;
      panel.innerHTML = '';
      groups.forEach(function(g, gi) {
        if (g.rooms.length === 1) {
          const item = document.createElement('div');
          item.className = 'rc-item';
          item.setAttribute('data-room-id', g.rooms[0].room_id);
          item.setAttribute('data-label', g.name);
          item.textContent = g.name;
          panel.appendChild(item);
        } else {
          const header = document.createElement('div');
          header.className = 'rc-item rc-group';
          header.setAttribute('data-group', String(gi));
          const caret = document.createElement('span');
          caret.className = 'rc-caret';
          caret.textContent = '▶';
          const nm = document.createElement('span');
          nm.textContent = g.name;
          const cnt = document.createElement('span');
          cnt.className = 'rc-count';
          cnt.textContent = g.rooms.length + '件';
          header.appendChild(caret);
          header.appendChild(nm);
          header.appendChild(cnt);
          panel.appendChild(header);

          const sub = document.createElement('div');
          sub.className = 'rc-sub';
          sub.setAttribute('data-group-sub', String(gi));
          sub.hidden = true;
          g.rooms.forEach(function(r) {
            const leaf = document.createElement('div');
            leaf.className = 'rc-item rc-leaf';
            leaf.setAttribute('data-room-id', r.room_id);
            leaf.setAttribute('data-label', r.label);
            // 店名部分だけ表示（"pingus（店名）" → "店名"）。取れなければそのまま
            const m = /（(.+)）$/.exec(r.label);
            leaf.textContent = m ? m[1] : r.label;
            sub.appendChild(leaf);
          });
          panel.appendChild(sub);
        }
      });

      dom.roomSelect.value = '';
      setRoomChooserLabel('');
      closeRoomChooser();
    }

    function handleRoomChooserPanelClick(ev) {
      const header = ev.target.closest('.rc-group');
      if (header && dom.roomChooserPanel.contains(header)) {
        const gi = header.getAttribute('data-group');
        const sub = dom.roomChooserPanel.querySelector('.rc-sub[data-group-sub="' + gi + '"]');
        const open = !header.classList.contains('open');
        header.classList.toggle('open', open);
        if (sub) sub.hidden = !open;
        return;
      }
      const leaf = ev.target.closest('[data-room-id]');
      if (leaf && dom.roomChooserPanel.contains(leaf)) {
        const rid = leaf.getAttribute('data-room-id');
        const label = leaf.getAttribute('data-label') || rid;
        dom.roomSelect.value = rid;
        setRoomChooserLabel(label);
        dom.roomChooserPanel.querySelectorAll('.rc-item.selected').forEach(function(el) { el.classList.remove('selected'); });
        leaf.classList.add('selected');
        closeRoomChooser();
      }
    }

    async function loadRooms() {
      const body = await api('/state?admin_surface=' + encodeURIComponent(LINE_REPORT_PAGES.ADMIN_SURFACE || 'line_report'));

      // U... の1:1トークは room_name が無いことが多いので、
      // user_permissions（line_user_id → display_name）から表示名を解決する
      const userNameById = new Map();
      for (const row of (body.user_permissions || [])) {
        const uid = String(row && row.line_user_id ? row.line_user_id : '').trim();
        const dn = String(row && row.display_name ? row.display_name : '').trim();
        if (uid && dn && dn !== uid) userNameById.set(uid, dn);
      }

      // 店舗キー → 店名（重複名を店名で区別するため）
      const storeNameByKey = new Map();
      for (const row of (body.receipt_store_options || [])) {
        const k = String(row && (row.store_key || row.store_partition_key) || '').trim().toLowerCase();
        const n = String(row && row.store_name || '').trim();
        if (k && n) storeNameByKey.set(k, n);
      }
      // room_id → 店名（room_settings.receipt_report_store_partition_key 経由）
      const storeNameByRoom = new Map();
      for (const row of (body.room_settings || [])) {
        const rid = String(row && row.room_id || '').trim();
        const sk = String(row && row.receipt_report_store_partition_key || '').trim().toLowerCase();
        if (rid && sk && storeNameByKey.has(sk)) storeNameByRoom.set(rid, storeNameByKey.get(sk));
      }

      function resolveLabel(id, name) {
        const roomId = String(id || '').trim();
        const explicit = String(name || '').trim();
        if (explicit && explicit !== roomId) return explicit;
        // 1:1トーク（U...）は友だちの表示名で代替
        if (roomId.startsWith('U') && userNameById.has(roomId)) return userNameById.get(roomId);
        return roomId;
      }

      const map = new Map();
      function upsert(id, name) {
        const roomId = String(id || '').trim();
        if (!roomId) return;
        const label = resolveLabel(roomId, name);
        // 既に表示名で登録済みの行を、ID だけの後勝ちで上書きしない
        const prev = map.get(roomId);
        if (prev && prev !== roomId && label === roomId) return;
        map.set(roomId, label);
      }
      for (const row of (body.room_settings || [])) upsert(row.room_id, row.room_name);
      for (const row of (body.room_overview || [])) upsert(row.room_id, row.room_name);

      // 名前ごとにグルーピング（同名が複数 = 2段目で店舗別に選ぶ）。
      // 例: pingus が複数店舗Botにいる → 1段目「pingus（22件）」→2段目で店舗別。
      const groupMap = new Map(); // baseLabel -> [room_id...]
      for (const entry of map.entries()) {
        const roomId = entry[0];
        const baseLabel = entry[1];
        const arr = groupMap.get(baseLabel) || [];
        arr.push(roomId);
        groupMap.set(baseLabel, arr);
      }
      const groups = [];
      for (const kv of groupMap.entries()) {
        const name = kv[0];
        const roomIds = kv[1];
        const rooms = roomIds.map(function(rid) {
          const store = storeNameByRoom.get(rid);
          const detail = store || ('…' + rid.slice(-6));
          return { room_id: rid, detail: detail, label: name + '（' + detail + '）' };
        });
        // 同一店名が重複する場合は ID 末尾も付けて一意化（保険）
        const dCounts = {};
        rooms.forEach(function(r) { dCounts[r.label] = (dCounts[r.label] || 0) + 1; });
        rooms.forEach(function(r) {
          if (dCounts[r.label] > 1) r.label = name + '（' + r.detail + '・…' + r.room_id.slice(-6) + '）';
        });
        rooms.sort(function(a, b) { return String(a.label).localeCompare(String(b.label), 'ja'); });
        groups.push({ name: name, rooms: rooms });
      }
      groups.sort(function(a, b) { return a.name.localeCompare(b.name, 'ja'); });
      state.roomGroups = groups;
      // 互換用フラット一覧
      state.rooms = groups.reduce(function(acc, g) {
        g.rooms.forEach(function(r) {
          acc.push({ room_id: r.room_id, label: g.rooms.length > 1 ? r.label : g.name });
        });
        return acc;
      }, []);
      fillRoomChooser(groups);
    }

    function highlightSnippet(snippet, query) {
      const safe = String(snippet || '');
      const q = String(query || '').trim();
      if (!q) return escapeHtml(safe);
      const lower = safe.toLowerCase();
      const needle = q.toLowerCase();
      const idx = lower.indexOf(needle);
      if (idx < 0) return escapeHtml(safe);
      const before = escapeHtml(safe.slice(0, idx));
      const match = escapeHtml(safe.slice(idx, idx + q.length));
      const after = escapeHtml(safe.slice(idx + q.length));
      return before + '<mark>' + match + '</mark>' + after;
    }

    function escapeHtml(value) {
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString('ja-JP', { hour12: false });
    }

    function renderMessageHits(items, query) {
      if (!items.length) {
        dom.results.innerHTML = '<p class="empty">該当する会話はありません。</p>';
        return;
      }
      dom.results.innerHTML = items.map(function(item) {
        const roomLabel = item.room_name || item.room_id || '';
        return '<article class="hit">' +
          '<div class="hit-meta">' + escapeHtml(roomLabel) + ' · ' + escapeHtml(formatDate(item.created_at)) +
          (item.user_id ? ' · ' + escapeHtml(item.user_id) : '') + '</div>' +
          '<div class="hit-snippet">' + highlightSnippet(item.snippet || item.text_content, query) + '</div>' +
          '</article>';
      }).join('');
    }

    function renderCalendarHits(items) {
      if (!items.length) {
        dom.results.innerHTML = '<p class="empty">該当する予定はありません。</p>';
        return;
      }
      dom.results.innerHTML = items.map(function(item) {
        const when = item.starts_at ? formatDate(item.starts_at) : formatDate(item.created_at);
        return '<article class="hit">' +
          '<div class="hit-meta">' + escapeHtml(when) + ' · ' + escapeHtml(item.source || '') + '</div>' +
          '<div class="hit-snippet"><strong>' + escapeHtml(item.event_title) + '</strong>' +
          (item.event_description ? '<br>' + escapeHtml(item.event_description) : '') +
          '</div></article>';
      }).join('');
    }

    function updatePager() {
      const hasMore = state.offset + PAGE_LIMIT < state.totalCount;
      const show = state.totalCount > PAGE_LIMIT || state.offset > 0;
      dom.pager.hidden = !show;
      dom.pagerMeta.textContent = (state.offset + 1) + '〜' + Math.min(state.offset + PAGE_LIMIT, state.totalCount) + ' / ' + state.totalCount;
      dom.prevBtn.disabled = state.offset <= 0;
      dom.nextBtn.disabled = !hasMore;
    }

    async function runSearch() {
      const query = String(dom.queryInput.value || '').trim();
      if (!query) {
        dom.statusText.textContent = 'キーワードを入力してください。';
        dom.statusText.className = 'error';
        return;
      }

      const roomId = String(dom.roomSelect.value || '').trim();
      if (state.mode !== 'global-messages' && !roomId) {
        dom.statusText.textContent = 'ルームを選択してください。';
        dom.statusText.className = 'error';
        return;
      }

      dom.statusText.textContent = '検索中…';
      dom.statusText.className = 'empty';
      dom.searchBtn.disabled = true;

      try {
        let path = '';
        if (state.mode === 'room-calendar') {
          path = '/calendar-events/search?q=' + encodeURIComponent(query) +
            '&room_id=' + encodeURIComponent(roomId) +
            '&limit=' + PAGE_LIMIT + '&offset=' + state.offset;
          const body = await api(path);
          state.totalCount = Number(body.total_count || 0);
          state.lastQuery = query;
          renderCalendarHits(body.items || []);
        } else {
          const scope = state.mode === 'global-messages' ? '&scope=global' : '&room_id=' + encodeURIComponent(roomId);
          path = '/messages/search?q=' + encodeURIComponent(query) + scope +
            '&limit=' + PAGE_LIMIT + '&offset=' + state.offset;
          const body = await api(path);
          state.totalCount = Number(body.total_count || 0);
          state.lastQuery = query;
          renderMessageHits(body.items || [], query);
        }
        dom.statusText.textContent = state.totalCount + ' 件ヒット（直近1年）';
        dom.statusText.className = 'empty';
        updatePager();
      } catch (err) {
        dom.statusText.textContent = err.message || String(err);
        dom.statusText.className = 'error';
        dom.results.innerHTML = '';
        dom.pager.hidden = true;
      } finally {
        dom.searchBtn.disabled = false;
      }
    }

    dom.tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        state.mode = tab.dataset.mode || 'room-messages';
        state.offset = 0;
        updateModeUi();
      });
    });

    dom.roomChooserTrigger.addEventListener('click', function(ev) {
      ev.stopPropagation();
      if (dom.roomChooserPanel.hidden) openRoomChooser();
      else closeRoomChooser();
    });
    dom.roomChooserPanel.addEventListener('click', handleRoomChooserPanelClick);
    document.addEventListener('click', function(ev) {
      if (!dom.roomChooser.contains(ev.target)) closeRoomChooser();
    });

    dom.saveTokenBtn.addEventListener('click', async function() {
      setToken(dom.tokenInput.value);
      try {
        await loadRooms();
        dom.statusText.textContent = 'ルーム一覧を読み込みました。';
        dom.statusText.className = 'empty';
      } catch (err) {
        dom.statusText.textContent = err.message || String(err);
        dom.statusText.className = 'error';
      }
    });

    dom.searchBtn.addEventListener('click', function() {
      state.offset = 0;
      runSearch();
    });

    dom.queryInput.addEventListener('keydown', function(ev) {
      if (ev.key === 'Enter') {
        ev.preventDefault();
        state.offset = 0;
        runSearch();
      }
    });

    dom.prevBtn.addEventListener('click', function() {
      state.offset = Math.max(0, state.offset - PAGE_LIMIT);
      runSearch();
    });

    dom.nextBtn.addEventListener('click', function() {
      state.offset += PAGE_LIMIT;
      runSearch();
    });

    updateModeUi();
    setToken(getToken());
    if (getToken()) {
      loadRooms().catch(function(err) {
        dom.statusText.textContent = err.message || String(err);
        dom.statusText.className = 'error';
      });
    }
  </script>
</body>
</html>
